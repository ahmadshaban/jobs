name: Build and deploy jobs site
on:
  schedule:
    - cron: '17 */3 * * *'
  repository_dispatch:
    types: [sheet-edit]
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', 'site/**', 'admin.html', 'stats.html', '.github/workflows/build-site.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate static pages from the sheet
        run: |
          OUT_DIR="$GITHUB_WORKSPACE/_site" python3 scripts/build.py
          cp admin.html stats.html admin-apple-touch-icon.png site/applicants-admin.js site/dashboard-admin.js site/dashboard-defaults.json _site/
          cp -r site/vendor _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
