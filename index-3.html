<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#164a78">
<title>وظائف المصانع</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#164a78;
  --card:#1b5687;
  --tx:#ffffff;
  --mu:#d1e3f5;
  --bd:#3976a7;
  --ac:#3293e6;
  --ac-strong:#55aaf2;
  --chip:#205f94;
  --shadow:0 8px 22px rgba(0,0,0,.14);
}
*{box-sizing:border-box}
html{background:var(--bg);color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.55}
button,input{font:inherit}
button{touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid #b9e0ff;outline-offset:2px}
.w{max-width:42rem;margin:auto;padding:1rem;padding-bottom:2rem}
h1{font-size:1.6rem;line-height:1.35;margin:.5rem 0 0;font-weight:800}
.mu{color:var(--mu)}.ac{color:#9bd0ff}
.inp{display:block;width:100%;min-height:50px;background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:.8rem;padding:.75rem .9rem;font-size:16px;margin-bottom:.75rem}
.inp::placeholder{color:#c2d8eb}
.chips{display:flex;gap:.5rem;overflow-x:auto;margin-bottom:.75rem;padding:1px 1px 5px;scrollbar-width:thin}
.chip{border:1px solid var(--bd);background:var(--chip);color:var(--tx);border-radius:99px;padding:.55rem 1rem;white-space:nowrap;font-size:.92rem;min-height:42px;cursor:pointer}
.chip.on{background:var(--ac-strong);color:#fff;border-color:var(--ac-strong);font-weight:800}
.card{display:block;width:100%;text-align:right;background:var(--card);border:1px solid var(--bd);border-radius:1rem;padding:1rem;margin-bottom:.7rem;color:var(--tx);font:inherit;cursor:pointer;box-shadow:var(--shadow);transition:background .12s,border-color .12s}
.card:active{background:#24669a}
.row{display:flex;justify-content:space-between;align-items:center;gap:.55rem}
.tag{display:inline-block;font-size:.78rem;border:1px solid #4b83b0;background:#174b78;border-radius:99px;padding:.2rem .6rem;margin:.45rem .3rem 0 0;color:#e6f2ff;max-width:100%;overflow-wrap:anywhere}
.badge{font-size:.75rem;font-weight:800;border-radius:99px;padding:.22rem .65rem;color:#fff;background:#3293e6;white-space:nowrap}
.badge.b{background:#a93478}
.badge.s{background:#3293e6}
.salary{font-size:1rem;font-weight:800;color:#fff;text-align:left}
.ov{display:none;position:fixed;inset:0;z-index:9;background:rgba(0,12,25,.72);align-items:flex-end;justify-content:center;padding-top:1rem}
.ov.show{display:flex}
@media(min-width:640px){.ov{align-items:center;padding:1rem}}
.sheet{background:#174f80;border:1px solid #4b83b0;color:var(--tx);width:100%;max-width:28rem;max-height:92%;overflow-y:auto;padding:1.15rem;border-radius:1.5rem 1.5rem 0 0;box-shadow:0 18px 55px rgba(0,0,0,.3)}
@media(min-width:640px){.sheet{border-radius:1.5rem}}
.f{border:1px solid var(--bd);background:#1b5687;border-radius:.8rem;padding:.75rem;margin-top:.6rem;overflow-wrap:anywhere}
.f small{display:block;color:var(--mu);margin-bottom:.25rem;font-size:.82rem}
.f b{font-size:.98rem;line-height:1.6}
.btn{display:block;text-align:center;font-weight:800;border-radius:.8rem;padding:.85rem;margin-top:.55rem;text-decoration:none;border:1px solid #5b8bb7;color:#fff;background:#205f94;min-height:49px}
.btn.primary{background:#3293e6;border-color:#3293e6}
.x{border:1px solid #5b8bb7;background:#1b5687;color:#fff;border-radius:50%;width:2.7rem;height:2.7rem;font-size:1.1rem;cursor:pointer;flex:0 0 auto}
.status{border:1px solid var(--bd);background:var(--card);border-radius:1rem;padding:1.4rem 1rem;text-align:center;margin:.5rem 0 1rem}
.status-title{font-weight:800;font-size:1.05rem;margin:0 0 .35rem}
.status p{color:var(--mu);margin:.2rem 0 .8rem}
.status .btn{width:100%;max-width:17rem;margin:.6rem auto 0}
.empty{display:none}
.small-note{font-size:.82rem;color:var(--mu);text-align:center;padding:.5rem 0 0}
.hidden{display:none!important}
@media(max-width:360px){.w{padding:.8rem}.row{gap:.35rem}.card{padding:.85rem}.sheet{padding:1rem}h1{font-size:1.45rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="w">
  <h1>وظائف المصانع</h1>
  <p class="mu" style="margin:.25rem 0 1rem">اختار الوظيفة المناسبة وقدّم مباشرة</p>
  <label for="q" class="mu" style="display:block;margin-bottom:.35rem;font-size:.9rem">ابحث عن وظيفة</label>
  <input id="q" type="search" class="inp" autocomplete="off" placeholder="ابحث باسم الوظيفة أو المصنع أو المدينة...">
  <div id="cat" class="chips" aria-label="اختيار الفئة"></div>
  <div id="area" class="chips" aria-label="اختيار المدينة"></div>
  <div id="status" class="status" role="status" aria-live="polite">
    <div class="status-title">جاري تحميل الوظائف…</div>
    <p>لحظة واحدة من فضلك.</p>
  </div>
  <div id="list"></div>
  <p id="empty" class="mu" style="text-align:center;padding:1.4rem 1rem;display:none">مفيش نتائج مطابقة. جرّب تغيّر البحث أو اختار «الكل».</p>
  <p class="small-note">الوظائف المعروضة مأخوذة من جدول الوظائف المتصل بالموقع.</p>
</main>

<div id="modal" class="ov" role="dialog" aria-modal="true" aria-label="تفاصيل الوظيفة"></div>

<script>
"use strict";

/* الإعدادات الأصلية: مصدر البيانات ورقم التواصل محفوظان */
const PHONE = "201095237207";
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1Ri61Py0q36t2EdMCWXa0lgJGDWJfrXjY0gHmqnwS4AM/gviz/tq?tqx=out:csv&headers=1&sheet=%D8%A7%D9%84%D9%88%D8%B8%D8%A7%D8%A6%D9%81";
const CORE = ["المنطقة","الفئة","المصنع","المؤهل","الشفت","المرتب","ظاهر؟"];
let JOBS = [];
let cat = "الكل";
let area = "الكل";
let currentJob = null;
let lastFocused = null;
const $ = id => document.getElementById(id);

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}
function normalize(s) {
  return String(s ?? "")
    .toLocaleLowerCase("ar")
    .normalize("NFD")
    .replace(/[\u064B-\u065F\u0670\u0640]/g, "")
    .replace(/[أإآٱ]/g, "ا")
    .replace(/ى/g, "ي")
    .replace(/ة/g, "ه")
    .replace(/\s+/g, " ")
    .trim();
}
function parseCSV(text) {
  const rows = [];
  let row = [], field = "", quoted = false;
  text = text.replace(/^\uFEFF/, "");
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (quoted) {
      if (ch === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else quoted = false;
      } else field += ch;
    } else if (ch === '"') quoted = true;
    else if (ch === ",") { row.push(field); field = ""; }
    else if (ch === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
    else if (ch !== "\r") field += ch;
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  if (!rows.length) return [];
  const headers = rows[0].map((v, i) => (i === 0 ? v.replace(/^\uFEFF/, "") : v).trim());
  return rows.slice(1)
    .filter(r => r.some(v => String(v ?? "").trim() !== ""))
    .map(r => {
      const obj = {};
      headers.forEach((key, i) => { if (key) obj[key] = String(r[i] ?? "").trim(); });
      return obj;
    });
}
function setStatus(title, message, retry = false) {
  $("status").innerHTML = `<div class="status-title">${esc(title)}</div><p>${esc(message)}</p>${retry ? '<button class="btn primary" id="retry" type="button">حاول تاني</button>' : ""}`;
  $("status").classList.remove("hidden");
  if (retry) $("retry").addEventListener("click", load);
}
function isShown(job) {
  const v = normalize(job["ظاهر؟"] || "نعم");
  return !["لا","no","false","0","مخفي"].includes(v) && String(job["المصنع"] || "").trim() !== "";
}
async function load() {
  $("list").innerHTML = "";
  $("empty").style.display = "none";
  setStatus("جاري تحميل الوظائف…", "لحظة واحدة من فضلك.");
  try {
    const response = await fetch(SHEET_CSV_URL, {cache:"no-store"});
    if (!response.ok) throw new Error("HTTP " + response.status);
    const text = await response.text();
    if (!text.trim() || !text.includes("المصنع")) throw new Error("Invalid sheet data");
    const rows = parseCSV(text);
    if (!rows.length) {
      JOBS = [];
    } else {
      JOBS = rows.filter(isShown);
    }
    setStatus(JOBS.length ? "الوظائف جاهزة" : "مفيش وظائف متاحة حاليًا",
      JOBS.length ? `تم تحميل ${JOBS.length} وظيفة من جدول الوظائف.` : "لما تكون فيه وظائف ظاهرة في جدول Google Sheets هتظهر هنا.");
    if (!JOBS.length) $("status").classList.remove("hidden");
    else $("status").classList.add("hidden");
    draw();
  } catch (err) {
    JOBS = [];
    $("list").innerHTML = "";
    $("empty").style.display = "none";
    setStatus("بنعتذرلك، مش قادرين نحمّل الوظائف دلوقتي", "فيه عطل مؤقت في تحميل الوظائف. جرّب تفتح الصفحة تاني بعد شوية، وشكرًا لصبرك ❤️", true);
    drawChips();
  }
}
const uniq = key => ["الكل", ...new Set(JOBS.map(j => String(j[key] || "").trim()).filter(Boolean))];
function categoryClass(value) {
  const v = normalize(value);
  return v.includes("بنات") && !v.includes("شباب") ? "b" : "s";
}
function drawChips() {
  const make = (id, key, current, setter) => {
    const values = uniq(key);
    $(id).innerHTML = values.map(v =>
      `<button class="chip ${v === current ? "on" : ""}" type="button" data-v="${esc(v)}">${esc(v)}</button>`
    ).join("");
    $(id).querySelectorAll("button").forEach(button => {
      button.addEventListener("click", () => {
        setter(button.dataset.v);
        draw();
      });
    });
  };
  make("cat", "الفئة", cat, value => cat = value);
  make("area", "المنطقة", area, value => area = value);
}
function draw() {
  drawChips();
  const query = normalize($("q").value);
  const results = JOBS.map((j, i) => ({j, i})).filter(({j}) => {
    const categoryMatches = cat === "الكل" || j["الفئة"] === cat;
    const areaMatches = area === "الكل" || j["المنطقة"] === area;
    const text = normalize(Object.entries(j)
      .filter(([key]) => normalize(key) !== normalize("ظاهر؟"))
      .map(([, value]) => value).join(" "));
    return categoryMatches && areaMatches && (!query || text.includes(query));
  });
  $("list").innerHTML = results.map(({j, i}) => `
    <button class="card" type="button" data-i="${i}" aria-label="عرض تفاصيل ${esc(j["المصنع"])}">
      <div class="row">
        <span class="ac" style="font-size:.82rem;font-weight:800">📍 ${esc(j["المنطقة"] || "المكان حسب التفاصيل")}</span>
        <span class="badge ${categoryClass(j["الفئة"] || "")}">${esc(j["الفئة"] || "الوظيفة")}</span>
      </div>
      <div style="font-size:1.1rem;font-weight:800;margin:.45rem 0">${esc(j["المصنع"])}</div>
      <div class="row" style="align-items:flex-start">
        <span class="mu" style="font-size:.85rem">${esc(j["المؤهل"] || "")}</span>
        <b class="salary">${esc(j["المرتب"] || "")}</b>
      </div>
      ${j["الشفت"] ? `<div class="mu" style="font-size:.86rem;margin-top:.35rem">⏰ ${esc(j["الشفت"])}</div>` : ""}
      ${["السكن","المواصلات"].filter(k => j[k]).map(k => `<span class="tag">${k}: ${esc(j[k])}</span>`).join("")}
      <div style="border-top:1px solid var(--bd);margin-top:.75rem;padding-top:.65rem;color:#9bd0ff;font-size:.9rem;font-weight:800">اضغط لمعرفة التفاصيل والتقديم ←</div>
    </button>`).join("");
  $("empty").style.display = results.length ? "none" : "block";
  $("list").querySelectorAll(".card").forEach(button => {
    button.addEventListener("click", () => openJob(JOBS[Number(button.dataset.i)]));
  });
  if (JOBS.length) $("status").classList.add("hidden");
  else if (!$("status").querySelector("#retry")) {
    $("status").classList.remove("hidden");
  }
}
function openJob(job) {
  if (!job) return;
  currentJob = job;
  lastFocused = document.activeElement;
  const phone = PHONE.replace(/\D/g, "");
  const message = encodeURIComponent(`السلام عليكم، عايز أقدم على وظيفة: ${job["المصنع"] || ""} - ${job["المنطقة"] || ""}`);
  const labels = {"المؤهل":"الفئة والمؤهل","الشفت":"الشفت وساعات العمل","المرتب":"المرتب"};
  const keys = ["المؤهل","الشفت","المرتب", ...Object.keys(job).filter(k => !CORE.includes(k))];
  const detailRows = [...new Set(keys)].filter(k => String(job[k] ?? "").trim() !== "").map(k =>
    `<div class="f"><small>${esc(labels[k] || k)}</small><b>${esc(job[k])}</b></div>`
  ).join("");
  $("modal").innerHTML = `
    <section class="sheet">
      <div class="row" style="align-items:flex-start">
        <div>
          <div class="ac" style="font-size:.86rem;font-weight:800">📍 ${esc(job["المنطقة"] || "")} • ${esc(job["الفئة"] || "")}</div>
          <h2 style="font-size:1.3rem;line-height:1.5;margin:.3rem 0">${esc(job["المصنع"] || "تفاصيل الوظيفة")}</h2>
        </div>
        <button class="x" id="closeModal" type="button" aria-label="إغلاق التفاصيل">✕</button>
      </div>
      ${detailRows || '<p class="mu">مفيش تفاصيل إضافية مسجلة للوظيفة.</p>'}
      <a class="btn primary" target="_blank" rel="noopener noreferrer" href="https://wa.me/${phone}?text=${message}">قدّم الآن عبر الواتساب</a>
      <a class="btn" href="tel:+${phone}">اتصل بنا</a>
    </section>`;
  $("modal").classList.add("show");
  document.body.style.overflow = "hidden";
  $("closeModal").addEventListener("click", closeJob);
  $("closeModal").focus();
}
function closeJob() {
  $("modal").classList.remove("show");
  $("modal").innerHTML = "";
  document.body.style.overflow = "";
  currentJob = null;
  if (lastFocused && typeof lastFocused.focus === "function") lastFocused.focus();
}
$("modal").addEventListener("click", event => {
  if (event.target === $("modal")) closeJob();
});
document.addEventListener("keydown", event => {
  if (event.key === "Escape" && $("modal").classList.contains("show")) closeJob();
});
$("q").addEventListener("input", draw);
load();
</script>
</body>
</html>
