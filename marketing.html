<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1A33">
<title>اشتغل أونلاين بعمولة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}body{margin:0;background:#0E1A33;color:#E8EEF9;font-family:Cairo,Tahoma,Arial,sans-serif;line-height:1.8}
.w{max-width:30rem;margin:0 auto;padding:1rem 1rem 4rem}
.top{display:flex;align-items:center;margin-bottom:.8rem}
.back{font:inherit;font-weight:800;font-size:.9rem;background:#172645;color:#F2C14E;border:1px solid #2A3C66;border-radius:.8rem;padding:.5rem .9rem;cursor:pointer;min-height:2.75rem}
.ad{display:block;width:100%;height:auto;border-radius:1.2rem;margin-bottom:1rem;box-shadow:0 6px 16px rgba(0,0,0,.35)}
#op{min-height:2.6rem;padding:.55rem;font-size:.88rem}
.card{background:#172645;border:1px solid #2A3C66;border-radius:1.2rem;padding:1.1rem 1.2rem;margin-bottom:1rem;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.card h1{margin:0 0 .5rem;font-size:1.25rem;color:#F2C14E}
.card p{margin:.3rem 0;font-size:.95rem}
.ok{margin:.6rem 0 0;padding:0;list-style:none}.ok li{margin:.25rem 0;font-weight:700;font-size:.95rem}
.com{background:#F2C14E;color:#2A1D00;border-radius:.9rem;padding:.7rem .9rem;font-weight:800;margin-top:.8rem}
.btn{display:block;width:100%;font:inherit;font-weight:800;font-size:1rem;border:0;border-radius:.9rem;padding:.8rem;min-height:2.9rem;cursor:pointer;background:#F2C14E;color:#2A1D00;text-align:center}
.btn.bk{background:transparent;color:#fff;border:2px solid #E5120F;margin-top:.6rem}
.ov{display:none;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:#0E1A33;width:100%;max-width:34rem;max-height:100%;overflow-y:auto;border-radius:1.4rem 1.4rem 0 0;border:1px solid #2A3C66;padding:0 1.1rem 1.2rem;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sh{position:sticky;top:0;z-index:2;background:#0E1A33;display:flex;align-items:center;justify-content:space-between;padding:.9rem 0 .6rem}
.sh h2{margin:0;font-size:1.1rem;color:#F2C14E}
.x{flex:none;width:2.7rem;height:2.7rem;border-radius:50%;border:0;background:#E5120F;color:#fff;font-size:1.2rem;font-weight:900;cursor:pointer}
.sheet label{display:block;font-weight:700;font-size:.9rem;margin:.6rem 0 .25rem}
.sheet input,.sheet select{width:100%;font:inherit;font-size:1rem;padding:.65rem .85rem;border-radius:.75rem;border:1px solid #2A3C66;background:#172645;color:#E8EEF9}
.er{color:#F2C14E;font-size:.88rem;min-height:1.3rem;margin:.5rem 0 .7rem}

#xo{display:none;position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.55);align-items:center;justify-content:center;padding:1.2rem}
#xo.on{display:flex}
#xo .xb{background:#172645;color:#E8EEF9;border:1px solid #2A3C66;border-radius:1rem;padding:1rem;width:100%;max-width:18rem;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.45)}
#xo .xb p{margin:0 0 .8rem;font-weight:800;font-size:.95rem;line-height:1.6}
#xo .xr{display:flex;flex-direction:column;gap:.5rem}
#xo .xr button{font:inherit;font-weight:800;font-size:.88rem;border:0;border-radius:.75rem;min-height:2.6rem;cursor:pointer}
#xo #xn{background:#F2C14E;color:#2A1D00}
#xo #xy{background:transparent;color:#E8EEF9;border:1.5px solid #E5120F}

.ov{align-items:stretch!important;padding:0}
.sheet{height:100dvh;max-width:34rem;max-height:none;border-radius:0;border:0;padding:0 1rem 1.2rem}
.sh{padding:.7rem 0 .55rem;border-bottom:1px solid #2A3C66}.sh h2{font-size:.92rem}
.x{width:2.4rem;height:2.4rem;font-size:1rem}
.sheet label{font-size:.76rem;margin:.8rem 0 .25rem}
.sheet input,.sheet select{font-size:14px;padding:.5rem .8rem}
.sheet .btn{min-height:2.6rem;padding:.55rem;font-size:.88rem}
.sheet .btn.bk{margin-top:.5rem}
.er{margin:.4rem 0 .6rem;min-height:1.1rem;font-size:.78rem}
</style></head><body><div class="w">
