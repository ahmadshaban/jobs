<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة متابعة الوظائف - الكول سنتر</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans min-h-screen">

    <div class="max-w-7xl mx-auto px-4 py-8">
        <!-- Header -->
        <header class="bg-white shadow rounded-2xl p-6 mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-800"><i class="fa-solid fa-headset text-indigo-600 ml-2"></i> لوحة متابعة وظائف الكول سنتر</h1>
                <p class="text-sm text-gray-500 mt-1">عرض تفاصيل الوظائف المتاحة للموظفين (أرقام التواصل مخفية)</p>
            </div>
            <div class="flex items-center gap-3">
                <a href="index.html" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-xl text-sm font-medium transition">
                    <i class="fa-solid fa-arrow-right ml-1"></i> الرئيسية
                </a>
                <button onclick="loadJobsData()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition flex items-center gap-2">
                    <i class="fa-solid fa-rotate"></i> تحديث البيانات
                </button>
            </div>
        </header>

        <!-- Filters Section -->
        <div class="bg-white shadow rounded-2xl p-4 mb-6 grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">بحث بالمسمى الوظيفي</label>
                <input type="text" id="searchInput" placeholder="ابحث عن وظيفة..." class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">فلتر حسب المنطقة</label>
                <select id="regionFilter" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="">جميع المناطق</option>
                </select>
            </div>
            <div class="flex items-end">
                <button onclick="resetFilters()" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-600 font-medium py-2 rounded-xl text-sm transition">إعادة ضبط الفلاتر</button>
            </div>
        </div>

        <!-- Loading & Status -->
        <div id="loading" class="text-center py-12">
            <i class="fa-solid fa-spinner fa-spin text-3xl text-indigo-600 mb-2"></i>
            <p class="text-gray-500 text-sm">جاري جلب الوظائف...</p>
        </div>

        <div id="errorMsg" class="hidden bg-red-50 border border-red-200 text-red-600 p-4 rounded-xl text-center mb-6 text-sm"></div>

        <!-- Jobs Grid -->
        <div id="jobsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamic content -->
        </div>
    </div>

    <script>
        // رابط الـ Google Sheets API أو ملف الـ JSON (تأكد من مطابقته للرابط الفعلي في index.html)
        const DATA_URL = "https://script.google.com/macros/s/AKfycbz.../exec"; 

        let allJobs = [];

        async function loadJobsData() {
            const loading = document.getElementById('loading');
            const errorMsg = document.getElementById('errorMsg');
            const container = document.getElementById('jobsContainer');

            loading.classList.remove('hidden');
            errorMsg.classList.add('hidden');
            container.innerHTML = '';

            try {
                // منع التخزين المؤقت عبر إضافة بصمة زمنية
                const response = await fetch(`${DATA_URL}?_t=${Date.now()}`);
                if (!response.ok) throw new Error('فشل الاتصال بسيرفر البيانات');
                
                const data = await response.json();
                allJobs = Array.isArray(data) ? data : (data.jobs || data.data || []);

                populateRegions(allJobs);
                renderJobs(allJobs);
            } catch (err) {
                console.error(err);
                errorMsg.textContent = 'حدث خطأ أثناء جلب الوظائف. تأكد من صحة الرابط أو حاول مرة أخرى.';
                errorMsg.classList.remove('hidden');
            } finally {
                loading.classList.add('hidden');
            }
        }

        function populateRegions(jobs) {
            const regionFilter = document.getElementById('regionFilter');
            const regions = [...new Set(jobs.map(job => job.region || job.المنطقة || job.city).filter(Boolean))];
            
            regionFilter.innerHTML = '<option value="">جميع المناطق</option>';
            regions.forEach(reg => {
                const opt = document.createElement('option');
                opt.value = reg;
                opt.textContent = reg;
                regionFilter.appendChild(opt);
            });
        }

        function renderJobs(jobs) {
            const container = document.getElementById('jobsContainer');
            container.innerHTML = '';

            if (jobs.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400 text-sm">لا توجد وظائف متاحة حالياً تطابق بحثك.</div>`;
                return;
            }

            jobs.forEach(job => {
                const title = job.title || job.المسمى || job.المسمى_الوظيفي || 'وظيفة شاغرة';
                const region = job.region || job.المنطقة || job.المكان || 'غير محدد';
                const details = job.details || job.التفاصيل || job.الوصف || 'لا توجد تفاصيل إضافية متاحة.';
                const salary = job.salary || job.الراتب || 'يحدد في المقابلة';

                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl shadow-sm border border-gray-100 p-6 flex flex-col justify-between hover:shadow-md transition';
                
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start gap-2 mb-3">
                            <h3 class="font-bold text-gray-800 text-lg">${escapeHtml(title)}</h3>
                            <span class="bg-indigo-50 text-indigo-700 text-xs px-2.5 py-1 rounded-lg font-medium whitespace-nowrap"><i class="fa-solid fa-location-dot ml-1"></i>${escapeHtml(region)}</span>
                        </div>
                        <p class="text-gray-600 text-sm mb-4 leading-relaxed">${escapeHtml(details)}</p>
                    </div>
                    <div class="border-t border-gray-100 pt-4 mt-4 flex items-center justify-between text-sm">
                        <span class="text-gray-500 font-medium"><i class="fa-solid fa-money-bill-wave ml-1 text-emerald-600"></i> ${escapeHtml(salary)}</span>
                        <span class="text-xs bg-amber-50 text-amber-700 px-2 py-1 rounded-md font-medium"><i class="fa-solid fa-lock ml-1"></i> أرقام التواصل مخفية</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        function filterJobs() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const selectedRegion = document.getElementById('regionFilter').value;

            const filtered = allJobs.filter(job => {
                const title = (job.title || job.المسمى || job.المسمى_الوظيفي || '').toLowerCase();
                const region = job.region || job.المنطقة || job.city || '';
                
                const matchesSearch = title.includes(search);
                const matchesRegion = !selectedRegion || region === selectedRegion;

                return matchesSearch && matchesRegion;
            });

            renderJobs(filtered);
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('regionFilter').value = '';
            renderJobs(allJobs);
        }

        document.getElementById('searchInput').addEventListener('input', filterJobs);
        document.getElementById('regionFilter').addEventListener('change', filterJobs);

        // تحميل البيانات عند فتح الصفحة
        window.addEventListener('DOMContentLoaded', loadJobsData);
    </script>
</body>
</html>
