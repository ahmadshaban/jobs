<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A1428">
<title>قريبًا</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}body{margin:0;background:#0A1428;color:#E8EEF9;font-family:Cairo,Tahoma,Arial,sans-serif;line-height:1.8}
.w{max-width:30rem;margin:0 auto;padding:1rem 1rem 4rem}
.top{display:flex;align-items:center;margin-bottom:.8rem}
.back{font:inherit;font-weight:700;font-size:.9rem;background:#172645;color:#E8EEF9;border:1px solid #2A3D66;border-radius:.8rem;padding:.5rem .9rem;cursor:pointer;min-height:2.75rem}
.card{background:#fff;color:#0A1428;border-radius:1.2rem;padding:1.1rem 1.2rem;margin-bottom:1rem}
.card h1{margin:0 0 .5rem;font-size:1.25rem;color:#1F3F7A}
.card p{margin:.3rem 0;font-size:.95rem}
.ok{margin:.6rem 0 0;padding:0;list-style:none}.ok li{margin:.25rem 0;font-weight:700;font-size:.95rem}
.com{background:#FFF6C7;color:#0A1428;border-radius:.9rem;padding:.7rem .9rem;font-weight:800;margin-top:.8rem}
.btn{display:block;width:100%;font:inherit;font-weight:800;font-size:1rem;border:0;border-radius:.9rem;padding:.8rem;min-height:2.9rem;cursor:pointer;background:#FFF6C7;color:#0A1428;text-align:center;text-decoration:none}
.fm{display:none;background:#172645;border:1px solid #2A3D66;border-radius:1.2rem;padding:1rem;margin-top:.8rem}
.fm.on{display:block}
.fm label{display:block;font-weight:700;font-size:.88rem;margin:.5rem 0 .2rem}
.fm input{width:100%;font:inherit;font-size:1rem;padding:.6rem .8rem;border-radius:.7rem;border:1px solid #2A3D66;background:#0A1428;color:#E8EEF9}
.er{color:#FFF6C7;font-size:.85rem;min-height:1.2rem;margin:.4rem 0 .6rem}
</style></head><body><div class="w">
<div class="top"><button type="button" class="back" onclick="goBack()">⬅ رجوع</button></div>
<div class="card"><h1>قريبًا</h1><p>الصفحة دي لسه تحت التجهيز.</p></div>
</div>
<script>function goBack(){if(history.length>1){history.back()}else{location.href='./'}}</script></body></html>
