<!DOCTYPE html>
<!--
  فهرس الأجزاء:
  [1] الألوان والتصميم (CSS)
  [2] هيكل الصفحة (HTML)
  [3] الإعدادات والنصوص وأسماء الأعمدة (JS)
  [4] الاتصال بالشيت
  [5] شاشة الدخول
  [6] عرض الكروت والبحث
  [7] أزرار الكارت (تعديل / إخفاء / اكتمل / مسح)
  [8] نموذج الإضافة والتعديل
  [9] خانة جديدة والتحديث والخروج
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>لوحة الوظايف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ===== [1] الألوان والتصميم: كحلي غامق مع كتابة بيضاء وصفراء (غيّر الألوان من هنا) ===== */
:root{
  --c-main:#0B2A4A;
  --c-main-dark:#08203A;
  --c-main-soft:#123A63;
  --c-bg:#0D2F52;
  --c-card:#0B2A4A;
  --c-text:#FFFFFF;
  --c-sub:#FFE45C;
  --c-border:#3F7AB5;
  --c-ok:#16803d;
  --c-bad:#ff7777;
  --c-warn:#FFE45C;
  --c-highlight:#FFE45C;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Cairo',sans-serif;background:linear-gradient(145deg,#071C33 0%,#0F3A66 55%,#0A2A4D 100%);color:#fff;font-size:15px}
button,input,select{font-family:inherit;font-size:inherit}
.hidden{display:none!important}
.btn{border:1px solid #3F7AB5;border-radius:9px;padding:7px 11px;font-size:13px;font-weight:700;cursor:pointer;background:#0E3560;color:#fff}
.btn:active{background:#082A4C}
.btn.ghost{background:#FFE45C;color:#0E3560;border-color:#FFE45C}
.btn.danger{background:transparent;color:#fff;border:1px solid #FF9B9B}
.btn:disabled{opacity:.65}
input,select{width:100%;padding:10px 12px;border:1px solid #3F7AB5;border-radius:10px;background:#0B2A4A;color:#fff}
input::placeholder{color:#E5F4FF;opacity:1}
select option{background:#0B2A4A;color:#fff}
input:focus,select:focus,.btn:focus-visible{outline:2px solid #FFE45C;outline-offset:2px}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{width:100%;max-width:340px;background:#0B2A4A;border:1px solid #3F7AB5;border-radius:16px;padding:22px;display:grid;gap:12px}
.login-box h1{margin:0;font-size:20px;color:#FFE45C}
.err{color:#FFE45C;min-height:20px;font-size:14px}
header{position:sticky;top:0;z-index:5;background:#0B2A4A;border-bottom:1px solid #3F7AB5;padding:12px;display:grid;gap:10px}
header h1{margin:0;font-size:18px;color:#fff}
.bar{display:flex;gap:8px;flex-wrap:wrap}
.bar .btn{flex:1 1 auto;padding:6px 8px;font-size:12.5px}
#list{padding:12px;display:grid;gap:10px;max-width:760px;margin:0 auto}
.card{background:#0B2A4A;border:1px solid #3F7AB5;border-radius:12px;padding:9px;display:grid;gap:6px;color:#fff}
.card.dim{opacity:.65}
.card h2{margin:0;font-size:15px;color:#FFE45C}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.meta span{background:#1A4A7A;color:#fff;border:1px solid #3F7AB5;border-radius:7px;padding:1px 7px;font-size:11.5px}
.badge{border-radius:7px;padding:1px 7px;font-size:11px;font-weight:700;margin-inline-start:5px}
.badge.done{background:#16803d;color:#fff}
.stats{font-size:12px;color:#CFE3F7;margin-top:6px}
.badge.urg{background:#FFE45C;color:#0E3560}.badge.pin{background:#C2410C;color:#fff}
.badge.hid{background:transparent;color:#FFE45C;border:1px solid #FFE45C}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.acts .btn{padding:6px 2px;font-size:11.5px;line-height:1.3}
.empty{text-align:center;color:#fff;padding:30px}
#title{color:#fff}
#modal{position:fixed;inset:0;background:rgba(0,20,50,.65);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:#0B2A4A;color:#fff;width:100%;max-width:520px;max-height:90vh;overflow:auto;border:1px solid #3F7AB5;border-radius:18px 18px 0 0;padding:16px;display:grid;gap:10px}
.sheet h3{margin:0;color:#FFE45C}
.sheet label{font-size:13px;color:#FFE45C;display:grid;gap:4px}
.sheet .row{display:flex;gap:8px}
.sheet .row .btn{flex:1}
.fab{position:fixed;bottom:20px;inset-inline-end:16px;z-index:6;width:56px;height:56px;border-radius:50%;border:0;background:#FFE45C;color:#0E3560;font-size:32px;font-weight:700;line-height:1;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.fab:disabled{opacity:.5}
.sheet .row{position:sticky;bottom:-1px;background:#0B2A4A;padding:10px 0 4px;box-shadow:0 -8px 10px -6px rgba(0,0,0,.45)}
.meta span.sal{background:#FFE45C;color:#0E3560;font-weight:700;cursor:pointer}
.meta span.sal.empty{background:transparent;color:#FFE45C;border:1px dashed #FFE45C;font-weight:400}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mv{display:flex;gap:6px;flex:none}.mv .btn{padding:2px 9px;font-size:13px;line-height:1.3}.mv .btn:disabled{opacity:.3}
.oldhint{color:#fff;opacity:.85;font-size:12px;font-weight:400}
#salDlg,#colDlg{position:fixed;inset:0;background:rgba(0,20,50,.65);display:flex;align-items:center;justify-content:center;z-index:15;padding:16px}
#salDlg .box,#colDlg .box{background:#0B2A4A;border:1px solid #3F7AB5;border-radius:16px;padding:16px;width:100%;max-width:340px;display:grid;gap:10px}
#salDlg h3,#colDlg h3{margin:0;color:#FFE45C;font-size:16px}
#salOld{font-size:13px;color:#fff;background:#1A4A7A;border-radius:8px;padding:6px 10px;cursor:pointer}
#salDlg .row,#colDlg .row{display:flex;gap:8px}#salDlg .row .btn,#colDlg .row .btn{flex:1}
.clr{padding:2px 10px;font-size:12px;justify-self:start}
#colDlg small{color:#fff;font-size:12px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:12px;color:#fff;font-weight:700;z-index:20;max-width:90%;box-shadow:0 4px 18px rgba(0,0,0,.18)}
#toast.ok{background:#16803d}
#toast.bad{background:#B42318}
/* ===== محرر الورديات وأرقام التواصل ===== */
.shed{display:grid;gap:8px}.shl{font-size:13px;color:#FFE45C}
.shp-row{display:flex;flex-wrap:wrap;gap:6px}.shp.on{background:#FFE45C;color:#0E3560;font-weight:700}
.shb{background:#0B2A4A;border:1px solid #3F7AB5;border-radius:12px;padding:10px;display:grid;gap:8px}
.shh{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#FFE45C}.shh input{flex:1}
.shg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
</head>
<body>

<!-- ===== [2] هيكل الصفحة ===== -->
<div id="login">
  <div class="login-box">
    <h1 id="loginTitle"></h1>
    <input id="pw" type="password" autocomplete="current-password">
    <div class="err" id="loginErr"></div>
    <button class="btn" id="loginBtn"></button>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <h1 id="title"></h1>
    <div id="filters" style="display:grid;gap:10px">
    <div style="display:flex;gap:8px">
      <select id="areaFilter" aria-label="اختيار المكان" required>
        <option value="">اختار المكان أولًا</option>
      </select>
      <select id="genderFilter" aria-label="اختيار الفئة">
        <option value="">الكل</option>
        <option value="m">شباب</option>
        <option value="f">بنات</option>
        <option value="b">شباب وبنات</option>
      </select>
    </div>
    <input id="q" type="search" placeholder="دوّر باسم المصنع..." aria-label="بحث باسم المصنع">
    </div>
    <div class="bar">
      <button class="btn ghost" id="bSearch" aria-label="الفلتر" style="flex:0 0 auto">🔍</button>
      <button class="btn" id="bNew"></button>
      <button class="btn ghost" id="bCol"></button>
      <button class="btn danger" id="bDelCol">مسح عمود</button>
      <button class="btn ghost" id="bRef"></button>
      <button class="btn danger" id="bOut"></button>
    </div>
    <div id="stats" class="stats"></div>
  </header>
  <div id="list"></div>
  <button class="fab" id="fab" aria-label="وظيفة جديدة">+</button>
</div>

<div id="modal" class="hidden"><div class="sheet" id="sheet"></div></div>
<div id="salDlg" class="hidden"><div class="box">
  <h3 id="salT"></h3>
  <div id="salOld" class="hidden"></div>
  <input id="salIn" type="text" autocomplete="off" placeholder="اكتب الرقم بس">
  <div class="row"><button class="btn" id="salSave">حفظ</button><button class="btn ghost" id="salCancel">إلغاء</button></div>
</div></div>
<div id="colDlg" class="hidden"><div class="box">
  <h3>مسح عمود من الشيت</h3>
  <small>العمود هيتمسح من الشيت بكل بياناته ومش بيرجع. الأعمدة الأساسية مش بتظهر هنا.</small>
  <select id="colSel"></select>
  <input id="colIn" type="text" autocomplete="off" placeholder="اكتب اسم العمود للتأكيد">
  <div class="row"><button class="btn danger" id="colGo" disabled>امسح العمود</button><button class="btn ghost" id="colCancel">إلغاء</button></div>
</div></div>
<div id="toast" class="hidden"></div>

<script>
// ===== [3] الإعدادات والنصوص وأسماء الأعمدة =====
const API = 'https://script.google.com/macros/s/AKfycbzwMRST469OBo-ym0Ccn-Ot84jGrL0KEM9SZcnfe-tip2U6-1gyryjnYxdNNsiwbLEyng/exec';

const COL = {
  factory: 'المصنع',
  area:    'المنطقة',
  gender:  'الفئة',
  mod:     'آخر تعديل',
  order:   'الترتيب',
  pin:     'تثبيت',
  shifts:  'الورديات',
  shift:   'الشفت',
  salary:  'المرتب',
  salary30: 'مرتب 30 يوم',
  salary26: 'مرتب 26 يوم',
  contacts: 'أرقام التواصل', // عمود أرقام التواصل الجديد
  visible: 'ظاهر؟',
  status:  'الحالة'
};

const SAL_SUFFIX30 = ' ج في الشهر';
const SAL_SUFFIX26 = ' ج';
const DATE_COL = 'تاريخ الإضافة';
const todayStr = () => new Date().toISOString().slice(0, 10);
const nowStr = () => { const d = new Date(), p = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()); };
const siteId = n => { let h = 5381; for (const c of String(n)) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0; return h.toString(36); };
function normSalary(x, col){
  let t = String(x).trim().replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
  if (/^[\d.,]+$/.test(t)) t = t.replace(/,/g, '') + (col === COL.salary26 ? SAL_SUFFIX26 : SAL_SUFFIX30);
  return t;
}

const T = {
  loginTitle: 'دخول الأدمن',
  pwHint: 'كلمة السر',
  login: 'دخول',
  wrongPw: 'كلمة السر غلط',
  noApi: 'حط رابط الـ Web app في ثابت API الأول',
  title: 'الوظايف',
  newJob: 'وظيفة جديدة',
  newCol: 'خانة جديدة',
  refresh: 'تحديث',
  logout: 'خروج',
  copy: 'نسخ',
  edit: 'تعديل',
  hide: 'إخفاء',
  show: 'إظهار',
  complete: 'اكتمل',
  reopen: 'إعادة فتح',
  del: 'مسح',
  doneBadge: 'مكتمل',
  hiddenBadge: 'مخفي',
  doneValue: 'مكتمل',
  urgent: 'الأكثر تقديمًا',
  unurgent: '🔥 إلغاء',
  urgentBadge: '🔥 الأكثر تقديمًا',
  urgentValue: 'الأكثر تقديمًا',
  yes: 'نعم',
  no: 'لا',
  save: 'حفظ',
  cancel: 'إلغاء',
  formNew: 'وظيفة جديدة',
  formEdit: 'تعديل الوظيفة',
  askDel: 'متأكد إنك عايز تمسح الوظيفة دي؟',
  askCol: 'اسم الخانة الجديدة؟',
  empty: 'مفيش وظايف',
  okMsg: 'تمت العملية بنجاح',
  errMsg: 'حصل خطأ: ',
  netErr: 'مفيش اتصال بالسيرفر'
};

let headers = [], rows = [];
let modalHistoryOpen = false;
let requestBusy = false;
let formInitialSnapshot = '';
let bypassDirtyWarning = false;
const $ = id => document.getElementById(id);

const AUTH_KEY = 'first_service_admin_pw';
const ACTIVITY_KEY = 'first_service_admin_last_activity';
const SESSION_IDLE_MS = 30 * 60 * 1000;
let sessionCheckTimer = null;
function savedPassword(){ return localStorage.getItem(AUTH_KEY) || ''; }
function touchSession(){
  if (savedPassword()) localStorage.setItem(ACTIVITY_KEY, String(Date.now()));
}
function clearLogin(){
  localStorage.removeItem(AUTH_KEY);
  localStorage.removeItem(ACTIVITY_KEY);
  if (sessionCheckTimer) { clearInterval(sessionCheckTimer); sessionCheckTimer = null; }
}
function sessionIsValid(){
  const pw = savedPassword();
  const last = Number(localStorage.getItem(ACTIVITY_KEY) || 0);
  return !!pw && !!last && (Date.now() - last < SESSION_IDLE_MS);
}
function expireLogin(){
  clearLogin();
  $('app').classList.add('hidden');
  $('login').classList.remove('hidden');
  $('pw').value = '';
  $('loginErr').textContent = 'انتهت جلسة الدخول، اكتب كلمة السر مرة أخرى';
}
function startSessionChecks(){
  if (sessionCheckTimer) clearInterval(sessionCheckTimer);
  sessionCheckTimer = setInterval(() => {
    if (savedPassword() && !sessionIsValid()) expireLogin();
  }, 15000);
}
['click','keydown','input','touchstart','scroll'].forEach(type => {
  document.addEventListener(type, () => { if (sessionIsValid()) touchSession(); }, {passive:true});
});
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && savedPassword()) {
    if (sessionIsValid()) touchSession(); else expireLogin();
  }
});
window.addEventListener('focus', () => {
  if (savedPassword()) { if (sessionIsValid()) touchSession(); else expireLogin(); }
});

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"'`]/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'}[c]));
}

let toastTimer;
function toast(msg, ok){
  const t = $('toast');
  t.textContent = msg; t.className = ok ? 'ok' : 'bad';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = 'hidden', 2800);
}

// ===== [4] الاتصال بالشيت =====
async function api(action, extra){
  if (API.indexOf('PASTE_') === 0) return {ok:false, error:T.noApi};
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 20000);
  try{
    const r = await fetch(API, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(Object.assign({password:savedPassword(), action}, extra||{})),
      signal:controller.signal
    });
    if (!r.ok) return {ok:false, error:'السيرفر رجّع خطأ (' + r.status + ')'};
    try {
      return await r.json();
    } catch(parseError) {
      return {ok:false, error:'وصل رد غير مفهوم من السيرفر. جرّب التحديث بعد التأكد من الاتصال.'};
    }
  }catch(e){
    if (e && e.name === 'AbortError') {
      return {ok:false, error:'الاتصال اتأخر أكثر من 20 ثانية. لم نعدّل الصفحة تلقائيًا؛ افحص الاتصال ثم جرّب مرة أخرى.'};
    }
    return {ok:false, error:T.netErr + ' — جرّب مرة أخرى بعد لحظات'};
  }finally{
    clearTimeout(timeoutId);
  }
}

async function load(){
  const r = await api('list');
  if (!r.ok){ toast(T.errMsg + r.error, false); return false; }
  headers = r.headers; rows = r.rows; render();
  return true;
}

function setBusyUI(busy){
  document.querySelectorAll('#app button, #sheet button').forEach(btn => {
    if (btn.id === 'fCancel') return;
    if (busy) { btn.dataset.wasDisabled = btn.disabled ? '1' : '0'; btn.disabled = true; }
    else { btn.disabled = btn.dataset.wasDisabled === '1'; delete btn.dataset.wasDisabled; }
  });
}

async function run(action, extra){
  if (requestBusy) {
    toast('فيه طلب شغال بالفعل، استنى لحد ما يخلص.', false);
    return false;
  }
  requestBusy = true;
  setBusyUI(true);
  try{
    if ((action === 'update' || action === 'add') && extra && extra.data && headers.includes(COL.mod) && !(COL.mod in extra.data)) extra.data[COL.mod] = nowStr();
    const r = await api(action, extra);
    if (!r.ok){ toast(T.errMsg + r.error, false); return false; }
    toast(T.okMsg, true);
    const refreshed = await load();
    if (!refreshed) toast('تم إرسال العملية، لكن تعذر تحديث القائمة. اضغط تحديث بعد التأكد من الاتصال.', false);
    return true;
  }catch(e){
    toast('حصل خطأ غير متوقع. جرّب مرة أخرى.', false);
    return false;
  }finally{
    requestBusy = false;
    setBusyUI(false);
  }
}

async function ensureRequiredCols(){
  try{
    let changed = false;
    for (const name of [COL.salary30, COL.salary26, COL.shifts, COL.contacts, COL.order, COL.mod]){
      if (!headers.includes(name)){ const a = await api('addColumn', {name}); if (a.ok) changed = true; }
    }
    if (changed){ const r2 = await api('list'); if (r2.ok){ headers = r2.headers; rows = r2.rows; } }
  }catch(e){}
}

// ===== [5] شاشة الدخول =====
async function login(pw){
  const previousPw = savedPassword();
  if (!pw) { $('loginErr').textContent = T.pwHint; return; }
  localStorage.setItem(AUTH_KEY, pw);
  localStorage.setItem(ACTIVITY_KEY, String(Date.now()));
  $('loginBtn').disabled = true;
  const r = await api('list');
  $('loginBtn').disabled = false;
  if (!r.ok){
    if (String(r.error || '').trim() === 'كلمة السر غلط') clearLogin();
    else if (!previousPw) clearLogin();
    $('loginErr').textContent = (r.error === 'كلمة السر غلط') ? T.wrongPw : r.error;
    return;
  }
  localStorage.setItem(AUTH_KEY, pw);
  touchSession();
  startSessionChecks();
  headers = r.headers; rows = r.rows;
  await ensureRequiredCols();
  $('loginErr').textContent = '';
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  render();
}

// ===== الورديات وأرقام التواصل =====
const SH_PRESETS = ['8 ساعات', '12 ساعة', '16 ساعة'];
let shState = [];
let contactsState = [];

function shNum(s){ const m = String(s || '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).match(/\d+/); return m ? +m[0] : 0; }
function parseShifts(txt){
  return String(txt || '').split(/\n/).map(l => l.trim()).filter(Boolean).map(l => {
    const p = l.split('|').map(x => x.trim()), s = {h: p[0] || '', p30: '', p26: ''};
    p.slice(1).forEach(x => { const m = x.match(/^(30|26)\s*يوم\s*:\s*(.*)$/); if (m) s['p' + m[1]] = m[2].trim(); });
    return s;
  }).filter(s => s.h || s.p30 || s.p26);
}
function shLabel(raw){ const n = shNum(raw); return n ? (n === 8 ? '8 ساعات' : n + ' ساعة') : String(raw || '').trim(); }
function serializeShifts(){
  const clean = v => String(v || '').replace(/[|\n]/g, ' ').trim();
  return shState.filter(s => clean(s.h)).map(s => {
    const parts = [clean(s.h)];
    const p30 = clean(s.p30) ? normSalary(clean(s.p30), COL.salary30) : '';
    const p26 = clean(s.p26) ? normSalary(clean(s.p26), COL.salary26) : '';
    if (p30) parts.push('30 يوم: ' + p30);
    if (p26) parts.push('26 يوم: ' + p26);
    return parts.join(' | ');
  }).join('\n');
}

function parseContacts(txt){
  return String(txt || '').split(/\n/).map(l => l.trim()).filter(Boolean).map(l => {
    const p = l.split('|').map(x => x.trim());
    return { name: p[1] ? p[0] : 'المسؤول', phone: p[1] || p[0] || '' };
  }).filter(c => c.phone);
}
function serializeContacts(){
  const clean = v => String(v || '').replace(/[|\n]/g, ' ').trim();
  return contactsState.filter(c => clean(c.phone)).map(c => {

}

async function moveRow(r, dir){
  if (requestBusy) { toast('فيه طلب شغال بالفعل، استنى لحد ما يخلص.', false); return; }
  const L = shownList.slice();
  const k = L.findIndex(x => x.row === r.row), k2 = k + dir;
  if (k < 0 || k2 < 0 || k2 >= L.length) return;
  [L[k], L[k2]] = [L[k2], L[k]];
  let last = Math.max(k, k2);
  L.forEach((x, i) => { if (isPinned(x) && i > last) last = i; });
  const changes = [];
  for (let i = 0; i <= last; i++){
    const want = String(i + 1);
    if (val(L[i], COL.order).trim() !== want) changes.push([L[i].row, want]);
  }
  requestBusy = true; setBusyUI(true);
  try {
    for (const [row, want] of changes){
      const a = await api('update', {row, data: {[COL.order]: want}});
      if (!a.ok) { toast(T.errMsg + a.error + ' (اضغط تحديث وراجع الترتيب)', false); return; }
    }
    toast(T.okMsg, true);
  } catch (e) {
    toast('حصل خطأ غير متوقع. اضغط تحديث وراجع الترتيب.', false);
  } finally {
    requestBusy = false; setBusyUI(false);
    await load();
  }
}

$('list').addEventListener('click', async e => {
  const sal = e.target.closest('[data-sal]');
  if (sal) return openSal(Number(sal.dataset.row), sal.dataset.sal);
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const row = Number(b.dataset.row);
  const r = rows.find(x => x.row === row);
  if (!r) return;
  const act = b.dataset.act;
  if (act === 'up') return moveRow(r, -1);
  if (act === 'down') return moveRow(r, 1);
  if (act === 'edit') return openForm(r);
  if (act === 'copy') return openForm(r, true);
  if (act === 'view') return window.open(new URL('index.html', location.href).href + '?j=' + siteId(val(r, COL.factory)), '_blank');
  if (act === 'vis'){
    const hid = val(r, COL.visible).trim() === T.no;
    if (!hid && !confirm('تخفي "' + val(r, COL.factory) + '" عن المتقدمين؟')) return;
    return run('update', {row, data:{[COL.visible]: hid ? T.yes : T.no}});
  }
  if (act === 'done'){
    const done = val(r, COL.status).trim() === T.doneValue;
    if (!done && !confirm('تعلّم "' + val(r, COL.factory) + '" مكتمل؟')) return;
    return run('update', {row, data:{[COL.status]: done ? '' : T.doneValue}});
  }
  if (act === 'urg'){
    const urg = isUrgVal(val(r, COL.status));
    return run('update', {row, data:{[COL.status]: urg ? '' : T.urgentValue}});
  }
  if (act === 'pin'){
    const nums = rows.filter(isPinned).map(manualOf);
    return run('update', {row, data: isPinned(r) ? {[COL.order]: '', [COL.pin]: ''} : {[COL.order]: String(Math.max(0, ...nums) + 1)}});
  }
  if (act === 'del'){
    if (confirm(T.askDel)) run('delete', {row});
  }
});

function presetOptions(header){
  return [...new Set(rows.map(row => String(val(row, header) ?? '').trim()).filter(Boolean))];
}

function currentFormSnapshot(){
  return JSON.stringify([...$('sheet').querySelectorAll('[data-i]')].map(el => {
    const index = el.dataset.i;
    const custom = $('sheet').querySelector('[data-custom-i="' + index + '"]');
    return [index, el.value, custom ? custom.value : ''];
  }).concat([JSON.stringify(shState), JSON.stringify(contactsState)]));
}
function formHasUnsavedChanges(){
  return !!formInitialSnapshot && currentFormSnapshot() !== formInitialSnapshot;
}

function formOrder(){
  const a = headers.indexOf(COL.salary30), b = headers.indexOf(COL.salary26);
  const sIdx = headers.indexOf(COL.shifts);
  const cIdx = headers.indexOf(COL.contacts);
  const rest = headers.map((_, i) => i).filter(i => i !== a && i !== b && i !== sIdx && i !== cIdx);
  let at = headers.indexOf(COL.shift); if (at < 0) at = headers.indexOf(COL.factory);
  const pos = at < 0 ? rest.length : rest.indexOf(at) + 1;
  rest.splice(pos, 0, ...[sIdx, a, b, cIdx].filter(i => i >= 0));
  return rest;
}

let draftKeyNow = 'gp_draft:new';
function saveDraft(){
  try{
    if (!formInitialSnapshot) return;
    const s = currentFormSnapshot();
    if (s === formInitialSnapshot) localStorage.removeItem(draftKeyNow);
    else localStorage.setItem(draftKeyNow, JSON.stringify({s, t: Date.now()}));
  }catch(e){}
}
function clearDraft(){ try{ localStorage.removeItem(draftKeyNow); }catch(e){} }
function applyDraft(s){
  const arr = JSON.parse(s), lastCt = arr.pop(), lastSh = arr.pop();
  arr.forEach(([i, v, c]) => {
    const el = $('sheet').querySelector('[data-i="' + i + '"]'), cu = $('sheet').querySelector('[data-custom-i="' + i + '"]');
    if (el) el.value = v;
    if (el && el.value !== v && cu){ el.value = '__custom__'; cu.classList.remove('hidden'); }
    if (cu) cu.value = c;
  });
  try{ shState = JSON.parse(lastSh); }catch(e){}
  try{ contactsState = JSON.parse(lastCt); }catch(e){}

}

    if (headers.includes(COL.shifts) && (h === COL.shift || h === COL.salary30 || h === COL.salary26)) return '';
    if (h === COL.salary) return '';

    } else if (h === COL.status){
      input = '<select data-i="' + i + '"><option value=""' + (v === '' ? ' selected' : '') + '></option>' +

        '<option value="' + esc(T.urgentValue) + '"' + (isUrgVal(v) ? ' selected' : '') + '>' + esc(T.urgentValue) + '</option></select>';
    } else if (!/(المصنع|اسم المصنع|factory)/i.test(h) && !/(المرتب|الراتب|مرتب|راتب|salary)/i.test(h)) {

      if (opts.length) {
        input = '<select data-i="' + i + '">' +
          '<option value=""' + (v === '' ? ' selected' : '') + '>— اختر —</option>' +
          opts.map(o => '<option value="' + esc(o) + '"' + (o === v ? ' selected' : '') + '>' + esc(o) + '</option>').join('') +

      }

    }

    return '<label>' + esc(h) + input + hint + clr + '</label>';
  }).join('');
  
  $('sheet').innerHTML = '<h3>' + esc(r ? T.formEdit : T.formNew) + '</h3>' + fields +
    '<div class="row"><button class="btn" id="fSave">' + esc(T.save) + '</button>' +
    '<button class="btn ghost" id="fCancel">' + esc(T.cancel) + '</button></div>';
  
  if ($('modal').classList.contains('hidden')) {
    history.pushState({adminModal: true}, '', location.href);
    modalHistoryOpen = true;
  }
  $('modal').classList.remove('hidden');
  renderShEditor();
  renderContactsEditor();
  
  $('fCancel').onclick = closeForm;
  $('sheet').querySelectorAll('.clr').forEach(b => b.onclick = e => {
    e.preventDefault();
    const idx = b.dataset.clr, el = $('sheet').querySelector('[data-i="' + idx + '"]'), cu = $('sheet').querySelector('[data-custom-i="' + idx + '"]');
    if (!el || !(el.value && el.value !== '__custom__' || (cu && cu.value))) return;
    if (!confirm('تمسح محتوى خانة "' + headers[+idx] + '"؟')) return;
    el.value = ''; if (cu){ cu.value = ''; cu.classList.add('hidden'); }
  });
  $('sheet').querySelectorAll('select[data-i]').forEach(el => {
    el.addEventListener('change', () => {
      const custom = $('sheet').querySelector('[data-custom-i="' + el.dataset.i + '"]');
      if (custom) {
        custom.classList.toggle('hidden', el.value !== '__custom__');
        if (el.value === '__custom__') custom.focus();
      }
    });
  });
  
  formInitialSnapshot = currentFormSnapshot();
  try{
    const raw = localStorage.getItem(draftKeyNow);
    if (raw){
      const d = JSON.parse(raw);
      if (d.s && d.s !== formInitialSnapshot && confirm('فيه مسودة محفوظة من آخر مرة. تكمل منها؟')) applyDraft(d.s);
      else clearDraft();
    }
  }catch(e){}
  
  $('sheet').oninput = $('sheet').onchange = saveDraft;
  $('fSave').onclick = async () => {
    const data = {};
    $('sheet').querySelectorAll('[data-i]').forEach(el => {
      const index = Number(el.dataset.i);
      const custom = $('sheet').querySelector('[data-custom-i="' + index + '"]');
      data[headers[index]] = (el.value === '__custom__' && custom) ? custom.value.trim() : el.value;
    });
    
    [COL.salary30, COL.salary26].forEach(c => {
      if (!(c in data)) return;
      data[c] = normSalary(data[c], c);
    });
    
    if (headers.includes(COL.shifts)){
      data[COL.shifts] = serializeShifts();
    }
    if (headers.includes(COL.contacts)){
      data[COL.contacts] = serializeContacts();
    }
    
    if (!r && DATE_COL in data && !String(data[DATE_COL]).trim()) data[DATE_COL] = todayStr();
    if (headers.includes(COL.factory) && !String(data[COL.factory] || '').trim()) {
      toast('اكتب اسم المصنع الأول.', false);
      return;
    }
    
    $('fSave').disabled = true;
    $('fSave').textContent = 'جارٍ الحفظ...';
    const ok = r ? await run('update', {row:r.row, data}) : await run('add', {data});
    if (ok) closeForm(true);
    else {
      $('fSave').disabled = false;
      $('fSave').textContent = T.save;
    }
  };
}

function closeForm(forceOrFromPopState, fromPopState){
  const force = forceOrFromPopState === true && fromPopState !== true;
  const isPop = forceOrFromPopState === true && fromPopState === true;
  const wasOpen = !$('modal').classList.contains('hidden');
  if (!wasOpen) return;
  if (!force && !bypassDirtyWarning && formHasUnsavedChanges()) {
    const leave = confirm('فيه تعديلات لسه ما اتحفظتش. هل تريد الخروج من غير حفظ؟');
    if (!leave) {
      if (isPop) {
        history.pushState({adminModal: true}, '', location.href);
        modalHistoryOpen = true;
      }
      return;
    }
  }
  clearDraft();
  $('modal').classList.add('hidden');
  $('sheet').innerHTML = '';
  formInitialSnapshot = '';
  if (wasOpen && modalHistoryOpen && !isPop && !force) {
    modalHistoryOpen = false;
    history.back();
  } else if (isPop || force) {
    modalHistoryOpen = false;
  }
}

window.addEventListener('popstate', () => {
  if (ignorePop > 0){ ignorePop--; return; }
  if (layers.length){ layers.pop().classList.add('hidden'); return; }
  if (!$('modal').classList.contains('hidden')) closeForm(true, true);
});

// ===== [9] خانة جديدة والتحديث والخروج =====
function init(){
  $('loginTitle').textContent = T.loginTitle;
  $('pw').placeholder = T.pwHint;
  $('loginBtn').textContent = T.login;
  $('bNew').textContent = T.newJob;
  $('bCol').textContent = T.newCol;
  $('bRef').textContent = T.refresh;
  $('bOut').textContent = T.logout;

  $('loginBtn').onclick = () => { $('loginErr').textContent = ''; login($('pw').value); };
  $('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); });
  $('areaFilter').addEventListener('change', render);
  $('genderFilter').addEventListener('change', render);
  $('q').addEventListener('input', render);
  $('bSearch').onclick = () => { $('filters').classList.toggle('hidden'); render(); };
  $('fab').onclick = () => $('bNew').click();
  $('bNew').onclick = () => openForm(null);
  $('bRef').onclick = load;
  $('bOut').onclick = () => { clearLogin(); location.reload(); };
  $('bCol').onclick = () => {
    const name = prompt(T.askCol);
    if (name !== null) run('addColumn', {name});
  };
  $('bDelCol').onclick = openDelCol;
  $('colSel').onchange = colCheck; $('colIn').oninput = colCheck;
  $('colCancel').onclick = () => closeLayer($('colDlg'));
  $('colDlg').addEventListener('click', e => { if (e.target.id === 'colDlg') closeLayer($('colDlg')); });
  $('colGo').onclick = async () => {
    const name = $('colSel').value;
    if ($('colIn').value.trim() !== name) return;
    if (!confirm('آخر تأكيد: مسح عمود "' + name + '" نهائيًا؟')) return;
    closeLayer($('colDlg'));
    await run('deleteColumn', {name});
  };
  $('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeForm(); });

  const saved = savedPassword();
  if (saved && sessionIsValid()) {
    touchSession();
    startSessionChecks();
    login(saved);
  } else {
    clearLogin();
  }
}
init();
</script>
