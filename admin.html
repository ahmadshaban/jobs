<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>لوحة الوظايف والأدمن الشاملة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --c-main:#0B2A4A;--c-main-dark:#08203A;--c-main-soft:#123A63;--c-bg:#0D2F52;--c-card:#0B2A4A;--c-text:#FFFFFF;--c-sub:#FFE45C;--c-border:#3F7AB5;--c-ok:#16803d;--c-bad:#ff7777;--c-warn:#FFE45C;--c-highlight:#FFE45C;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Cairo',sans-serif;background:linear-gradient(145deg,#071C33 0%,#0F3A66 55%,#0A2A4D 100%);color:#fff;font-size:15px}
button,input,select{font-family:inherit;font-size:inherit}
.hidden{display:none!important}
.btn{border:1px solid #3F7AB5;border-radius:9px;padding:7px 11px;font-size:13px;font-weight:700;cursor:pointer;background:#0E3560;color:#fff}
.btn:active{background:#082A4C}
.btn.ghost{background:#FFE45C;color:#0E3560;border-color:#FFE45C}
.btn.danger{background:transparent;color:#fff;border:1px solid #FF9B9B}
.btn:disabled{opacity:.65}
input,select{width:100%;padding:10px 12px;border:1px solid #3F7AB5;border-radius:10px;background:#0B2A4A;color:#fff}
input::placeholder{color:#E5F4FF;opacity:1}
select option{background:#0B2A4A;color:#fff}
input:focus,select:focus,.btn:focus-visible{outline:2px solid #FFE45C;outline-offset:2px}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{width:100%;max-width:340px;background:#0B2A4A;border:1px solid #3F7AB5;border-radius:16px;padding:22px;display:grid;gap:12px}
.login-box h1{margin:0;font-size:20px;color:#FFE45C}
.err{color:#FFE45C;min-height:20px;font-size:14px}
header{position:sticky;top:0;z-index:5;background:#0B2A4A;border-bottom:1px solid #3F7AB5;padding:12px;display:grid;gap:10px}
header h1{margin:0;font-size:18px;color:#fff}
.bar{display:flex;gap:8px;flex-wrap:wrap}
.bar .btn{flex:1 1 auto;padding:6px 8px;font-size:12.5px}
#list{padding:12px;display:grid;gap:10px;max-width:760px;margin:0 auto}
.card{background:#0B2A4A;border:1px solid #3F7AB5;border-radius:12px;padding:9px;display:grid;gap:6px;color:#fff}
.card.dim{opacity:.65}
.card h2{margin:0;font-size:15px;color:#FFE45C}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.meta span{background:#1A4A7A;color:#fff;border:1px solid #3F7AB5;border-radius:7px;padding:1px 7px;font-size:11.5px}
.badge{border-radius:7px;padding:1px 7px;font-size:11px;font-weight:700;margin-inline-start:5px}
.badge.done{background:#16803d;color:#fff}
.stats{font-size:12px;color:#CFE3F7;margin-top:6px}
.badge.urg{background:#FFE45C;color:#0E3560}.badge.pin{background:#C2410C;color:#fff}
.badge.hid{background:transparent;color:#FFE45C;border:1px solid #FFE45C}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.acts .btn{padding:6px 2px;font-size:11.5px;line-height:1.3}
.empty{text-align:center;color:#fff;padding:30px}
#modal,#uiModal{position:fixed;inset:0;background:rgba(0,20,50,.65);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:#0B2A4A;color:#fff;width:100%;max-width:560px;max-height:90vh;overflow:auto;border:1px solid #3F7AB5;border-radius:18px 18px 0 0;padding:16px;display:grid;gap:10px}
.sheet h3{margin:0;color:#FFE45C}
.sheet label{font-size:13px;color:#FFE45C;display:grid;gap:4px}
.sheet .row{display:flex;gap:8px}
.sheet .row .btn{flex:1}
.fab{position:fixed;bottom:20px;inset-inline-end:16px;z-index:6;width:56px;height:56px;border-radius:50%;border:0;background:#FFE45C;color:#0E3560;font-size:32px;font-weight:700;line-height:1;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4)}
#salDlg,#colDlg{position:fixed;inset:0;background:rgba(0,20,50,.65);display:flex;align-items:center;justify-content:center;z-index:15;padding:16px}
#salDlg .box,#colDlg .box{background:#0B2A4A;border:1px solid #3F7AB5;border-radius:16px;padding:16px;width:100%;max-width:340px;display:grid;gap:10px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:12px;color:#fff;font-weight:700;z-index:20;max-width:90%}
#toast.ok{background:#16803d}#toast.bad{background:#B42318}
.toggle-row{display:flex;align-items:center;justify-content:space-between;background:#123A63;padding:8px 12px;border-radius:8px;margin-top:4px}
.toggle-row label{color:#fff;font-size:13px}
</style>
</head>
<body>

<div id="login">
  <div class="login-box">
    <h1 id="loginTitle">دخول الأدمن</h1>
    <input id="pw" type="password" autocomplete="current-password" placeholder="كلمة السر">
    <div class="err" id="loginErr"></div>
    <button class="btn" id="loginBtn">دخول</button>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <h1 id="title">الوظايف</h1>
    <div id="filters" style="display:grid;gap:10px">
      <div style="display:flex;gap:8px">
        <select id="areaFilter"><option value="">اختار المكان أولًا</option></select>
        <select id="genderFilter">
          <option value="">الكل</option>
          <option value="m">شباب</option>
          <option value="f">بنات</option>
          <option value="b">شباب وبنات</option>
        </select>
      </div>
      <input id="q" type="search" placeholder="دوّر باسم المصنع...">
    </div>
    <div class="bar">
      <button class="btn ghost" id="bSearch" style="flex:0 0 auto">🔍</button>
      <button class="btn" id="bNew">وظيفة جديدة</button>
      <button class="btn ghost" id="bUICustom">🎨 تخصيص الواجهة والتصميم</button>
      <button class="btn ghost" id="bCol">خانة جديدة</button>
      <button class="btn danger" id="bDelCol">مسح عمود</button>
      <button class="btn ghost" id="bRef">تحديث</button>
      <button class="btn danger" id="bOut">خروج</button>
    </div>
    <div id="stats" class="stats"></div>
  </header>

  <div id="list"></div>
  <button class="fab" id="fab">+</button>
</div>

<!-- Modal الوظيفة -->
<div id="modal" class="hidden"><div class="sheet" id="sheet"></div></div>

<!-- Modal تخصيص الواجهة والتصميم -->
<div id="uiModal" class="hidden">
  <div class="sheet">
    <h3>🎨 تخصيص صفحة الـ Index والتصميم</h3>
    <p style="font-size:12px;color:#CFE3F7;margin:0">عدّل أي حاجة في تصميم وصفحة العرض وسيتم حفظها مباشرة في السيرفر!</p>
    
    <label>العنوان الرئيسي في الأعلى
      <input id="ui_header_title" type="text" placeholder="عمال تعبئة وتغليف وفرز">
    </label>

    <label>الجملة الترويجية (تحت العنوان)
      <input id="ui_header_sub" type="text" placeholder="قدّم من الموبايل في دقايق...">
    </label>

    <label>نص زرار الواتساب العايم
      <input id="ui_wa_btn_text" type="text" placeholder="💬 اسأل على واتساب">
    </label>

    <label>رقم الواتساب (بالصيغة الدولية)
      <input id="ui_whatsapp_phone" type="text" placeholder="201095237207">
    </label>

    <label>نص سطر الثقة
      <input id="ui_trust_text" type="text" placeholder="✅ التقديم من غير أي رسوم مقدما">
    </label>

    <h4 style="color:#FFE45C;margin:10px 0 0">إخفاء وإظهار العناصر:</h4>
    <div class="toggle-row"><label>إظهار سطر الثقة وزر الواتساب العلوي</label><input type="checkbox" id="ui_show_trust"></div>
    <div class="toggle-row"><label>إظهار الفلتر العلوي (شريط الفئات)</label><input type="checkbox" id="ui_show_bar"></div>
    <div class="toggle-row"><label>إظهار فلتر المناطق</label><input type="checkbox" id="ui_show_area_filter"></div>
    <div class="toggle-row"><label>إظهار شارة "جديد"</label><input type="checkbox" id="ui_show_new_badge"></div>
    <div class="toggle-row"><label>إظهار شارة "الأكثر تقديمًا"</label><input type="checkbox" id="ui_show_urgent_badge"></div>
    <div class="toggle-row"><label>إظهار شارات السكن والمواصلات</label><input type="checkbox" id="ui_show_tags"></div>
    <div class="toggle-row"><label>إظهار ملاحظات المرتب</label><input type="checkbox" id="ui_show_notes"></div>

    <h4 style="color:#FFE45C;margin:10px 0 0">أحجام الخطوط والأزرار:</h4>
    <label>حجم خط العنوان الرئيسي (مثال: 1.4rem)
      <input id="ui_title_font_size" type="text" placeholder="1.4rem">
    </label>
    <label>حجم خط عنوان المصنع داخل الكارت (مثال: 1.1rem)
      <input id="ui_card_title_size" type="text" placeholder="1.1rem">
    </label>
    <label>حجم خط المرتب (مثال: 1.25rem)
      <input id="ui_card_pay_size" type="text" placeholder="1.25rem">
    </label>
    <label>حجم الهامش الداخلي للأزرار Padding (مثال: .32rem .65rem)
      <input id="ui_btn_padding" type="text" placeholder=".32rem .65rem">
    </label>
    <label>استدوار حواف الأزرار Border Radius (مثال: .62rem)
      <input id="ui_btn_radius" type="text" placeholder=".62rem">
    </label>

    <div class="row" style="margin-top:10px">
      <button class="btn" id="saveUIBtn">حفظ إعدادات الواجهة</button>
      <button class="btn ghost" id="cancelUIBtn">إلغاء</button>
    </div>
  </div>
</div>

<div id="salDlg" class="hidden"><div class="box"><h3 id="salT"></h3><input id="salIn" type="text"><div class="row"><button class="btn" id="salSave">حفظ</button><button class="btn ghost" id="salCancel">إلغاء</button></div></div></div>
<div id="colDlg" class="hidden"><div class="box"><h3>مسح عمود</h3><select id="colSel"></select><input id="colIn" type="text"><div class="row"><button class="btn danger" id="colGo" disabled>امسح</button><button class="btn ghost" id="colCancel">إلغاء</button></div></div></div>
<div id="toast" class="hidden"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbzwMRST469OBo-ym0Ccn-Ot84jGrL0KEM9SZcnfe-tip2U6-1gyryjnYxdNNsiwbLEyng/exec';

const COL = {
  factory: 'المصنع', area: 'المنطقة', gender: 'الفئة', mod: 'آخر تعديل', order: 'الترتيب',
  pin: 'تثبيت', shifts: 'الورديات', shift: 'الشفت', salary: 'المرتب', salary30: 'مرتب 30 يوم',
  salary26: 'مرتب 26 يوم', visible: 'ظاهر؟', status: 'الحالة'
};

const AUTH_KEY = 'first_service_admin_pw';
function savedPassword(){ return localStorage.getItem(AUTH_KEY) || ''; }

const $ = id => document.getElementById(id);

async function api(action, extra){
  try{
    const r = await fetch(API, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(Object.assign({password:savedPassword(), action}, extra||{}))
    });
    return await r.json();
  }catch(e){
    return {ok:false, error:'حدث خطأ في الاتصال بالسيرفر'};
  }
}

let headers = [], rows = [];

async function load(){
  const r = await api('list');
  if (!r.ok){ alert('خطأ في التحميل: ' + r.error); return; }
  headers = r.headers; rows = r.rows; render();
}

function render(){
  const area = $('areaFilter').value;
  const q = $('q').value.trim().toLocaleLowerCase('ar');
  
  const list = (area || q) ? rows.filter(r => {
    const factory = (r.values[headers.indexOf(COL.factory)] || '').toLocaleLowerCase('ar');
    const areaVal = r.values[headers.indexOf(COL.area)] || '';
    return (!area || areaVal === area) && (!q || factory.includes(q));
  }) : [];

  $('list').innerHTML = list.length ? list.map(r => {
    const f = r.values[headers.indexOf(COL.factory)] || '';
    return `<div class="card"><h2>${f}</h2></div>`;
  }).join('') : '<div class="empty">اختار مكان أو ابحث لمشاهدة الوظائف</div>';
}

// فتح نافذة تخصيص الواجهة وجلب القيم الحالية من السيرفر
$('bUICustom').onclick = async () => {
  const res = await api('getSettings');
  if (res && res.ok && res.settings) {
    const s = res.settings;
    $('ui_header_title').value = s.header_title \vert{}\vert{} '';$('ui_header_sub').value = s.header_sub || '';
    $('ui_wa_btn_text').value = s.wa_btn_text \vert{}\vert{} '';$('ui_whatsapp_phone').value = s.whatsapp_phone || '';
    $('ui_trust_text').value = s.trust_text \vert{}\vert{} '';$('ui_show_trust').checked = s.show_trust === 'true' || s.show_trust === true;
    $('ui_show_bar').checked = s.show_bar === 'true' || s.show_bar === true;
    $('ui_show_area_filter').checked = s.show_area_filter === 'true' || s.show_area_filter === true;
    $('ui_show_new_badge').checked = s.show_new_badge === 'true' || s.show_new_badge === true;
    $('ui_show_urgent_badge').checked = s.show_urgent_badge === 'true' || s.show_urgent_badge === true;
    $('ui_show_tags').checked = s.show_tags === 'true' || s.show_tags === true;
    $('ui_show_notes').checked = s.show_notes === 'true' || s.show_notes === true;
    $('ui_title_font_size').value = s.title_font_size || '';
    $('ui_card_title_size').value = s.card_title_size \vert{}\vert{} '';$('ui_card_pay_size').value = s.card_pay_size || '';
    $('ui_btn_padding').value = s.btn_padding \vert{}\vert{} '';$('ui_btn_radius').value = s.btn_radius || '';
  }
  $('uiModal').classList.remove('hidden');
};

$('cancelUIBtn').onclick = () =>$('uiModal').classList.add('hidden');

// حفظ الإعدادات وإرسالها الفعلي للسيرفر
$('saveUIBtn').onclick = async () => {
  const settingsData = {
    header_title: $('ui_header_title').value,
    header_sub: $('ui_header_sub').value,
    wa_btn_text: $('ui_wa_btn_text').value,
    whatsapp_phone: $('ui_whatsapp_phone').value,
    trust_text: $('ui_trust_text').value,
    show_trust: $('ui_show_trust').checked,
    show_bar: $('ui_show_bar').checked,
    show_area_filter: $('ui_show_area_filter').checked,
    show_new_badge: $('ui_show_new_badge').checked,
    show_urgent_badge: $('ui_show_urgent_badge').checked,
    show_tags: $('ui_show_tags').checked,
    show_notes: $('ui_show_notes').checked,
    title_font_size: $('ui_title_font_size').value,
    card_title_size: $('ui_card_title_size').value,
    card_pay_size: $('ui_card_pay_size').value,
    btn_padding: $('ui_btn_padding').value,
    btn_radius: $('ui_btn_radius').value
  };

  const res = await api('saveSettings', { settings: settingsData });
  
  if (res && res.ok) {
    alert('تم حفظ إعدادات الواجهة وتفعيلها في الشيت بنجاح! ستظهر التعديلات فوراً في صفحة الـ Index.');
    $('uiModal').classList.add('hidden');
    location.reload();
  } else {
    alert('حدث خطأ أثناء الحفظ: ' + (res ? res.error : 'خطأ غير معروف'));
  }
};

$('loginBtn').onclick = () => {
  localStorage.setItem(AUTH_KEY, $('pw').value);
  $('login').classList.add('hidden');$('app').classList.remove('hidden');
  load();
};
</script>
</body>
</html>
