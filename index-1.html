<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>وظائف المصانع</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#111827;--mu:#6b7280;--bd:#e5e7eb;--ac:#15803d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#1a1d24;--tx:#f3f4f6;--mu:#9ca3af;--bd:#2b2f38;--ac:#22c55e}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#1a1d24;--tx:#f3f4f6;--mu:#9ca3af;--bd:#2b2f38;--ac:#22c55e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif}
.w{max-width:42rem;margin:auto;padding:1rem}
h1{font-size:1.6rem;margin:.5rem 0 0}.mu{color:var(--mu)}.ac{color:var(--ac)}
.inp{width:100%;background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:.8rem;padding:.7rem .9rem;font-size:16px;margin-bottom:.6rem}
.chips{display:flex;gap:.5rem;overflow-x:auto;margin-bottom:.7rem}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:.45rem 1rem;white-space:nowrap;font-size:.9rem;cursor:pointer}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{display:block;width:100%;text-align:right;background:var(--card);border:1px solid var(--bd);border-radius:1rem;padding:1rem;margin-bottom:.7rem;color:var(--tx);font:inherit;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.tag{display:inline-block;font-size:.75rem;border:1px solid var(--bd);border-radius:99px;padding:.15rem .6rem;margin:.4rem .3rem 0 0;color:var(--mu)}
.badge{font-size:.72rem;font-weight:700;border-radius:99px;padding:.15rem .6rem;color:#fff;background:var(--ac)}
.badge.b{background:#db2777}.badge.s{background:#2563eb}
.ov{display:none;position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.55);align-items:flex-end;justify-content:center}
.ov.show{display:flex}@media(min-width:640px){.ov{align-items:center}}
.sheet{background:var(--card);border:1px solid var(--bd);width:100%;max-width:28rem;max-height:92%;overflow-y:auto;padding:1.25rem;border-radius:1.5rem 1.5rem 0 0}
@media(min-width:640px){.sheet{border-radius:1.5rem}}
.f{border:1px solid var(--bd);border-radius:.8rem;padding:.7rem;margin-top:.6rem}.f small{display:block;color:var(--mu);margin-bottom:.2rem}.f b{font-size:.95rem}
.btn{display:block;text-align:center;font-weight:700;border-radius:.8rem;padding:.8rem;margin-top:.5rem;text-decoration:none;border:1px solid var(--bd);color:var(--tx)}
.x{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:50%;width:2.2rem;height:2.2rem;font-size:1.1rem;cursor:pointer}
</style>
</head>
<body>
<div class="w">
  <h1>وظائف المصانع</h1><p class="mu" style="margin:.2rem 0 1rem">اختار الوظيفة المناسبة وقدّم مباشرة</p>
  <input id="q" type="search" class="inp" placeholder="ابحث باسم الوظيفة أو المصنع...">
  <div id="cat" class="chips"></div>
  <div id="area" class="chips"></div>
  <div id="list"></div><p id="empty" class="mu" style="text-align:center;padding:2rem;display:none">مفيش نتائج مطابقة</p>
</div>
<div id="modal" class="ov"></div>
<script>
/* ===== إعدادات ===== */
const PHONE = "201095237207";   // رقم الواتساب بصيغة دولية بدون +
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1Ri61Py0q36t2EdMCWXa0lgJGDWJfrXjY0gHmqnwS4AM/gviz/tq?tqx=out:csv&headers=1&sheet=%D8%A7%D9%84%D9%88%D8%B8%D8%A7%D8%A6%D9%81";       // رابط الشيت (Publish to web → CSV). لو فاضي الموقع بيستخدم البيانات التجريبية تحت

/* ===== بيانات تجريبية (نفس أعمدة الشيت بالظبط) ===== */
const SAMPLE = [
{"المنطقة":"6 أكتوبر","الفئة":"بنات","المصنع":"مصنع أدوية (استيكر)","المؤهل":"نقاب عادي - مؤهلات","الشفت":"9 ساعات (8 ص : 5 م)","المرتب":"200 ج/يوماً","نظام القبض":"يومي / أسبوعي / شهري","السكن":"لا يوجد","السلف":"متاح بعد أسبوع","المواصلات":"خارجية (خطوط)","التأمينات":"بعد 3 شهور","الأجازة":"الجمعة","ظاهر؟":"نعم"},
{"المنطقة":"6 أكتوبر","الفئة":"شباب وبنات","المصنع":"مصنع أغذية (شيبسي)","المؤهل":"مؤهلات متوسطة وعليا","الشفت":"12 ساعة (شفتات متغيرة)","المرتب":"7000 ج شهرياً","نظام القبض":"شهري","السكن":"لا يوجد","السلف":"متاح","المواصلات":"داخلية","وجبة":"وجبة يومية","التأمينات":"من أول يوم","الأجازة":"يوم أسبوعياً","ظاهر؟":"نعم"},
{"المنطقة":"مدينة السادات","الفئة":"شباب","المصنع":"مصنع غزل ونسيج","المؤهل":"عمال إنتاج","الشفت":"12 ساعة","المرتب":"6500 ج شهرياً","نظام القبض":"شهري","السكن":"متوفر (مجاناً)","السلف":"متاح","المواصلات":"داخلية","التأمينات":"بعد شهر","الأجازة":"الجمعة","ظاهر؟":"نعم"},
{"المنطقة":"العاشر من رمضان","الفئة":"شباب","المصنع":"مصنع بلاستيك","المؤهل":"أي مؤهل - لياقة بدنية","الشفت":"12 ساعة (ليلي / نهاري)","المرتب":"6800 ج شهرياً","نظام القبض":"أسبوعي","السكن":"متوفر بخصم 300 ج","السلف":"متاح بعد شهر","المواصلات":"خارجية","وجبة":"وجبة","التأمينات":"بعد 3 شهور","ظاهر؟":"نعم"},
{"المنطقة":"العاشر من رمضان","الفئة":"بنات","المصنع":"مصنع ملابس جاهزة","المؤهل":"خبرة مش شرط","الشفت":"9 ساعات (8 ص : 5 م)","المرتب":"190 ج/يوماً","نظام القبض":"أسبوعي","السكن":"سكن بنات متوفر","السلف":"متاح","المواصلات":"داخلية","الأجازة":"الجمعة","ظاهر؟":"نعم"},
{"المنطقة":"بدر","الفئة":"بنات","المصنع":"مصنع منظفات","المؤهل":"نقاب عادي - مؤهلات","الشفت":"8 ساعات","المرتب":"185 ج/يوماً","نظام القبض":"يومي","السكن":"لا يوجد","السلف":"غير متاح","المواصلات":"خارجية (خطوط)","الأجازة":"الجمعة","ظاهر؟":"نعم"},
{"المنطقة":"بدر","الفئة":"شباب","المصنع":"مصنع ألومنيوم","المؤهل":"عمال إنتاج","الشفت":"12 ساعة","المرتب":"7500 ج شهرياً","نظام القبض":"شهري","السكن":"متوفر","السلف":"متاح","المواصلات":"داخلية","وجبة":"وجبتين","التأمينات":"من أول يوم","ظاهر؟":"نعم"},
{"المنطقة":"6 أكتوبر","الفئة":"بنات","المصنع":"مصنع لانشون","المؤهل":"مؤهلات - بدون نقاب","الشفت":"9 ساعات","المرتب":"195 ج/يوماً","نظام القبض":"أسبوعي","السكن":"لا يوجد","السلف":"متاح","المواصلات":"خارجية","الأجازة":"الجمعة","ظاهر؟":"نعم"},
{"المنطقة":"مدينة السادات","الفئة":"بنات","المصنع":"مصنع سايلو","المؤهل":"مؤهلات","الشفت":"8 ساعات","المرتب":"180 ج/يوماً","نظام القبض":"أسبوعي","السكن":"لا يوجد","السلف":"متاح","المواصلات":"خارجية","ظاهر؟":"نعم"},
{"المنطقة":"العبور","الفئة":"شباب وبنات","المصنع":"مصنع تعبئة وتغليف","المؤهل":"أي مؤهل","الشفت":"10 ساعات","المرتب":"6200 ج شهرياً","نظام القبض":"شهري","السكن":"لا يوجد","السلف":"متاح","المواصلات":"خارجية","وجبة":"وجبة","التأمينات":"بعد 3 شهور","ظاهر؟":"نعم"},
{"المنطقة":"العبور","الفئة":"شباب","المصنع":"مصنع ثلاجات وتبريد","المؤهل":"دبلوم صنايع","الشفت":"12 ساعة","المرتب":"8000 ج شهرياً","نظام القبض":"شهري","السكن":"متوفر","السلف":"متاح","المواصلات":"داخلية","التأمينات":"من أول يوم","ظاهر؟":"نعم"},
{"المنطقة":"6 أكتوبر","الفئة":"شباب","المصنع":"مصنع قديم (مخفي للتجربة)","المؤهل":"-","الشفت":"-","المرتب":"-","ظاهر؟":"لا"}
];

/* أعمدة أساسية؛ أي عمود غيرها يظهر تلقائي في التفاصيل بترتيبه */
const CORE=["المنطقة","الفئة","المصنع","المؤهل","الشفت","المرتب","ظاهر؟"];
let JOBS=[], cat="الكل", area="الكل";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function parseCSV(t){const r=[];let row=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];
 if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
 else if(c=='"')q=true;else if(c==","){row.push(f);f=""}
 else if(c=="\n"){row.push(f);r.push(row);row=[];f=""}else if(c!="\r")f+=c}
 if(f||row.length){row.push(f);r.push(row)}
 const h=r[0].map(x=>x.trim());return r.slice(1).filter(x=>x.some(v=>v.trim())).map(x=>Object.fromEntries(h.map((k,i)=>[k,(x[i]||"").trim()])))}

async function load(){
  let d=SAMPLE;
  if(SHEET_CSV_URL){try{const r=await fetch(SHEET_CSV_URL);d=parseCSV(await r.text())}catch(e){}}
  JOBS=d.filter(j=>(j["ظاهر؟"]||"نعم").trim()!=="لا"&&j["المصنع"]);
  draw();
}
const uniq=k=>["الكل",...new Set(JOBS.map(j=>j[k]).filter(Boolean))];
const catOf=c=>c.includes("بنات")&&c.includes("شباب")?"s":c.includes("بنات")?"b":"s";
function draw(){
  const mk=(id,k,cur,set)=>{$(id).innerHTML=uniq(k).map(v=>`<button class="chip ${v===cur?"on":""}" data-v="${esc(v)}">${esc(v)}</button>`).join("");
    $(id).querySelectorAll("button").forEach(b=>b.onclick=()=>{set(b.dataset.v);draw()})};
  mk("cat","الفئة",cat,v=>cat=v);mk("area","المنطقة",area,v=>area=v);
  const q=$("q").value.trim();
  const r=JOBS.map((j,i)=>({j,i})).filter(({j})=>(cat==="الكل"||j["الفئة"]===cat)&&(area==="الكل"||j["المنطقة"]===area)&&(!q||(j["المصنع"]+(j["المؤهل"]||"")).includes(q)));
  $("empty").style.display=r.length?"none":"block";
  $("list").innerHTML=r.map(({j,i})=>`<button class="card" data-i="${i}">
   <div class="row"><span class="ac" style="font-size:.8rem;font-weight:700">📍 ${esc(j["المنطقة"])}</span><span class="badge ${catOf(j["الفئة"]||"")}">${esc(j["الفئة"])}</span></div>
   <div style="font-size:1.1rem;font-weight:700;margin:.3rem 0">${esc(j["المصنع"])}</div>
   <div class="row"><span class="mu" style="font-size:.85rem">${esc(j["المؤهل"])}</span><b>${esc(j["المرتب"])}</b></div>
   <div class="mu" style="font-size:.85rem">⏰ ${esc(j["الشفت"])}</div>
   ${["السكن","المواصلات"].filter(k=>j[k]).map(k=>`<span class="tag">${k}: ${esc(j[k])}</span>`).join("")}</button>`).join("");
  $("list").querySelectorAll("button").forEach(b=>b.onclick=()=>open(JOBS[+b.dataset.i]));
}
function open(j){
  const ph=PHONE.replace(/\D/g,""), msg=encodeURIComponent(`السلام عليكم، عايز أقدم على وظيفة: ${j["المصنع"]} - ${j["المنطقة"]}`);
  const lab={"المؤهل":"الفئة والمؤهل","الشفت":"الشفت وساعات العمل","المرتب":"المرتب"};
  const keys=["المؤهل","الشفت","المرتب",...Object.keys(j).filter(k=>!CORE.includes(k))];
  $("modal").innerHTML=`<div class="sheet"><div class="row" style="align-items:flex-start"><div><div class="ac" style="font-size:.85rem;font-weight:700">📍 ${esc(j["المنطقة"])} • ${esc(j["الفئة"])}</div><h2 style="margin:.2rem 0">${esc(j["المصنع"])}</h2></div><button class="x" id="x">✕</button></div>
  ${keys.filter(k=>j[k]).map(k=>`<div class="f"><small>${esc(lab[k]||k)}</small><b>${esc(j[k])}</b></div>`).join("")}
  <a class="btn" style="background:#16a34a;color:#fff;border:0;margin-top:1rem" target="_blank" rel="noopener" href="https://wa.me/${ph}?text=${msg}">قدم الآن عبر الواتساب</a>
  <a class="btn" href="tel:+${ph}">اتصل بنا</a></div>`;
  $("modal").classList.add("show");$("x").onclick=()=>$("modal").classList.remove("show");
}
$("modal").onclick=e=>{if(e.target===$("modal"))$("modal").classList.remove("show")};
$("q").oninput=draw;load();
</script>
</body>
</html>
