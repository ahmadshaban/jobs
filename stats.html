<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0A1428">
<meta name="robots" content="noindex,nofollow">
<title>إحصائيات الموقع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== [1] الألوان والستايل ===== */
:root{--bg:#0A1428;--card:#12203d;--bd:#1f3157;--tx:#eaf1ff;--mut:#8fa3c8;--ac:#4f9cff;--ac2:#ffd76a;--ok:#5fd0ff;--bad:#ff8a8a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,system-ui,sans-serif}
body{padding:calc(.8rem + env(safe-area-inset-top)) .8rem calc(2rem + env(safe-area-inset-bottom));max-width:48rem;margin:auto}
h1{font-size:1.15rem;margin:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.7rem}
.top a,.btn{background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:.8rem;padding:.45rem .8rem;font:inherit;font-size:.85rem;text-decoration:none;cursor:pointer}
.chips{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.2rem;margin-bottom:.7rem}
.chip{flex:0 0 auto;background:var(--card);border:1px solid var(--bd);color:var(--mut);border-radius:2rem;padding:.4rem .9rem;font:inherit;font-size:.85rem;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:#06142e;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.55rem}
@media(min-width:560px){.grid{grid-template-columns:repeat(4,1fr)}}
.k{background:var(--card);border:1px solid var(--bd);border-radius:1rem;padding:.7rem .8rem}
.k small{display:block;color:var(--mut);font-size:.74rem}
.k b{font-size:1.5rem;font-weight:800;line-height:1.3}
.k i{font-style:normal;font-size:.7rem;color:var(--mut);display:block}
.k.hi b{color:var(--ac2)}
.box{background:var(--card);border:1px solid var(--bd);border-radius:1rem;padding:.8rem;margin-top:.7rem}
.box h2{font-size:.95rem;margin:0 0 .55rem;display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.seg{display:flex;gap:.3rem}
.seg button{background:transparent;border:1px solid var(--bd);color:var(--mut);border-radius:.6rem;padding:.2rem .55rem;font:inherit;font-size:.72rem;cursor:pointer}
.seg button.on{background:var(--ac);color:#06142e;border-color:var(--ac);font-weight:700}
.row{display:grid;grid-template-columns:1.6rem 1fr auto;gap:.5rem;align-items:center;padding:.45rem 0;border-top:1px solid var(--bd)}
.row:first-of-type{border-top:0}
.rk{color:var(--mut);font-size:.8rem;text-align:center}
.nm{font-size:.88rem;font-weight:600;overflow-wrap:anywhere}
.nm small{display:block;color:var(--mut);font-weight:400;font-size:.72rem}
.bar{height:.35rem;background:var(--bd);border-radius:1rem;margin-top:.3rem;overflow:hidden}
.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ok))}
.nums{display:flex;gap:.5rem;font-size:.78rem;color:var(--mut);text-align:center}
.nums div b{display:block;color:var(--tx);font-size:.95rem}
.nums .s b{color:var(--ac2)}
.chart{width:100%;height:9rem;display:block}
.leg{display:flex;gap:.9rem;font-size:.72rem;color:var(--mut);margin-top:.3rem;flex-wrap:wrap}
.leg span:before{content:"";display:inline-block;width:.6rem;height:.6rem;border-radius:.15rem;margin-left:.3rem;background:var(--c)}
.empty{color:var(--mut);text-align:center;padding:1rem;font-size:.85rem}
#gate{max-width:22rem;margin:20vh auto 0;text-align:center}
#gate input{width:100%;background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:.8rem;padding:.7rem;font:inherit;font-size:1rem;margin:.8rem 0;text-align:center}
#gate .btn{width:100%;background:var(--ac);color:#06142e;font-weight:800;padding:.7rem}
.err{color:var(--bad);font-size:.85rem;min-height:1.2rem}
.sk{opacity:.5}
</style>
</head>
<body>

<!-- ===== [2] شاشة الباسورد ===== -->
<div id="gate" hidden>
  <h1>📊 إحصائيات الموقع</h1>
  <input id="pw" type="password" placeholder="الباسورد" autocomplete="current-password">
  <div class="err" id="gerr"></div>
  <button class="btn" id="gbtn" type="button">دخول</button>
</div>

<!-- ===== [3] اللوحة ===== -->
<div id="app" hidden>
  <div class="top">
    <h1>📊 إحصائيات الموقع</h1>
    <div style="display:flex;gap:.4rem"><button class="btn" id="rf" type="button">🔄</button><a href="admin.html">← الأدمن</a></div>
  </div>
  <div class="chips" id="chips"></div>
  <div class="grid" id="kpi"></div>

  <div class="box"><h2>الحركة اليومية</h2><svg class="chart" id="ch" viewBox="0 0 320 120" preserveAspectRatio="none"></svg>
    <div class="leg"><span style="--c:#4f9cff">زيارات</span><span style="--c:#ffd76a">ضغطات قدّم</span><span style="--c:#5fd0ff">تقديمات اتبعتت</span></div></div>

  <div class="box"><h2>🏭 أكتر المصانع تقديمًا
    <span class="seg" id="fsort"><button data-k="send" class="on">اتبعت</button><button data-k="apply">ضغطات</button><button data-k="view">مشاهدات</button></span></h2>
    <div id="fac"></div></div>

  <div class="box"><h2>📍 المناطق</h2><div id="area"></div></div>
  <div class="box"><h2>🔗 المصادر (اللينكات)</h2><div id="src"></div></div>
  <div class="box"><h2>🕒 أوقات الزيارات</h2><svg class="chart" id="hr" viewBox="0 0 320 120" preserveAspectRatio="none"></svg><div class="leg" id="hrl"></div></div>
  <div class="empty" id="at"></div>
</div>

<script>
// ===== [4] الإعدادات =====
const STATS_URL = 'https://script.google.com/macros/s/AKfycbwr_pFD5PMl-cSyBS6vFf-Pa_Mr8pc_zxHUxPfHHjAWtkwME0iIEBPwvvm0cOjn_f4f/exec'; // <<< غيّر هنا: رابط سكريبت الإحصائيات
const PW_KEY = 'statsPw';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = n => new Intl.NumberFormat('ar-EG').format(n || 0);
let DAYS = +(localStorage.getItem('statsDays') || 7), DATA = null, FK = 'send';
const PERIODS = [[1,'النهاردة'],[7,'7 أيام'],[30,'30 يوم'],[90,'90 يوم']];

// ===== [5] الاتصال =====
async function fetchStats(pw){
  if (STATS_URL.indexOf('PASTE_') === 0) return {ok:false, error:'رابط السكريبت لسه متحطش'};
  try{
    const r = await fetch(STATS_URL + '?a=stats&days=' + DAYS + '&p=' + encodeURIComponent(pw) + '&_=' + Date.now(), {cache:'no-store'});
    return await r.json();
  }catch(e){ return {ok:false, error:'مفيش اتصال، جرّب تاني'}; }
}
async function load(){
  $('app').classList.add('sk');
  const pw = localStorage.getItem(PW_KEY) || '';
  if (!pw){ $('app').classList.remove('sk'); showGate(''); return; }
  const d = await fetchStats(pw);
  $('app').classList.remove('sk');
  if (!d.ok){
    if (/الباسورد/.test(d.error || '')) localStorage.removeItem(PW_KEY);
    showGate(d.error); return;
  }
  DATA = d; $('gate').hidden = true; $('app').hidden = false; render();
}
function showGate(msg){ $('app').hidden = true; $('gate').hidden = false; $('gerr').textContent = msg || ''; }

// ===== [6] الرسم =====
function render(){
  const d = DATA, t = d.tot;
  $('chips').innerHTML = PERIODS.map(p => `<button type="button" class="chip${p[0]===DAYS?' on':''}" data-d="${p[0]}">${p[1]}</button>`).join('');
  const conv = t.visit ? Math.round(t.send / t.visit * 1000) / 10 : 0;
  const kp = [
    ['👀 زيارات', t.visit, 'جلسة دخول', ''],
    ['👤 زوار مختلفين', d.uniq, 'موبايلات', ''],
    ['🏭 فتح مصنع', t.view, 'مرة', ''],
    ['👆 ضغطات قدّم', t.apply, 'فتح فورم التقديم', 'hi'],
    ['✅ تقديمات اتبعتت', t.send, 'واتساب', 'hi'],
    ['📞 اتصالات', t.call, 'ضغطة اتصال', ''],
    ['📤 مشاركات', t.share, 'مرة', ''],
    ['🎯 نسبة التقديم', conv + '%', 'تقديم ÷ زيارات', '']
  ];
  $('kpi').innerHTML = kp.map(k => `<div class="k ${k[3]}"><small>${k[0]}</small><b>${typeof k[1]==='number'?nf(k[1]):k[1]}</b><i>${k[2]}</i></div>`).join('');
  drawChart(); drawFac(); drawList('area', d.areas, a => a.a, ['view','apply','send']);
  drawList('src', d.srcs, s => s.s, ['visit','apply','send'], {visit:'زيارات',apply:'ضغطات',send:'اتبعت'});
  drawHours(); $('at').textContent = 'آخر تحديث: ' + d.at;
}
function drawChart(){
  const L = DATA.list, W = 320, H = 120, pad = 6, n = L.length;
  const max = Math.max(1, ...L.map(x => Math.max(x.visit, x.apply, x.send)));
  const X = i => n === 1 ? W / 2 : pad + i * (W - 2 * pad) / (n - 1);
  const Y = v => H - pad - v / max * (H - 2 * pad);
  const line = (k, c) => n === 1
    ? `<circle cx="${X(0)}" cy="${Y(L[0][k])}" r="3" fill="${c}"/>`
    : `<polyline fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke" points="${L.map((x,i)=>X(i)+','+Y(x[k])).join(' ')}"/>`;
  $('ch').innerHTML = `<line x1="0" y1="${H-pad}" x2="${W}" y2="${H-pad}" stroke="#1f3157"/>` + line('visit','#4f9cff') + line('apply','#ffd76a') + line('send','#5fd0ff');
}
function nums(o, keys, labels){
  const lb = labels || {view:'مشاهدة',apply:'ضغطة',send:'اتبعت',call:'اتصال'};
  return `<div class="nums">${keys.map(k => `<div class="${k==='send'?'s':''}"><b>${nf(o[k])}</b>${lb[k]}</div>`).join('')}</div>`;
}
function drawFac(){
  const arr = DATA.factories.slice().sort((a,b) => (b[FK]-a[FK]) || (b.send-a.send) || (b.apply-a.apply) || (b.view-a.view)).filter(x => x[FK] > 0 || FK === 'view').slice(0, 15);
  const max = Math.max(1, ...arr.map(x => x[FK]));
  $('fac').innerHTML = arr.length ? arr.map((x,i) => `<div class="row"><div class="rk">${i+1}</div><div class="nm">${esc(x.f)}${x.r?`<small>📍 ${esc(x.r)}</small>`:''}<div class="bar"><span style="width:${Math.round(x[FK]/max*100)}%"></span></div></div>${nums(x,['view','apply','send'])}</div>`).join('') : '<div class="empty">لسه مفيش بيانات في الفترة دي</div>';
}
function drawList(id, arr, name, keys, labels){
  const k0 = keys[keys.length - 1];
  const max = Math.max(1, ...arr.map(x => x[keys[0]]));
  $(id).innerHTML = arr.length ? arr.map((x,i) => `<div class="row"><div class="rk">${i+1}</div><div class="nm">${esc(name(x))}<div class="bar"><span style="width:${Math.round(x[keys[0]]/max*100)}%"></span></div></div>${nums(x,keys,labels)}</div>`).join('') : '<div class="empty">لسه مفيش بيانات في الفترة دي</div>';
}
function drawHours(){
  const h = DATA.hours, max = Math.max(1, ...h), w = 320 / 24;
  $('hr').innerHTML = h.map((v,i) => { const bh = v / max * 108; return `<rect x="${i*w+1.5}" y="${118-bh}" width="${w-3}" height="${Math.max(bh,v?2:0)}" rx="2" fill="#4f9cff"/>`; }).join('');
  const top = h.indexOf(max);
  $('hrl').innerHTML = max > 1 || h.some(v => v) ? `<span style="--c:#4f9cff">أنشط ساعة: ${top}:00 (${nf(max)} زيارة) · بتوقيت القاهرة</span>` : '';
}

// ===== [7] الأحداث =====
$('chips').onclick = e => { const b = e.target.closest('.chip'); if (!b) return; DAYS = +b.dataset.d; localStorage.setItem('statsDays', DAYS); load(); };
$('fsort').onclick = e => { const b = e.target.closest('button'); if (!b) return; FK = b.dataset.k; [...$('fsort').children].forEach(x => x.classList.toggle('on', x === b)); drawFac(); };
$('rf').onclick = load;
$('gbtn').onclick = () => { const v = $('pw').value; if (!v) return; localStorage.setItem(PW_KEY, v); load(); };
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('gbtn').click(); });
load();
</script>
</body>
</html>
