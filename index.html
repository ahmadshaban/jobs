<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123b66">
<title>وظائف المصانع | فرص العمل المتاحة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --page:#f3f6fa;--surface:#fff;--text:#182638;--muted:#5e6d7e;
  --line:#dce5ee;--blue:#174f86;--blue-dark:#123b66;--blue-pale:#eaf3fc;
  --green:#147a48;--green-pale:#e9f7ef;--danger:#a52d2d;--danger-pale:#fff0f0;
  --shadow:0 3px 14px rgba(22,48,77,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:1rem}
body{margin:0;background:var(--page);color:var(--text);font-family:Cairo,Tahoma,Arial,sans-serif;line-height:1.65}
button,input,select{font:inherit}
button,select{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #8fc5f5;outline-offset:2px}
.page{max-width:760px;margin:0 auto;padding:0 15px 36px}
.hero-head{margin:0 -15px 16px;padding:23px 20px 20px;background:linear-gradient(135deg,var(--blue-dark),#1b5a91);color:#fff;border-radius:0 0 24px 24px}
.brand{display:inline-flex;align-items:center;gap:8px;font-size:.82rem;font-weight:700;color:#e1efff;background:#ffffff15;border:1px solid #ffffff30;border-radius:999px;padding:5px 11px;margin-bottom:8px}
h1{font-size:1.55rem;line-height:1.35;margin:0;font-weight:800}
.subtitle{margin:6px 0 0;color:#e5f0fb;font-size:.96rem}
.intro{margin-top:15px;background:#ffffff13;border-radius:13px;padding:10px 12px;font-size:.9rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:14px;box-shadow:var(--shadow)}
.field-label{display:block;font-size:.94rem;font-weight:800;margin-bottom:7px}
.search-wrap{position:relative}
.search-icon{position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:1.1rem;pointer-events:none}
.search-input{width:100%;min-height:54px;border:1px solid #c8d6e4;border-radius:13px;background:#fff;color:var(--text);padding:11px 42px 11px 43px;font-size:1rem}
.search-input::placeholder{color:#7b8998}
.clear-search{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;border-radius:9px;background:#edf2f7;color:#3e5267;font-size:1.1rem;display:none}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:14px}
select{width:100%;min-height:49px;padding:9px 11px;background:#fff;border:1px solid #c8d6e4;border-radius:12px;color:var(--text)}
.actions-row{display:flex;gap:9px;margin-top:12px}
.btn{min-height:47px;border:1px solid var(--line);border-radius:12px;padding:9px 15px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-light{background:#fff;color:var(--blue-dark)}
.btn:active{transform:scale(.99)}
.actions-row .btn{flex:1}
.results-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 2px 10px}
.results-title{font-size:1.08rem;font-weight:800;margin:0}
.count{font-size:.86rem;color:var(--muted);font-weight:700;white-space:nowrap}
.job-card{width:100%;display:block;text-align:right;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:17px;padding:15px;margin-bottom:11px;box-shadow:var(--shadow)}
.job-card:active{background:#f8fbff}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.location{color:var(--muted);font-size:.9rem;font-weight:700}
.pill{display:inline-flex;align-items:center;border-radius:999px;background:var(--blue-pale);color:var(--blue-dark);font-size:.82rem;font-weight:800;padding:4px 10px}
.pill.girls{background:#fff0f6;color:#9b2458}
.pill.mixed{background:#eaf7f8;color:#11616a}
.job-name{font-size:1.13rem;line-height:1.5;font-weight:800;margin:10px 0 2px}
.qualification{color:var(--muted);font-size:.9rem}
.salary-label{font-size:.82rem;color:var(--muted);margin-top:11px}
.salary{color:var(--blue);font-size:1.2rem;font-weight:800;line-height:1.5}
.card-facts{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.fact{display:inline-flex;align-items:center;gap:5px;background:#f2f6fa;color:#344a60;border-radius:9px;padding:5px 9px;font-size:.83rem}
.card-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid #edf1f5;margin-top:13px;padding-top:10px;color:var(--blue);font-weight:800;font-size:.92rem}
.arrow{font-size:1.15rem}
.state-box{background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:24px 17px;text-align:center;margin-top:12px}
.state-icon{font-size:2rem;margin-bottom:6px}
.state-title{font-size:1.08rem;font-weight:800;margin:0 0 4px}
.state-message{color:var(--muted);margin:0 0 14px;font-size:.94rem}
.state-box.error{background:var(--danger-pale);border-color:#f0cccc}
.state-box.error .state-title{color:var(--danger)}
.hidden{display:none!important}
.detail-page{padding-bottom:35px}
.detail-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 13px}
.back-btn{min-height:45px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 13px;font-weight:800;color:var(--blue-dark)}
.detail-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:var(--shadow)}
.detail-name{font-size:1.35rem;line-height:1.5;font-weight:800;margin:12px 0 2px}
.detail-salary{background:var(--blue-pale);border:1px solid #d7e8fa;border-radius:14px;padding:13px 14px;margin:15px 0}
.detail-salary span{display:block;color:var(--muted);font-size:.88rem}
.detail-salary strong{display:block;color:var(--blue-dark);font-size:1.35rem;line-height:1.55}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.detail-item{border:1px solid var(--line);border-radius:12px;padding:10px 11px;min-width:0;overflow-wrap:anywhere}
.detail-item.full{grid-column:1/-1}
.detail-item span{display:block;color:var(--muted);font-size:.81rem;margin-bottom:3px}
.detail-item strong{font-size:.94rem;line-height:1.55}
.detail-actions{display:grid;grid-template-columns:1.5fr 1fr;gap:9px;margin-top:15px}
.detail-actions .btn{min-height:53px}
.footer-note{text-align:center;color:var(--muted);font-size:.82rem;padding:22px 0 0}
.loading{padding:20px;text-align:center;color:var(--muted)}
@media(min-width:600px){.hero-head{margin-top:18px;border-radius:22px}.page{padding-left:20px;padding-right:20px}.hero-head{margin-left:0;margin-right:0}.filters{grid-template-columns:1fr 1fr}}
@media(max-width:380px){.page{padding-left:11px;padding-right:11px}.hero-head{margin-left:-11px;margin-right:-11px}.filters{grid-template-columns:1fr}.detail-grid{grid-template-columns:1fr}.detail-item.full{grid-column:auto}.detail-actions{grid-template-columns:1fr}.job-name{font-size:1.06rem}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="page" id="listingPage">
  <header class="hero-head">
    <div class="brand">● فرص عمل المصانع</div>
    <h1>وظائف المصانع</h1>
    <p class="subtitle">دَوّر على الوظيفة المناسبة ليك بسهولة</p>
    <div class="intro">اختار الوظيفة اللي تناسبك، وافتح تفاصيلها لمعرفة المرتب وشروط التقديم.</div>
  </header>

  <section class="panel" aria-label="البحث عن الوظائف">
    <label class="field-label" for="searchInput">ابحث عن وظيفة</label>
    <div class="search-wrap">
      <span class="search-icon" aria-hidden="true">🔎</span>
      <input class="search-input" id="searchInput" type="search" autocomplete="off" placeholder="اكتب اسم المصنع أو المدينة أو المرتب">
      <button class="clear-search" id="clearSearch" type="button" aria-label="مسح البحث">×</button>
    </div>
    <div class="filters">
      <div>
        <label class="field-label" for="categoryFilter">مناسب لمين؟</label>
        <select id="categoryFilter">
          <option value="الكل">كل الوظائف</option>
          <option value="شباب">وظائف الشباب</option>
          <option value="بنات">وظائف البنات</option>
        </select>
      </div>
      <div>
        <label class="field-label" for="areaFilter">المدينة</label>
        <select id="areaFilter"><option value="الكل">كل المدن</option></select>
      </div>
    </div>
    <div class="actions-row">
      <button class="btn btn-light" id="resetFilters" type="button">↺ عرض كل الوظائف</button>
      <button class="btn btn-primary" id="showResults" type="button">عرض الوظائف ↓</button>
    </div>
  </section>

  <section aria-live="polite" aria-busy="true" id="resultsSection">
    <div class="results-head">
      <h2 class="results-title">الوظائف المتاحة</h2>
      <span class="count" id="resultCount">جاري تحميل الوظائف…</span>
    </div>
    <div id="jobList"></div>
    <div id="stateBox" class="state-box hidden"></div>
  </section>
  <footer class="footer-note">راجع تفاصيل الوظيفة قبل التقديم، وتأكد من ملاءمتها لك.</footer>
</main>

<main class="page detail-page hidden" id="detailPage">
  <div class="detail-top">
    <button class="back-btn" id="backButton" type="button">→ الرجوع للوظائف</button>
    <span class="pill">تفاصيل الوظيفة</span>
  </div>
  <section class="detail-card" id="detailContent"></section>
</main>

<script>
"use strict";

/* إعدادات الموقع الحالية: رقم التواصل ورابط Google Sheets كما هما */
const PHONE = "201095237207";
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1Ri61Py0q36t2EdMCWXa0lgJGDWJfrXjY0gHmqnwS4AM/gviz/tq?tqx=out:csv&headers=1&sheet=%D8%A7%D9%84%D9%88%D8%B8%D8%A7%D8%A6%D9%81";

const CORE_FIELDS = ["المنطقة","الفئة","المصنع","المؤهل","الشفت","المرتب","ظاهر؟"];
const FIELD_ICONS = {
  "نظام القبض":"💰","السكن":"🏠","السلف":"💵","المواصلات":"🚌",
  "وجبة":"🍽️","التأمينات":"🛡️","الأجازة":"📅","الإجازة":"📅",
  "طبيعة العمل":"🧰","السن":"🎂","العنوان":"📍"
};
const $ = id => document.getElementById(id);
let jobs = [];
let filteredJobs = [];
let loadFailed = false;
let savedScrollY = 0;

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[ch]);
}

/* توحيد الكتابة العربية لتسهيل البحث، دون تغيير البيانات الأصلية المعروضة */
function normalizeText(value) {
  return String(value ?? "")
    .toLocaleLowerCase("ar")
    .normalize("NFD")
    .replace(/[\u064B-\u065F\u0670\u0640]/g, "")
    .replace(/[أإآٱ]/g, "ا")
    .replace(/ى/g, "ي")
    .replace(/ؤ/g, "و")
    .replace(/ئ/g, "ي")
    .replace(/ة/g, "ه")
    .replace(/\s+/g, " ")
    .trim();
}

function parseCSV(text) {
  const rows = [];
  let row = [], field = "", quoted = false;
  text = text.replace(/^\uFEFF/, "");
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (quoted) {
      if (ch === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else quoted = false;
      } else field += ch;
    } else if (ch === '"') {
      quoted = true;
    } else if (ch === ",") {
      row.push(field); field = "";
    } else if (ch === "\n") {
      row.push(field); rows.push(row); row = []; field = "";
    } else if (ch !== "\r") {
      field += ch;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  if (!rows.length) return [];
  const headers = rows[0].map((h, i) => (i === 0 ? h.replace(/^\uFEFF/, "") : h).trim());
  return rows.slice(1)
    .filter(r => r.some(v => String(v ?? "").trim() !== ""))
    .map(r => {
      const obj = {};
      headers.forEach((h, i) => { if (h) obj[h] = String(r[i] ?? "").trim(); });
      return obj;
    });
}

function isVisible(job) {
  const value = normalizeText(job["ظاهر؟"] || "نعم");
  return !["لا","لأ","no","false","0","مخفي"].includes(value) && Boolean(String(job["المصنع"] || "").trim());
}

async function loadJobs() {
  setLoading(true);
  try {
    const response = await fetch(SHEET_CSV_URL, {cache:"no-store"});
    if (!response.ok) throw new Error("تعذر الاتصال بجدول الوظائف.");
    const csv = await response.text();
    if (!csv.trim() || !csv.includes("المصنع")) throw new Error("بيانات جدول الوظائف غير واضحة.");
    const data = parseCSV(csv);
    if (!data.length) {
      jobs = [];
    } else {
      jobs = data.filter(isVisible);
    }
    loadFailed = false;
    populateAreas();
    renderJobs();
  } catch (error) {
    /* لا توجد بيانات تجريبية احتياطية: عند فشل الاتصال نوضح المشكلة للمستخدم */
    jobs = [];
    filteredJobs = [];
    loadFailed = true;
    $("resultCount").textContent = "تعذر تحميل الوظائف";
    $("jobList").innerHTML = "";
    showState("error", "مش قادرين نحمّل الوظائف دلوقتي", "اتأكد من اتصال الإنترنت وحاول مرة تانية. الوظائف بتظهر من جدول Google Sheets فقط.", true);
  } finally {
    setLoading(false);
    route();
  }
}

function setLoading(isLoading) {
  $("resultsSection").setAttribute("aria-busy", String(isLoading));
  if (isLoading) {
    $("resultCount").textContent = "جاري تحميل الوظائف…";
    $("jobList").innerHTML = '<div class="loading">⏳ لحظة واحدة، بنحمّل الوظائف المتاحة…</div>';
    $("stateBox").classList.add("hidden");
  }
}

function populateAreas() {
  const select = $("areaFilter");
  const previous = select.value;
  const areas = [...new Set(jobs.map(j => String(j["المنطقة"] || "").trim()).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b, "ar"));
  select.innerHTML = '<option value="الكل">كل المدن</option>' +
    areas.map(area => `<option value="${escapeHTML(area)}">${escapeHTML(area)}</option>`).join("");
  if (areas.includes(previous)) select.value = previous;
}

function matchesCategory(job, category) {
  if (category === "الكل") return true;
  return normalizeText(job["الفئة"]).includes(normalizeText(category));
}

function searchableText(job) {
  return Object.entries(job)
    .filter(([key]) => normalizeText(key) !== normalizeText("ظاهر؟"))
    .map(([, value]) => String(value ?? ""))
    .join(" ");
}

function getFilteredJobs() {
  const query = normalizeText($("searchInput").value);
  const category = $("categoryFilter").value;
  const area = $("areaFilter").value;
  return jobs.filter(job =>
    matchesCategory(job, category) &&
    (area === "الكل" || job["المنطقة"] === area) &&
    (!query || normalizeText(searchableText(job)).includes(query))
  );
}

function categoryClass(category) {
  const c = normalizeText(category);
  if (c.includes("بنات") && !c.includes("شباب")) return "girls";
  if (c.includes("شباب") && c.includes("بنات")) return "mixed";
  return "";
}

function showState(type, title, message, retry = false) {
  const box = $("stateBox");
  box.className = "state-box" + (type === "error" ? " error" : "");
  const icon = type === "error" ? "⚠️" : "🔎";
  box.innerHTML = `<div class="state-icon">${icon}</div>
    <h3 class="state-title">${escapeHTML(title)}</h3>
    <p class="state-message">${escapeHTML(message)}</p>
    ${retry ? '<button class="btn btn-primary" id="retryLoad" type="button">إعادة المحاولة</button>' : ""}`;
  box.classList.remove("hidden");
  if (retry) $("retryLoad").addEventListener("click", loadJobs);
}

function renderJobs() {
  if (loadFailed) return;
  filteredJobs = getFilteredJobs();
  $("clearSearch").style.display = $("searchInput").value ? "block" : "none";
  $("resultCount").textContent = `عدد الوظائف: ${filteredJobs.length}`;
  $("jobList").innerHTML = "";
  $("stateBox").classList.add("hidden");

  if (!filteredJobs.length) {
    const hasFilters = $("searchInput").value.trim() ||
      $("categoryFilter").value !== "الكل" || $("areaFilter").value !== "الكل";
    showState("empty",
      jobs.length ? (hasFilters ? "مفيش وظائف مطابقة لاختياراتك" : "مفيش وظائف معروضة حاليًا") : "مفيش وظائف متاحة حاليًا",
      jobs.length ? "جرّب تغيّر كلمة البحث أو اختار كل المدن والفئات." : "لما تتضاف وظائف معتمدة في جدول الوظائف هتظهر هنا.");
    return;
  }

  $("jobList").innerHTML = filteredJobs.map(job => {
    const index = jobs.indexOf(job);
    const category = String(job["الفئة"] || "").trim();
    const location = String(job["المنطقة"] || "").trim();
    const name = String(job["المصنع"] || "").trim();
    const pay = String(job["المرتب"] || "").trim();
    const shift = String(job["الشفت"] || "").trim();
    const qualification = String(job["المؤهل"] || "").trim();
    const extras = ["السكن","المواصلات"].filter(key => String(job[key] || "").trim());
    return `<button class="job-card" type="button" data-index="${index}" aria-label="عرض تفاصيل ${escapeHTML(name)}">
      <div class="card-top">
        <span class="location">📍 ${escapeHTML(location || "المكان حسب التفاصيل")}</span>
        ${category ? `<span class="pill ${categoryClass(category)}">${escapeHTML(category)}</span>` : ""}
      </div>
      <h3 class="job-name">${escapeHTML(name)}</h3>
      ${qualification ? `<div class="qualification">${escapeHTML(qualification)}</div>` : ""}
      ${pay ? `<div class="salary-label">المرتب</div><div class="salary">${escapeHTML(pay)}</div>` : ""}
      <div class="card-facts">
        ${shift ? `<span class="fact">⏰ ${escapeHTML(shift)}</span>` : ""}
        ${extras.map(key => `<span class="fact">${FIELD_ICONS[key]} ${escapeHTML(job[key])}</span>`).join("")}
      </div>
      <div class="card-footer"><span>اضغط هنا لمعرفة التفاصيل والتقديم</span><span class="arrow" aria-hidden="true">←</span></div>
    </button>`;
  }).join("");

  $("jobList").querySelectorAll(".job-card").forEach(button => {
    button.addEventListener("click", () => openJob(Number(button.dataset.index)));
  });
}

function openJob(index) {
  if (!jobs[index]) return;
  savedScrollY = window.scrollY;
  location.hash = `job-${index}`;
}

function renderDetail(job) {
  const category = String(job["الفئة"] || "").trim();
  const extras = Object.entries(job).filter(([key, value]) =>
    !CORE_FIELDS.includes(key) && String(value ?? "").trim() !== ""
  );
  const detailItem = (key, value) => {
    const icon = FIELD_ICONS[key] ? FIELD_ICONS[key] + " " : "";
    const full = String(value).length > 50 ? " full" : "";
    return `<div class="detail-item${full}"><span>${icon}${escapeHTML(key)}</span><strong>${escapeHTML(value)}</strong></div>`;
  };
  const phone = PHONE.replace(/\D/g, "");
  const message = encodeURIComponent(`السلام عليكم، عايز أقدم على وظيفة: ${job["المصنع"] || ""} - ${job["المنطقة"] || ""}`);
  $("detailContent").innerHTML = `
    <div class="card-top">
      <span class="location">📍 ${escapeHTML(job["المنطقة"] || "المكان حسب التفاصيل")}</span>
      ${category ? `<span class="pill ${categoryClass(category)}">${escapeHTML(category)}</span>` : ""}
    </div>
    <h1 class="detail-name">${escapeHTML(job["المصنع"] || "تفاصيل الوظيفة")}</h1>
    ${job["المؤهل"] ? `<div class="qualification">${escapeHTML(job["المؤهل"])}</div>` : ""}
    ${job["المرتب"] ? `<div class="detail-salary"><span>المرتب المعلن</span><strong>${escapeHTML(job["المرتب"])}</strong></div>` : ""}
    <div class="detail-grid">
      ${job["الشفت"] ? detailItem("مواعيد العمل", job["الشفت"]) : ""}
      ${extras.map(([key, value]) => detailItem(key, value)).join("")}
    </div>
    <div class="detail-actions">
      <a class="btn btn-primary" href="https://wa.me/${phone}?text=${message}" target="_blank" rel="noopener noreferrer">💬 التقديم عبر واتساب</a>
      <a class="btn btn-light" href="tel:+${phone}">📞 اتصال</a>
    </div>`;
}

function route() {
  const match = location.hash.match(/^#job-(\d+)$/);
  const index = match ? Number(match[1]) : -1;
  if (index >= 0 && jobs[index]) {
    $("listingPage").classList.add("hidden");
    $("detailPage").classList.remove("hidden");
    renderDetail(jobs[index]);
    window.scrollTo(0, 0);
  } else {
    $("detailPage").classList.add("hidden");
    $("listingPage").classList.remove("hidden");
    if (!loadFailed) renderJobs();
    window.scrollTo(0, savedScrollY);
  }
}

$("searchInput").addEventListener("input", renderJobs);
$("categoryFilter").addEventListener("change", () => {
  populateAreas();
  renderJobs();
});
$("areaFilter").addEventListener("change", renderJobs);
$("clearSearch").addEventListener("click", () => {
  $("searchInput").value = "";
  renderJobs();
  $("searchInput").focus();
});
$("resetFilters").addEventListener("click", () => {
  $("searchInput").value = "";
  $("categoryFilter").value = "الكل";
  $("areaFilter").value = "الكل";
  populateAreas();
  renderJobs();
  window.scrollTo({top: 0, behavior: "smooth"});
});
$("showResults").addEventListener("click", () => {
  $("resultsSection").scrollIntoView({behavior:"smooth", block:"start"});
});
$("backButton").addEventListener("click", () => {
  if (location.hash.startsWith("#job-")) history.back();
  else location.hash = "";
});
window.addEventListener("hashchange", route);
window.addEventListener("pageshow", () => {
  if (!location.hash && !loadFailed) renderJobs();
});

loadJobs();
</script>
</body>
</html>
