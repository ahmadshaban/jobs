<!DOCTYPE html>
<!--
  فهرس الأجزاء:
  [1] الألوان والتصميم (CSS)
  [2] هيكل الصفحة (HTML)
  [3] الإعدادات والنصوص وأسماء الأعمدة (JS)
  [4] قراءة الشيت
  [5] الفلاتر والبحث
  [6] عرض الكروت
  [7] صفحة التفاصيل
  [8] التشغيل
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>وظائف مصانع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ===== [1] الألوان والتصميم (غيّر من هنا) ===== */
:root{
  --c-main:#1d4ed8;        /* <<< غيّر هنا: اللون الأزرق الأساسي */
  --c-main-dark:#1e40af;   /* <<< غيّر هنا: الأزرق الغامق */
  --c-main-soft:#dbeafe;   /* <<< غيّر هنا: الأزرق الفاتح */
  --c-bg:#f1f5f9;          /* <<< غيّر هنا: خلفية الصفحة */
  --c-card:#ffffff;        /* <<< غيّر هنا: خلفية الكارت */
  --c-text:#0f172a;        /* <<< غيّر هنا: لون الكلام */
  --c-sub:#64748b;         /* <<< غيّر هنا: لون الكلام الخفيف */
  --c-border:#e2e8f0;      /* <<< غيّر هنا: لون الحدود */
  --c-wa:#16a34a;          /* <<< غيّر هنا: لون زرار واتساب */
  --c-done:#b91c1c;        /* <<< غيّر هنا: لون شارة العدد اكتمل */
}
@media (prefers-color-scheme:dark){
  :root{
    --c-main:#3b82f6; --c-main-dark:#2563eb; --c-main-soft:#1e3a8a;
    --c-bg:#0b1220; --c-card:#131c2e; --c-text:#e5edf9; --c-sub:#94a3b8;
    --c-border:#25324a; --c-wa:#22c55e; --c-done:#ef4444;
  }
}
*{box-sizing:border-box}
body{margin:0;font-family:'Cairo',sans-serif;background:var(--c-bg);color:var(--c-text);font-size:15px}
button,input{font-family:inherit;font-size:inherit}
.hidden{display:none!important}
header{background:var(--c-main);color:#fff;padding:16px 14px 14px;display:grid;gap:10px}
header h1{margin:0;font-size:20px}
#q{width:100%;padding:10px 12px;border:0;border-radius:10px;background:var(--c-card);color:var(--c-text)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 12px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--c-border);background:var(--c-card);color:var(--c-text);border-radius:20px;padding:6px 14px;cursor:pointer;font-weight:600}
.chip.on{background:var(--c-main);color:#fff;border-color:var(--c-main)}
#grid{padding:12px;display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));max-width:1000px;margin:0 auto}
.card{background:var(--c-card);border:1px solid var(--c-border);border-radius:14px;padding:14px;display:grid;gap:8px;cursor:pointer}
.card.dim{opacity:.55}
.card h2{margin:0;font-size:17px}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.meta span{background:var(--c-main-soft);color:var(--c-main);border-radius:8px;padding:2px 9px;font-size:13px}
.badge{display:inline-block;background:var(--c-done);color:#fff;border-radius:8px;padding:2px 10px;font-size:13px;font-weight:700}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{display:block;text-align:center;text-decoration:none;border:0;border-radius:10px;padding:10px;font-weight:700;color:#fff;cursor:pointer}
.btn.wa{background:var(--c-wa)}
.btn.call{background:var(--c-main)}
.btn.off{background:var(--c-border);color:var(--c-sub);cursor:not-allowed;pointer-events:none}
.empty{text-align:center;color:var(--c-sub);padding:30px;grid-column:1/-1}
.note{text-align:center;color:var(--c-sub);font-size:13px;padding:6px}
#detail{position:fixed;inset:0;background:var(--c-bg);z-index:10;overflow:auto}
.dhead{position:sticky;top:0;background:var(--c-main);color:#fff;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.dhead h2{margin:0;font-size:18px}
.close{border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer}
.dbody{max-width:640px;margin:0 auto;padding:14px;display:grid;gap:10px}
.rowd{background:var(--c-card);border:1px solid var(--c-border);border-radius:12px;padding:10px 12px}
.rowd b{display:block;color:var(--c-sub);font-size:13px;font-weight:600}
.rowd div{white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>

<!-- ===== [2] هيكل الصفحة ===== -->
<header>
  <h1 id="siteTitle"></h1>
  <input id="q" type="search">
</header>
<div class="chips" id="genderChips"></div>
<div class="chips" id="areaChips"></div>
<div class="note hidden" id="note"></div>
<div id="grid"></div>

<div id="detail" class="hidden">
  <div class="dhead"><h2 id="dTitle"></h2><button class="close" id="dClose"></button></div>
  <div class="dbody" id="dBody"></div>
</div>

<script>
// ===== [3] الإعدادات والنصوص وأسماء الأعمدة (غيّر من هنا) =====
const PHONE = '201095237207'; // <<< غيّر هنا: رقم الواتساب والاتصال
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1Ri61Py0q36t2EdMCWXa0lgJGDWJfrXjY0gHmqnwS4AM/gviz/tq?tqx=out:csv&headers=1&sheet=الوظائف'; // <<< غيّر هنا: رابط الشيت

const COL = {
  factory: 'المصنع',   // <<< غيّر هنا: اسم عمود المصنع
  area:    'المنطقة',  // <<< غيّر هنا: اسم عمود المنطقة
  gender:  'الفئة',    // <<< غيّر هنا: اسم عمود الفئة
  shift:   'الشفت',    // <<< غيّر هنا: اسم عمود الشفت
  salary:  'المرتب',   // <<< غيّر هنا: اسم عمود المرتب
  qual:    'المؤهل',   // <<< غيّر هنا: اسم عمود المؤهل
  visible: 'ظاهر؟',    // <<< غيّر هنا: اسم عمود الظهور
  status:  'الحالة'    // <<< غيّر هنا: اسم عمود الحالة
};

const HIDE_IN_DETAILS = [COL.status, COL.visible]; // <<< غيّر هنا: أعمدة متظهرش في التفاصيل

const T = {
  siteTitle: 'وظائف مصانع',            // <<< غيّر هنا: عنوان الموقع
  search: 'ابحث عن مصنع أو منطقة...',  // <<< غيّر هنا: نص البحث
  all: 'الكل',                         // <<< غيّر هنا: كلمة الكل
  genders: ['بنات', 'شباب'],           // <<< غيّر هنا: قيم الفئة في الفلتر
  doneBadge: 'العدد اكتمل',            // <<< غيّر هنا: شارة اكتمال العدد
  doneValue: 'مكتمل',                  // <<< غيّر هنا: قيمة عمود الحالة اللي معناها اكتمل
  hideValue: 'لا',                     // <<< غيّر هنا: قيمة ظاهر؟ اللي بتخفي الوظيفة
  wa: 'واتساب',                        // <<< غيّر هنا: زرار واتساب
  call: 'اتصال',                       // <<< غيّر هنا: زرار الاتصال
  exit: '✕ خروج',                      // <<< غيّر هنا: زرار الخروج من التفاصيل
  details: 'تفاصيل الوظيفة',           // <<< غيّر هنا: عنوان صفحة التفاصيل لو مفيش مصنع
  waMsg: 'السلام عليكم، عايز أقدم على وظيفة في',  // <<< غيّر هنا: رسالة الواتساب
  empty: 'مفيش وظايف مطابقة',          // <<< غيّر هنا: رسالة لما مفيش نتايج
  demoNote: 'بيانات تجريبية — تعذّر تحميل الشيت' // <<< غيّر هنا: تنبيه البيانات التجريبية
};

// بيانات تجريبية بتظهر لو قراءة الشيت فشلت
const DEMO = [  // <<< غيّر هنا: البيانات التجريبية
  {'المنطقة':'العاشر من رمضان','الفئة':'بنات','المصنع':'مصنع الأمل للملابس','المؤهل':'متوسط','الشفت':'صباحي','المرتب':'5000','ظاهر؟':'نعم','الحالة':''},
  {'المنطقة':'السادس من أكتوبر','الفئة':'شباب','المصنع':'مصنع النور للأغذية','المؤهل':'دبلوم','الشفت':'مسائي','المرتب':'6000','ظاهر؟':'نعم','الحالة':''},
  {'المنطقة':'العبور','الفئة':'بنات','المصنع':'مصنع الشروق للبلاستيك','المؤهل':'إعدادي','الشفت':'صباحي','المرتب':'4800','ظاهر؟':'نعم','الحالة':'مكتمل'}
];

let headers = [], jobs = [], demo = false;
let fGender = '', fArea = '', fQuery = '';
const $ = id => document.getElementById(id);

// بتهرب أي نص قبل ما يتحط في HTML
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"'`]/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'}[c]));
}

// ===== [4] قراءة الشيت =====

// بتحول نص CSV لمصفوفة صفوف
function parseCSV(t){
  const out = []; let row = [], f = '', q = false;
  for (let i = 0; i < t.length; i++){
    const c = t[i];
    if (q){
      if (c === '"'){ if (t[i+1] === '"'){ f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ','){ row.push(f); f = ''; }
    else if (c === '\n' || c === '\r'){
      if (c === '\r' && t[i+1] === '\n') i++;
      row.push(f); out.push(row); row = []; f = '';
    } else f += c;
  }
  if (f !== '' || row.length){ row.push(f); out.push(row); }
  return out;
}

// بتحول الصفوف لوظايف حسب عناوين الصف الأول وتشيل المخفية
function buildJobs(table){
  headers = table[0].map(h => h.trim());
  return table.slice(1)
    .filter(r => r.some(x => x.trim() !== ''))
    .map(r => { const o = {}; headers.forEach((h, i) => { o[h] = (r[i] || '').trim(); }); return o; })
    .filter(o => (o[COL.visible] || '').trim() !== T.hideValue);
}

// بتقرا الشيت ولو فشلت بتعرض البيانات التجريبية
async function loadData(){
  try{
    const r = await fetch(SHEET_URL, {cache:'no-store'});
    if (!r.ok) throw new Error('bad');
    const table = parseCSV(await r.text());
    if (table.length < 1 || table[0].length < 2) throw new Error('empty');
    jobs = buildJobs(table);
  }catch(e){
    demo = true;
    headers = Object.keys(DEMO[0]);
    jobs = DEMO.filter(o => (o[COL.visible] || '').trim() !== T.hideValue);
  }
  $('note').textContent = T.demoNote;
  $('note').classList.toggle('hidden', !demo);
  buildChips(); render();
}

// ===== [5] الفلاتر والبحث =====

// بترسم شرايح الفئة والمناطق
function buildChips(){
  const g = [T.all].concat(T.genders);
  $('genderChips').innerHTML = g.map((x, i) =>
    '<button class="chip' + ((i === 0 ? '' : x) === fGender ? ' on' : '') + '" data-g="' + (i === 0 ? '' : esc(x)) + '">' + esc(x) + '</button>').join('');
  const areas = [];
  jobs.forEach(j => { const a = j[COL.area]; if (a && areas.indexOf(a) < 0) areas.push(a); });
  $('areaChips').innerHTML = [T.all].concat(areas).map((x, i) =>
    '<button class="chip' + ((i === 0 ? '' : x) === fArea ? ' on' : '') + '" data-a="' + (i === 0 ? '' : esc(x)) + '">' + esc(x) + '</button>').join('');
}

// ===== [6] عرض الكروت =====

// بترجع هل الوظيفة مكتملة
function isDone(j){ return (j[COL.status] || '').trim() === T.doneValue; }

// بتجهز زراري التقديم (بيتقفلوا لو العدد اكتمل)
function applyBtns(j){
  if (isDone(j)) return '<div class="btns"><span class="btn off">' + esc(T.wa) + '</span><span class="btn off">' + esc(T.call) + '</span></div>';
  const msg = encodeURIComponent(T.waMsg + ' ' + (j[COL.factory] || ''));
  return '<div class="btns"><a class="btn wa" href="https://wa.me/' + PHONE + '?text=' + msg + '" target="_blank" rel="noopener">' + esc(T.wa) +
    '</a><a class="btn call" href="tel:+' + PHONE + '">' + esc(T.call) + '</a></div>';
}

// بترسم الكروت حسب الفلاتر والبحث
function render(){
  const q = fQuery.toLowerCase();
  const list = jobs.map((j, i) => ({j, i})).filter(x =>
    (!fGender || x.j[COL.gender] === fGender) &&
    (!fArea || x.j[COL.area] === fArea) &&
    (!q || Object.keys(x.j).some(k => k !== COL.status && k !== COL.visible && String(x.j[k]).toLowerCase().indexOf(q) >= 0)));
  $('grid').innerHTML = list.length ? list.map(x => {
    const j = x.j;
    const meta = [COL.area, COL.gender, COL.shift, COL.salary, COL.qual].map(c => j[c]).filter(Boolean)
      .map(v => '<span>' + esc(v) + '</span>').join('');
    return '<div class="card' + (isDone(j) ? ' dim' : '') + '" data-i="' + x.i + '">' +
      '<h2>' + esc(j[COL.factory]) + '</h2>' +
      (isDone(j) ? '<div><span class="badge">' + esc(T.doneBadge) + '</span></div>' : '') +
      '<div class="meta">' + meta + '</div>' + applyBtns(j) + '</div>';
  }).join('') : '<div class="empty">' + esc(T.empty) + '</div>';
}

// ===== [7] صفحة التفاصيل =====

// بتفتح صفحة التفاصيل وتضيف خطوة في السجل عشان زرار الرجوع
function openDetail(i){
  const j = jobs[i]; if (!j) return;
  $('dTitle').textContent = j[COL.factory] || T.details;
  $('dBody').innerHTML =
    (isDone(j) ? '<div><span class="badge">' + esc(T.doneBadge) + '</span></div>' : '') +
    headers.filter(h => h && HIDE_IN_DETAILS.indexOf(h) < 0 && j[h])
      .map(h => '<div class="rowd"><b>' + esc(h) + '</b><div>' + esc(j[h]) + '</div></div>').join('') +
    applyBtns(j);
  $('detail').classList.remove('hidden');
  $('detail').scrollTop = 0;
  history.pushState({d:1}, '');
}

// بتقفل صفحة التفاصيل
function hideDetail(){ $('detail').classList.add('hidden'); }

// بتقفل التفاصيل من زرار الخروج وترجع خطوة في السجل
function closeDetail(){
  if (history.state && history.state.d) history.back(); else hideDetail();
}

// ===== [8] التشغيل =====

// بتربط النصوص والأحداث وتبدأ التحميل
function init(){
  document.title = T.siteTitle;
  $('siteTitle').textContent = T.siteTitle;
  $('q').placeholder = T.search;
  $('dClose').textContent = T.exit;
  $('q').addEventListener('input', e => { fQuery = e.target.value.trim(); render(); });
  $('genderChips').addEventListener('click', e => {
    const b = e.target.closest('[data-g]'); if (!b) return;
    fGender = b.dataset.g; buildChips(); render();
  });
  $('areaChips').addEventListener('click', e => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    fArea = b.dataset.a; buildChips(); render();
  });
  $('grid').addEventListener('click', e => {
    if (e.target.closest('a')) return;
    const c = e.target.closest('.card'); if (c) openDetail(Number(c.dataset.i));
  });
  $('dClose').onclick = closeDetail;
  window.addEventListener('popstate', hideDetail);
  loadData();
}
init();
</script>
</body>
</html>
