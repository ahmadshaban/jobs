<script>

function pays(j){const a=[];if(j[P30])a.push(["30 يوم عمل",j[P30]]);if(j[P26])a.push([OFF26,j[P26]]);return a}
const numOf=s=>{const t=String(s||"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/,/g,"");const m=t.match(/\d+(\.\d+)?/);return m?+m[0]:0};

/* تحليل أرقام التواصل المنظمة، مع الاستخراج التلقائي من خانة العنوان لو خانة أرقام التواصل فاضية */
function parseContacts(j){
  let list = [];
  // 1. فحص خانة أرقام التواصل المستقلة إن وجدت
  if(j["أرقام التواصل"]) {
    String(j["أرقام التواصل"]).split(/\n/).forEach(l => {
      const p = l.split("|").map(x=>x.trim());
      if(p[0]) list.push({ name: p[1]?p[0]:"", phone: p[1]||p[0] });

  }
  // 2. الاستخراج التلقائي الذكي من خانة العنوان القديم لو أرقام التواصل فاضية
  if(list.length === 0 && j["العنوان"]) {
    const addr = j["العنوان"];
    // البحث عن أرقام هواتف مصرية تبدأ بـ 01 ويتكون من 10 أو 11 رقم
    const phoneRegex = /(?:01[0125]\d{8}|(?:\+2)?01[0125]\d{8})/g;
    let match;
    while ((match = phoneRegex.exec(addr)) !== null) {
      const phoneNum = match[0];
      // محاولة استخراج اسم مسبق للرقم (مثل اسم الشخص قبل الرقم بكلمات قليلة)
      const subStr = addr.substring(Math.max(0, match.index - 25), match.index);
      const cleanName = subStr.replace(/[:\-,\s]+$/, "").split(/[\s,\-]+/).pop() || "";
      list.push({ name: isNaN(cleanName)?cleanName:"", phone: phoneNum });
    }
  }
  return list;
}

const rank=j=>done(j)?2:(manual(j)!==null?0:1);
function payScore(j){
  const c=[j[P30],j[P26],j["المرتب"],...(j.__sh||[]).flatMap(s=>[s.p30,s.p26])];
  let m=0;c.forEach(x=>{let n=numOf(x);if(n&&/اليوم|يومي|يومية/.test(String(x)))n*=26;if(n>m)m=n});return m}
const byOrder=(x,y)=>rank(x)-rank(y)||(rank(x)===0?manual(x)-manual(y):(rank(x)===1?payScore(y)-payScore(x):0));

 const days=(Date.now()-new Date(y,m-1,d))/864e5;return days>=-1&&days<=NEW_DAYS}

function parseRows(t){const r=[];let row=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];
 if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
 else if(c=='"')q=true;else if(c==","){row.push(f);f=""}
 else if(c=="\n"){row.push(f);r.push(row);row=[];f=""}else if(c!="\r")f+=c}
 if(f||row.length){row.push(f);r.push(row)}
 return r}
function parseCSV(t){const r=parseRows(t);if(!r.length)throw 0;const h=r[0].map(x=>x.trim());return r.slice(1).filter(x=>x.some(v=>v.trim())).map(x=>Object.fromEntries(h.map((k,i)=>[k,(x[i]||"").trim()])))}

let AREA_ORDER=[];
const norm=t=>String(t||"").replace(/[\u064B-\u0652\u0640]/g,"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d))
  .replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").trim().split(/\s+/)
  .filter(w=>w&&w!=="مدينه").map(w=>w.replace(/^ال/,"")).join("");
const sameArea=(a,b)=>{a=norm(a);b=norm(b);if(!a||!b)return false;return a===b||(a.length>=3&&b.length>=3&&(a.includes(b)||b.includes(a)))};
const areaRank=a=>{const i=AREA_ORDER.findIndex(x=>sameArea(x,a));return i<0?9999:i};

function buildJobText(j) {
  let msg = `📍 وظيفة: ${j["المصنع"]} - ${j["المنطقة"]}\n`;
  if(!isMulti(j) && j["الشفت"]) msg += `⏰ الشفت: ${hoursOnly(j["الشفت"])}\n`;
  msg += `💰 المرتب: ${payText(j)}\n`;

  const skipKeys = [...CORE, "المصنع", "المنطقة", "الفئة", "الشفت", "مرتب 30 يوم", "مرتب 26 يوم", "الورديات", "العنوان", "أرقام التواصل", "__sh", "__contacts"];
  
  Object.keys(j).forEach(k => {
    if(skipKeys.includes(k) || !j[k]) return;
    const icon = ICONS[k] || "•";
    if(k === "تفاصيل المرتب") {
      msg += `📝 ملاحظات: ${j[k]}\n`;
    } else {
      msg += `${icon} ${k}: ${j[k]}\n`;
    }
  });

  if(cleanAddr(j["العنوان"])) {
    msg += `📍 العنوان: ${cleanAddr(j["العنوان"])}\n`;
  }
  
  if(j.__contacts && j.__contacts.length) {
    msg += `📞 أرقام التواصل عند الوصول:\n`;
    j.__contacts.forEach(c => {
      msg += `  • ${c.name?c.name+": ":""}${c.phone}\n`;
    });
  }

  msg += `⏰ التقديم واستلام الشغل في نفس اليوم\n`;

  return msg.trim();
}

    if(SRC)L.push("المصدر: "+SRC);
    const u="https://wa.me/"+ph+"?text="+encodeURIComponent(L.join("\n"));
    close();window.open(u,"_blank")||(location.href=u);
    };
    confirmSend(j,send,isMulti(j)?j.__sh[selSh]:null);
  };
}

function confirmSend(j,go,sh){
  const old=document.getElementById("cf");if(old)old.remove();
  const rows=[];
  const add=(ic,lb,v,h)=>{if(h||(v!==undefined&&v!==null&&String(v).trim()))rows.push([ic,lb,String(v||"").trim(),h])};
  const cell=x=>x?esc(String(x).replace(/\s*في الشهر/,"")):"—";
  add("🏭","المصنع",j["المصنع"]);
  if(isMulti(j)&&sh){
    add("⏰","الوردية وعدد الساعات",hoursOnly(sh.h));
    add("💰","المرتب","",`<div style="margin-top:.2rem;line-height:1.9;font-weight:800">${sh.p30?`<div><span class="tag">30 يوم</span> ${cell(sh.p30)}</div>`:""}${sh.p26?`<div><span class="tag">26 يوم + 4 إجازة</span> ${cell(sh.p26)}</div>`:""}</div>`);
  }else if(isMulti(j)){
    add("⏰","الورديات والمرتب","",`<table class="sht" style="margin-top:.3rem"><tr><th>⏰ الوردية</th><th><span class="tag">30 يوم</span></th><th><span class="tag">26 يوم + 4 إجازة</span></th></tr>${j.__sh.map(s=>`<tr><td>${esc(s.h)}</td><td>${cell(s.p30)}</td><td>${cell(s.p26)}</td></tr>`).join("")}</table>`);
  }else{
    if(j["الشفت"])add("⏰","الوردية وعدد الساعات",hoursOnly(j["الشفت"]));
    add("💰","المرتب",payText(j).split(" | ").join("\n"));
  }
  add("🏠","السكن",j["السكن"]);
  add("🚌","المواصلات",j["المواصلات"]);
  add("📝","ملاحظات",j["ملاحظات"]);
  const el=document.createElement("div");el.className="ov show";el.id="cf";el.style.zIndex="30";el.style.alignItems="center";
  el.innerHTML=`<div class="sheet" style="border-radius:1.2rem;width:calc(100% - 2rem);max-height:90%"><div class="sb" style="padding:1rem 1.1rem .4rem;overflow-y:auto"><h2 class="ttl" style="margin:0 0 .5rem;font-size:1.05rem">تأكيد قبل الإرسال</h2>${rows.map(r=>`<div style="display:flex;gap:.5rem;padding:.45rem 0;border-top:1px solid var(--bd);line-height:1.5"><span>${r[0]}</span><div style="min-width:0;flex:1"><small style="display:block;opacity:.7;font-size:.76rem">${esc(r[1])}</small>${r[3]?r[3]:`<b style="font-size:.9rem;white-space:pre-line;overflow-wrap:anywhere">${esc(r[2])}</b>`}</div></div>`).join("")}</div><div style="display:flex;gap:.6rem;padding:.6rem 1.1rem calc(.9rem + env(safe-area-inset-bottom,0px))"><button type="button" class="btn wa" id="cfok" style="min-height:2.7rem;font-size:.95rem">تمام، ابعت</button><button type="button" class="btn" id="cfno" style="min-height:2.7rem;font-size:.95rem">رجوع</button></div></div>`;
  document.body.appendChild(el);
  const x=()=>el.remove();
  window.addEventListener("popstate",x,{once:true});
  el.onclick=e=>{if(e.target===el)x()};
  document.getElementById("cfno").onclick=x;
  document.getElementById("cfok").onclick=()=>{x();go()};
}

function loadH2C(){return new Promise((ok,no)=>{if(window.html2canvas)return ok();const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function saveJobAsImage(j, captureElem) {
  try {
    await loadH2C();
    const actionsBar = captureElem.querySelector('.cta');
    if(actionsBar) actionsBar.style.display = 'none';

    const canvas = await html2canvas(captureElem, {
      scale: 2,
      useCORS: true,
      allowTaint: true,
      backgroundColor: "#0E1A33"
    });
    
    if(actionsBar) actionsBar.style.display = 'flex';

    canvas.toBlob((blob) => {
      if (!blob) return;
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${j["المصنع"]} - ${j["المنطقة"]}.png`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      alert("🖼️ تم حفظ صورة تفاصيل المصنع في جهازك بنجاح!");
    }, 'image/png');
  } catch (e) {
    const actionsBar = captureElem.querySelector('.cta');
    if(actionsBar) actionsBar.style.display = 'flex';
    alert("حدث خطأ أثناء حفظ الصورة، يمكنك استخدام زر '📋 نسخ' بدلاً من ذلك.");
  }
}

function showDetail(j){
  const ph=PHONE.replace(/\D/g,"");
  
  let addressHTML = `<b>${esc(cleanAddr(j["العنوان"])||"غير محدد")}</b>`;
  if(j.__contacts && j.__contacts.length) {
    addressHTML += `<div class="contacts-box">
      <span class="contacts-title">📞 أرقام التواصل عند الوصول:</span>
      ${j.__contacts.map(c=>`
        <div class="contact-item">
          <div class="contact-info">
            ${c.name?`<span class="contact-name">👤 ${esc(c.name)}:</span>`:""}
            <span class="contact-num">📱 ${esc(c.phone)}</span>
          </div>
          <a href="tel:${esc(c.phone)}" class="call-btn">📞 اتصال</a>
        </div>
      `).join("")}
    </div>`;
  }
  
  const it=k=> {
    if(k==="العنوان") {
      return `<div class="it full"><small>${IS_CC?"📍 العنوان وأرقام التواصل":"📍 العنوان"}</small>${addressHTML}</div>`;
    }
    const trHi=k==="المواصلات"&&!/لا يوجد|مفيش|^لا$|غير متوفر/.test(String(j[k]).trim());
    return `<div class="it ${(k==="طبيعة العمل"||trHi||String(j[k]).length>26)?"full":""}${trHi?" trn":""}"><small>${ICONS[k]||"•"} ${esc(k)}</small><b>${esc(j[k])}</b></div>`;
  };

  const sec=(t,ks,pre)=>{const r=ks.filter(k=>j[k] || (k==="العنوان" && (j["العنوان"] || (j.__contacts && j.__contacts.length))));return (r.length||pre)?`<div class="sec"><h3>${t}</h3><div class="g2">${pre||""}${r.map(it).join("")}</div></div>`:""};
  const pp=pays(j);
  const noteHTML=j["تفاصيل المرتب"]?`<div class="pnote"><span class="nl">تفاصيل المرتب</span><span class="nt">${esc(j["تفاصيل المرتب"])}</span></div>`:"";
  const cell=x=>x?esc(String(x).replace(/\s*في الشهر/,"")):"—";
  const tbl=isMulti(j)?`<div class="it pay2 full"><table class="sht"><tr><th>⏰ الوردية</th><th><span class="tag">30 يوم</span></th><th><span class="tag">26 يوم + 4 إجازة</span></th></tr>${j.__sh.map(s=>`<tr><td>${esc(s.h)}</td><td>${cell(s.p30)}</td><td>${cell(s.p26)}</td></tr>`).join("")}</table></div>`:"";
  const hrsPill=(!isMulti(j)&&j["الشفت"])?`<div class="hp"><span class="tag">وردية ${esc(hoursOnly(j["الشفت"]))}</span></div>`:"";
  const payTile0=`<div class="it pay2 full">${hrsPill}${pp.length?pp.map(x=>`<div class="pt"><small class="tag">${esc(x[0])}</small><b>${esc(x[1])}</b></div>`).join(""):`<small>💰 المرتب</small><b>${esc(j["المرتب"]||"")}</b>`}</div>`;
  const payTile=(isMulti(j)?tbl:payTile0)+noteHTML;
  
  const plainSh=/^\s*\d{1,2}\s*(ساعة|ساعات)\s*$/.test(j["الشفت"]||"");
  
  const fixedUsed = ["المنطقة","الفئة","المصنع","العنوان","أرقام التواصل","الشفت","السن","طبيعة العمل","المؤهل","الأجازة","نظام القبض","السلف","التأمينات","وجبة","السكن","المواصلات","المرتب","مرتب 30 يوم","مرتب 26 يوم","تفاصيل المرتب","الورديات","تثبيت","الترتيب","آخر تعديل","ظاهر؟","الحالة","تاريخ الإضافة","ملاحظات"];
  const otherKeys = Object.keys(j).filter(k=>!k.startsWith("__")&&!fixedUsed.includes(k)&&j[k]);
  
  const groups=[
    ["الأساسيات", ["السن", ...(plainSh?[]:["الشفت"]), "طبيعة العمل", "المؤهل", "الأجازة"], payTile],
    ["المرتب والمميزات", ["نظام القبض", "السلف", "التأمينات", "وجبة"]],
    ["السكن والمواصلات والأقسام الإضافية", ["السكن", "المواصلات", ...otherKeys, "العنوان"]]
  ];
  
  $("detail").innerHTML=`<div class="w dp${IS_CC?"":" wk"}" id="captureArea">
   <div class="tb"><button class="exit" id="ex"><span class="xr">✕</span>رجوع</button></div>
   <div class="top"><span class="loc">📍 ${esc(j["المنطقة"])}</span><span class="bd2">${tags(j)}<span class="badge ${kind(j["الفئة"]||"")}">${esc(j["الفئة"])}</span></span></div>
   <h2 class="ttl">${esc(j["المصنع"])}</h2>
   ${groups.map(g=>sec(g[0],g[1],g[2])).join("")}${j["ملاحظات"]?`<div class="sec"><h3>📝 ملاحظات</h3><div class="it full"><b>${esc(j["ملاحظات"])}</b></div></div>`:""}
   <div class="tnote">⏰ التقديم واستلام الشغل في نفس اليوم</div>
   <div class="cta${IS_CC?"":" wcta"}">
     ${IS_CC?`<button type="button" class="btn wa" id="apply">قدّم دلوقتي على الواتساب</button>`:`<div class="wnote">للتقديم على الوظيفة، ارجع للمسؤول اللي بعتلك اللينك ده وهو يكمّلك إجراءات التقديم.</div>`}
     <button type="button" class="btn sh2" id="shareImgBtn">🖼️ نسخ كصورة</button>
     <button type="button" class="btn sh2" id="copyTxtBtn">📋 نسخ</button>
   </div></div>${IS_CC?formHTML(j):""}`;
   
  $("main").style.display="none";$("detail").style.display="block";window.scrollTo(0,0);
  $("ex").onclick=exitDetail;
  $("shareImgBtn").onclick=()=>saveJobAsImage(j, $("captureArea"));
  $("copyTxtBtn").onclick=()=>openSingleCopyModal(j);
  if(IS_CC)setupApply(j,ph);
}

window.addEventListener("hashchange",route);
load();
</script>
