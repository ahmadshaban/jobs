<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#0E1A33;--card:#172645;--tx:#E8EEF9;--mu:#8FA2C8;--bd:#2A3C66;--ac:#F2C14E;--acs:#22355D;--sh:0 6px 16px rgba(0,0,0,.35);--gold:#F2C14E;--goldD:#2A1D00;--wa:#1FAF5A;--px:1rem;

  --btn-font-size: .8rem;
}
@media(max-width:380px){:root{--px:.7rem}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.5}
.w{max-width:40rem;margin:auto;padding:0 1rem 3rem;padding-inline:var(--px)}

header .lead,header .sub{color:var(--mu);margin:.1rem 0 0;font-size:.95rem}
.trust{display:flex;flex-wrap:wrap;gap:.35rem .5rem;margin-top:.55rem}
.trust span,.trust a{font-size:.78rem;font-weight:700;border-radius:99px;padding:.2rem .7rem;text-decoration:none}
.trust span{background:rgba(255,255,255,.08);color:#DCE4F5;border:1px solid rgba(255,255,255,.18)}
.trust a.wap{background:var(--wa);color:#FFFFFF;border:0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:7;background:var(--bg);padding:.25rem 0 .35rem}
.frow{display:flex;align-items:center;gap:.5rem}
.frow .seg{flex:none;margin-top:0;padding:.16rem;display:flex;background:var(--card);border:1px solid var(--bd);border-radius:1rem}
.frow .seg button{flex:none;padding:.3rem .85rem;font-size:.85rem;font:inherit;font-weight:700;border:0;background:none;color:var(--mu);border-radius:.7rem;cursor:pointer}
.frow .seg button.on{background:var(--gold);color:var(--goldD)}
.ddw{flex:1;min-width:0}
.ddb{width:100%;display:flex;align-items:center;justify-content:space-between;gap:.4rem;font:inherit;font-size:.85rem;font-weight:700;border:1px solid var(--bd);background:#172645;color:var(--tx);border-radius:99px;padding:.42rem .85rem;cursor:pointer}
.ddb.on{background:var(--gold);border-color:var(--gold);color:var(--goldD)}
.meta{display:flex;justify-content:space-between;align-items:center;color:#B8C6E3;font-size:.88rem;margin:.6rem 0 .5rem}
.meta button{font:inherit;color:var(--gold);background:none;border:0;font-weight:700;cursor:pointer}
.card{display:block;width:100%;text-align:start;font:inherit;color:var(--tx);background:#172645;border:1px solid var(--bd);border-radius:.9rem;padding:.5rem .7rem;margin-bottom:.5rem;box-shadow:0 6px 16px rgba(0,0,0,.35);cursor:pointer;transition:transform .12s}

.badge.ur{background:var(--gold);color:#3A2A00}.badge.nw{background:#1E5A3A;color:#B8F2D2}.badge.dn{background:#B3202F;color:#FFFFFF}
.card .ttl{font-size:var(--card-title-size);font-weight:800;color:#FFFFFF;margin:.08rem 0 .25rem;line-height:1.35}

.pnote .nl{flex:none;background:#FFF8DC;color:#9A3412;border-radius:99px;padding:.02rem .45rem;font-size:.64rem;font-weight:800}
.pnote .nt{font-size:.76rem;color:#fff;font-weight:700;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .more2{display:block;width:100%;margin:.2rem 0 .15rem;background:#0F766E;color:#fff;font-size:.74rem;font-weight:800;text-align:center;border-radius:.6rem;padding:.2rem .45rem}

.tag{display:inline-block;background:#FFF6D6;color:#5C4300;border:1.5px solid #8A6A12;border-radius:99px;padding:.12rem .65rem;font-size:.76rem;font-weight:800}
.sk{height:7.2rem;border-radius:1.2rem;background:linear-gradient(90deg,var(--card),var(--bd),var(--card));background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:.75rem}
@keyframes sk{to{background-position:-200% 0}}

.it.full{grid-column:1/-1}.it small{color:var(--mu);font-size:.68rem}.it b{font-size:.85rem;font-weight:700;color:#FFFFFF;white-space:pre-line}
.it.pay2{background:var(--gold);border:0;color:var(--goldD);align-items:center;text-align:center;padding:.55rem}
.it.pay2 small{color:#6B4E00}.it.pay2 b{font-size:1.35rem;font-weight:800;color:var(--goldD)}
.sht{width:100%;border-collapse:collapse;text-align:center;background:var(--gold);color:var(--goldD);border-radius:.6rem;overflow:hidden}
.sht th{font-size:.7rem;font-weight:800;padding:.3rem .2rem;border-bottom:1px solid rgba(42,29,0,.35)}
.sht td{font-size:.95rem;font-weight:800;padding:.38rem .2rem}.sht tr+tr td{border-top:1px dashed rgba(42,29,0,.3)}
.cta{position:fixed;inset-inline:0;bottom:0;max-width:40rem;margin:auto;background:#0A1428;border-top:1px solid var(--bd);padding:var(--btn-padding);display:flex;gap:.35rem}
.btn{display:flex;align-items:center;justify-content:center;flex:1;min-height:1.95rem;text-decoration:none;font:inherit;font-weight:800;font-size:var(--btn-font-size);border-radius:var(--btn-radius);padding:var(--btn-padding);color:var(--gold);border:1px solid var(--gold);background:transparent}
.btn.wa{flex:2;background:var(--wa);color:#FFFFFF;border:0;box-shadow:0 3px 10px rgba(31,175,90,.30);cursor:pointer}
.tb{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:.7rem 0 .5rem}
.exit{font:inherit;font-weight:800;font-size:.85rem;color:var(--tx);background:var(--card);border:1px solid #E5120F;border-radius:.75rem;padding:.32rem .8rem;cursor:pointer}
.exit .xr{display:inline-flex;align-items:center;justify-content:center;width:1.4rem;height:1.4rem;border-radius:50%;background:#E5120F;color:#fff;font-weight:900;font-size:.82rem;margin-inline-end:.45rem;vertical-align:middle}
.dp{padding-bottom:4.1rem;scroll-padding-top:4.5rem}.dp .ttl{font-size:1.3rem;margin:.4rem 0 0}
.fl{display:block;font-weight:700;font-size:.85rem;margin-top:.75rem}
.fl input{display:block;width:100%;font:inherit;font-size:16px;margin-top:.3rem;background:#172645;color:var(--tx);border:1px solid var(--bd);border-radius:.8rem;padding:.7rem .85rem;outline:none}
.yn{display:flex;gap:.5rem;margin-top:.3rem}
.yn button{flex:1;font:inherit;font-weight:700;border:1px solid var(--bd);background:#172645;color:var(--tx);border-radius:.8rem;padding:.65rem 0;cursor:pointer}
.yn button.on{background:var(--gold);border-color:var(--gold);color:var(--goldD)}
.er{color:#FF8A8A;font-size:.82rem;font-weight:700;margin-top:.25rem}.er:empty{display:none}
.fgo{padding:.6rem 1.1rem calc(.7rem + env(safe-area-inset-bottom,0px));border-top:1px solid var(--bd);background:var(--bg)}
.fgo .btn{width:100%;min-height:2.9rem;font-size:1rem;border:0}
</style>

<body>
<div class="w" id="main">
  <div id="demo" class="demo" style="display:none">⚠️ تجربة: دي بيانات وهمية، الشيت مش متاح من هنا</div>
  <header>
    <p class="sub lead" id="ui_sub">قدّم من الموبايل في دقايق واختار الفرصة المناسبة ليك</p>

    <div class="trust" id="ui_trust_box">
      <span id="ui_trust_text">✅ التقديم من غير أي رسوم مقدما</span>

<script>
/* ===== إعدادات الشيت والاتصال ===== */
const AREAS_CSV_URL="https://docs.google.com/spreadsheets/d/1Ri61Py0q36t2EdMCWXa0lgJGDWJfrXjY0gHmqnwS4AM/gviz/tq?tqx=out:csv&headers=1&sheet=%D8%A7%D9%84%D9%85%D9%86%D8%A7%D8%B7%D9%82";
const SETTINGS_CSV_URL="https://docs.google.com/spreadsheets/d/1Ri61Py0q36t2EdMCWXa0lgJGDWJfrXjY0gHmqnwS4AM/gviz/tq?tqx=out:csv&headers=1&sheet=%D8%A7%D9%84%D8%A5%D8%B9%D8%AF%D8%A7%D8%AF%D8%A7%D8%AA";
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1Ri61Py0q36t2EdMCWXa0lgJGDWJfrXjY0gHmqnwS4AM/gviz/tq?tqx=out:csv&headers=1&sheet=%D8%A7%D9%84%D9%88%D8%B8%D8%A7%D8%A6%D9%81";

let PHONE = "201095237207";
let UI_SETTINGS = {
  header_title: "عمال تعبئة وتغليف وفرز",
  header_sub: "قدّم من الموبايل في دقايق واختار الفرصة المناسبة ليك",
  wa_btn_text: "💬 اسأل على واتساب",
  trust_text: "✅ التقديم من غير أي رسوم مقدما",
  show_trust: true,
  show_area_filter: true,
  show_bar: true,
  show_new_badge: true,
  show_urgent_badge: true,
  show_tags: true,
  show_notes: true,
  title_font_size: "1.4rem",
  card_title_size: "1.1rem",
  card_pay_size: "1.25rem",
  btn_padding: ".32rem .65rem",
  btn_radius: ".62rem"
};

const CORE=["المنطقة","الفئة","المصنع","المؤهل","الشفت","السن","طبيعة العمل","المرتب","مرتب 30 يوم","مرتب 26 يوم","تفاصيل المرتب","الورديات","تثبيت","الترتيب","آخر تعديل","ظاهر؟","الحالة","تاريخ الإضافة"];
const done=j=>(j["الحالة"]||"").includes("مكتمل");
const urgent=j=>/عاجل|الأكثر تقديم/.test(j["الحالة"]||"");
const NEW_DAYS=3;
const REAL_HOSTS=["ahmadshaban.github.io"];
const IS_DEMO_HOST=!REAL_HOSTS.includes(location.hostname);
const TODAY=new Date().toISOString().slice(0,10);
const P30="مرتب 30 يوم", P26="مرتب 26 يوم", OFF26="26 يوم عمل + 4 أيام إجازة";

function pays(j){const a=[];if(j[P30])a.push(["30 يوم عمل",j[P30]]);if(j[P26])a.push([OFF26,j[P26]]);return a}
const numOf=s=>{const t=String(s||"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/,/g,"");const m=t.match(/\d+(\.\d+)?/);return m?+m[0]:0};
function parseShifts(txt){return String(txt||"").split(/\n/).map(l=>l.trim()).filter(Boolean).map(l=>{const p=l.split("|").map(x=>x.trim());const s={h:p[0]||"",p30:"",p26:""};p.slice(1).forEach(x=>{const m=x.match(/^(30|26)\s*يوم\s*:\s*(.*)$/);if(m)s["p"+m[1]]=m[2].trim()});return s}).filter(s=>s.h||s.p30||s.p26)}
function topShift(a){let b={v:"",h:""},m=0;a.forEach(s=>[s.p30,s.p26].forEach(x=>{const n=numOf(x);if(n>m){m=n;b={v:x,h:s.h}}}));return b}
function prep(j){const a=parseShifts(j["الورديات"]);j.__sh=a;if(a.length===1){j["الشفت"]=a[0].h;j[P30]=a[0].p30;j[P26]=a[0].p26}else if(a.length>1){j["الشفت"]="";j[P30]="";j[P26]="";j["المرتب"]=""}return j}
const isMulti=j=>!!(j.__sh&&j.__sh.length>1);
function payText(j){if(isMulti(j))return j.__sh.map(s=>s.h+": "+[s.p30&&"30 يوم "+s.p30,s.p26&&"26 يوم "+s.p26].filter(Boolean).join(" / ")).join(" | ");const a=pays(j);return a.length?a.map(x=>x[0]+": "+x[1]).join(" | "):(j["المرتب"]||"")}

const REQ={name:true,age:true,from:false,housing:false};
const AGE_MIN=16,AGE_MAX=60;
const SAVE_KEY="jobform";
const SRC=(()=>{let v="";try{v=(new URLSearchParams(location.search).get("src")||"").replace(/[\r\n]/g," ").trim().slice(0,30)}catch(e){}try{if(v)sessionStorage.setItem("jobsrc",v);else v=sessionStorage.getItem("jobsrc")||""}catch(e){}return v})();
const hid=n=>{let h=5381;for(const c of String(n))h=((h<<5)+h+c.charCodeAt(0))>>>0;return h.toString(36)};
const manual=j=>{const n=parseFloat(j["الترتيب"]);if(!isNaN(n))return n;return (j["تثبيت"]||"").trim()==="نعم"?0:null};
const rank=j=>done(j)?2:(manual(j)!==null?0:1);
function payScore(j){const c=[j[P30],j[P26],j["المرتب"],...(j.__sh||[]).flatMap(s=>[s.p30,s.p26])];let m=0;c.forEach(x=>{let n=numOf(x);if(n&&/اليوم|يومي|يومية/.test(String(x)))n*=26;if(n>m)m=n});return m}
const byOrder=(x,y)=>rank(x)-rank(y)||(rank(x)===0?manual(x)-manual(y):(rank(x)===1?payScore(y)-payScore(x):0));
function isNew(j){const t=(j["تاريخ الإضافة"]||"").match(/(\d{1,4})[\/\-.](\d{1,2})[\/\-.](\d{1,4})/);if(!t)return false;let y,m,d;if(t[1].length===4){y=+t[1];m=+t[2];d=+t[3]}else{d=+t[1];m=+t[2];y=+t[3];if(y<100)y+=2000}const days=(Date.now()-new Date(y,m-1,d))/864e5;return days>=-1&&days<=NEW_DAYS}

function tags(j){
  let res = done(j) ? '<span class="badge dn">مكتمل</span>' : '';
  if(UI_SETTINGS.show_urgent_badge && urgent(j)) res += '<span class="badge ur">🔥 الأكثر تقديمًا</span>';
  if(UI_SETTINGS.show_new_badge && isNew(j)) res += '<span class="badge nw">جديد</span>';
  return res;
}

const ICON={"السن":"🎂","طبيعة العمل":"👷","الشفت":"⏰","المؤهل":"🎓","نظام القبض":"💰","السكن":"🏠","السلف":"💵","المواصلات":"🚌","وجبة":"🍽️","التأمينات":"🛡️","الأجازة":"📅"};
let JOBS=[],cat="شباب",area="الكل";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function parseRows(t){const r=[];let row=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==","){row.push(f);f=""}else if(c=="\n"){row.push(f);r.push(row);row=[];f=""}else if(c!="\r")f+=c}if(f||row.length){row.push(f);r.push(row)}return r}
function parseCSV(t){const r=parseRows(t);if(!r.length)throw 0;const h=r[0].map(x=>x.trim());return r.slice(1).filter(x=>x.some(v=>v.trim())).map(x=>Object.fromEntries(h.map((k,i)=>[k,(x[i]||"").trim()])))}

let AREA_ORDER=[];
const norm=t=>String(t||"").replace(/[\u064B-\u0652\u0640]/g,"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"y").trim().split(/\s+/).filter(w=>w&&w!=="مدينه").map(w=>w.replace(/^ال/,"")).join("");
const sameArea=(a,b)=>{a=norm(a);b=norm(b);if(!a||!b)return false;return a===b||(a.length>=3&&b.length>=3&&(a.includes(b)||b.includes(a)))};
const areaRank=a=>{const i=AREA_ORDER.findIndex(x=>sameArea(x,a));return i<0?9999:i};

async function getText(u,ms){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(u+"&_="+Date.now(),{signal:c.signal,cache:"no-store"});if(!r.ok)throw 0;return await r.text()}finally{clearTimeout(t)}}

function applyUISettings(){
  if($("ui_title")) $("ui_title").textContent = UI_SETTINGS.header_title;
  if($("ui_sub")) $("ui_sub").textContent = UI_SETTINGS.header_sub;
  if($("ui_trust_text")) $("ui_trust_text").textContent = UI_SETTINGS.trust_text;
  if($("fab")) $("fab").textContent = UI_SETTINGS.wa_btn_text;
  if($("ui_trust_box")) $("ui_trust_box").style.display = UI_SETTINGS.show_trust ? "flex" : "none";
  if($("ui_bar")) $("ui_bar").style.display = UI_SETTINGS.show_bar ? "block" : "none";
  if($("area")) $("area").style.display = UI_SETTINGS.show_area_filter ? "block" : "none";
  
  const root = document.documentElement;
  if(UI_SETTINGS.title_font_size) root.style.setProperty('--header-title-size', UI_SETTINGS.title_font_size);
  if(UI_SETTINGS.card_title_size) root.style.setProperty('--card-title-size', UI_SETTINGS.card_title_size);
  if(UI_SETTINGS.card_pay_size) root.style.setProperty('--card-pay-size', UI_SETTINGS.card_pay_size);
  if(UI_SETTINGS.btn_padding) root.style.setProperty('--btn-padding', UI_SETTINGS.btn_padding);
  if(UI_SETTINGS.btn_radius) root.style.setProperty('--btn-radius', UI_SETTINGS.btn_radius);
  
  const ph=PHONE.replace(/\D/g,"");
  if($("fab")) $("fab").href="https://wa.me/"+ph+"?text="+encodeURIComponent("السلام عليكم، عندي استفسار بخصوص الوظايف");
}

async function load(){
  $("list").innerHTML='<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
  const [jr,ar,sr]=await Promise.allSettled([getText(SHEET_CSV_URL,15000),getText(AREAS_CSV_URL,3000),getText(SETTINGS_CSV_URL,3000)]);
  
  if(sr.status==="fulfilled"){
    try{
      const sData = parseCSV(sr.value);
      sData.forEach(row=>{
        const k = row["مفتَاح_الإعداد"] || row["Key"];
        const v = row["القيمة"] || row["Value"];
        if(k && v !== undefined){
          if(v === "true" || v === "نعم") UI_SETTINGS[k] = true;
          else if(v === "false" || v === "لا") UI_SETTINGS[k] = false;
          else UI_SETTINGS[k] = v;
          if(k === "whatsapp_phone") PHONE = v;
        }
      });
    }catch(e){}
  }
  applyUISettings();

  let d=null;
  if(jr.status==="fulfilled"){try{d=parseCSV(jr.value);if(d.length&&!("المصنع" in d[0]))d=null}catch(e){d=null}}
  if(!d) return showErr();
  
  AREA_ORDER=[];
  if(ar.status==="fulfilled"){try{const rows=parseRows(ar.value);if(rows.length&&rows[0].length===1){const st=norm(rows[0][0])===norm("المنطقة")?1:0;AREA_ORDER=rows.slice(st).map(x=>(x[0]||"").trim()).filter(Boolean)}}catch(e){}}
  
  JOBS=d.filter(j=>(j["ظاهر؟"]||"نعم").trim()!=="لا"&&j["المصنع"]).map(prep);
  const jq=new URLSearchParams(location.search).get("j");
  if(jq){const k=JOBS.findIndex(x=>hid(x["المصنع"])===jq);history.replaceState(null,"",location.pathname+(k>-1?"#job"+k:""))}
  draw();route();
}

function showErr(){
  $("cnt").textContent="";$("clr").style.display="none";$("empty").style.display="none";$("seg").innerHTML="";$("area").innerHTML="";
  $("list").innerHTML='<div class="empty" style="display:block">😕 فيه مشكلة في تحميل الوظايف دلوقتي 🙏<br><button type="button" class="retry" id="retry">دوس هنا وجرّب تاني</button></div>';
  $("retry").onclick=load;
}

function matchCat(j){return cat==="الكل"||(j["الفئة"]||"").includes(cat)}

function draw(){
  const cats=["شباب","بنات"];
  $("seg").innerHTML=cats.map(c=>`<button class="${c===cat?"on":""}" data-v="${c}">${c}</button>`).join("");
  $("seg").querySelectorAll("button").forEach(b=>b.onclick=()=>{cat=b.dataset.v;draw()});
  const seen=[...new Set(JOBS.filter(matchCat).map(j=>j["المنطقة"]).filter(Boolean))];
  const areas=["الكل",...seen.map((a,i)=>[a,i]).sort((x,y)=>(areaRank(x[0])-areaRank(y[0]))||(x[1]-y[1])).map(x=>x[0])];
  if(!areas.includes(area))area="الكل";
  const cntOf=a=>JOBS.filter(j=>matchCat(j)&&!done(j)&&(a==="الكل"||j["المنطقة"]===a)).length;
  $("area").innerHTML=`<button type="button" id="areaBtn" class="ddb ${area!=="الكل"?"on":""}"><span>📍 ${area==="الكل"?"كل المناطق":esc(area)}</span><span>▾</span></button>`;
  $("areaBtn").onclick=openArea;
  $("areaList").innerHTML=`<p class="at">اختار المنطقة</p>`+areas.map(a=>`<button type="button" class="ai ${a===area?"on":""}" data-v="${esc(a)}"><span>${a==="الكل"?"كل المناطق":esc(a)}</span><span class="n">${cntOf(a)}</span></button>`).join("");
  $("areaList").querySelectorAll(".ai").forEach(b=>b.onclick=()=>{area=b.dataset.v;closeArea();draw()});
  const r=JOBS.filter(j=>matchCat(j)&&(area==="الكل"||j["المنطقة"]===area)).sort(byOrder);
  $("cnt").textContent=r.length?`${r.length} وظيفة متاحة`:"";
  $("clr").style.display=(area!=="الكل")?"block":"none";
  $("empty").style.display=r.length?"none":"block";
  $("emt").textContent=JOBS.length?"مفيش وظايف زي كده، جرّب تغيّر الفلتر أو دوّر على حاجة تانية":"مفيش وظايف متاحة دلوقتي، ارجع كمان شوية";
  
  const NEG=/لا يوجد|مفيش|^لا$|غير متوفر/;
  const okv=v=>v&&!NEG.test(v.trim());
  $("list").innerHTML=r.map(j=>{
   const tg=UI_SETTINGS.show_tags ? ((okv(j["السكن"])?'<span>🏠 سكن</span>':'')+(okv(j["المواصلات"])?'<span>🚌 مواصلات '+esc(j["المواصلات"])+'</span>':'')) : '';
   const showPNote = UI_SETTINGS.show_notes && j["تفاصيل المرتب"] && !done(j);
   return `<button class="card ${done(j)?"done":""}" data-i="${JOBS.indexOf(j)}" ${done(j)?"disabled":""}>
   <div class="top"><span class="loc">📍 ${esc(j["المنطقة"])}</span><span class="bd2">${tags(j)}</span></div>
   <div class="ttl">${esc(j["المصنع"])}</div>
   ${payBlock(j)}
   ${showPNote?`<div class="pnote"><span class="nl">ملاحظات</span><span class="nt">${esc(j["تفاصيل المرتب"])}</span></div>`:""}
   ${done(j)?'<span class="more">اكتمل العدد</span>':((tg||!isMulti(j))?`<div class="tg">${tg}${isMulti(j)?'':'<span class="go">تفاصيل ←</span>'}</div>`:"")}</button>`}).join("");
  $("list").querySelectorAll(".card").forEach(b=>b.onclick=()=>go(+b.dataset.i));
}

$("clr").onclick=()=>{area="الكل";draw()};
let aOpen=false,ignoreA=false;
function openArea(){$("aov").classList.add("show");if(!aOpen){aOpen=true;history.pushState({ar:1},"",location.href)}}
function closeArea(){$("aov").classList.remove("show");if(aOpen){aOpen=false;ignoreA=true;history.back()}}
$("aov").onclick=e=>{if(e.target===$("aov"))closeArea()};
window.addEventListener("popstate",()=>{if(ignoreA){ignoreA=false;return}if(aOpen){aOpen=false;$("aov").classList.remove("show")}});

function payBlock(j){
  if(isMulti(j)){
    const t=topShift(j.__sh),ns=j.__sh.map(s=>numOf(s.h)),all=ns.every(n=>n>0);
    const lst=all?ns.join(" و")+" ساعة":j.__sh.map(s=>s.h).join(" و");
    return `<div class="pay"><small>أعلى مرتب${t.h?" · وردية "+esc(hoursOnly(t.h)):""}</small>${esc(t.v)}</div><div class="more2">${j.__sh.length} ورديات: ${esc(lst)}، دوس لباقي التفاصيل ←</div>`}
  const hrs=j["الشفت"]?hoursOnly(j["الشفت"]):"",pa=pays(j),old=j["المرتب"];
  if(!hrs&&!pa.length&&!old)return "";
  const pc=(l,v)=>`<div class="pc">${l?`<small class="tag">${esc(l)}</small>`:""}<b>${esc(v)}</b></div>`;
  return `<div class="pbox">${hrs?`<span class="tag hrs">وردية ${esc(hrs)}</span>`:""}<div class="pcells">${pa.length?pa.map(x=>pc(x[0],x[1])).join(""):(old?pc("",old):"")}</div></div>`}

function hoursOnly(value){const s=String(value||"").trim();const m=s.match(/(\d{1,2})\s*ساعة/);if(m)return m[1]+" ساعة";const n=s.match(/(\d{1,2})\s*ساعات/);if(n)return n[1]+" ساعة";return s||"مش محدد"}

let came=false,sy=0;
function go(i){came=true;sy=window.scrollY;location.hash="job"+i}
function exitDetail(){if(came){came=false;history.back()}else{location.hash=""}}
function route(){
  let j=null;const m=location.hash.match(/^#job(\d+)$/),f=location.hash.match(/^#f=(.+)$/);
  if(m)j=JOBS[+m[1]];else if(f){try{const n=decodeURIComponent(f[1]);j=JOBS.find(x=>x["المصنع"]===n)}catch(e){}}
  if(j&&!done(j)){showDetail(j)}else{came=false;$("detail").style.display="none";$("main").style.display="";window.scrollTo(0,sy)}
}

function formHTML(j){return `<div class="ov" id="fo"><div class="sheet"><div class="grab"></div><div class="sb">
   <div class="sh"><h2 class="ttl" style="margin:.2rem 0 0">قدّم على ${esc(j["المصنع"])}</h2><button type="button" class="x" id="fx">✕</button></div>
   <label class="fl">الاسم ثلاثي<input id="f_n" autocomplete="name"></label><div class="er" id="e_n"></div>
   <label class="fl">السن<input id="f_a" inputmode="numeric" maxlength="2" autocomplete="off"></label><div class="er" id="e_a"></div>
   <label class="fl">منين؟<input id="f_p" autocomplete="off" placeholder="المحافظة / المنطقة"></label><div class="er" id="e_p"></div>
   <div class="fl">محتاج شغل بسكن؟<div class="yn" id="f_h"><button type="button" data-v="آه">آه</button><button type="button" data-v="لا">لا</button></div></div>
   <div class="er" id="e_h"></div></div>
   <div class="fgo"><button type="button" class="btn wa" id="fgo">دوس هنا وكمّل على الواتساب</button></div></div></div>`}

let foOpen=false,foHide=null,ignoreFo=0;
window.addEventListener("popstate",()=>{if(ignoreFo>0){ignoreFo--;return}if(foOpen){foOpen=false;if(foHide)foHide()}});

function setupApply(j,ph){
  const fo=$("fo"),en=$("f_n"),ea=$("f_a"),ep=$("f_p"),eh=$("e_h");let hs="";
  const errs={f_n:$("e_n"),f_a:$("e_a"),f_p:$("e_p")};
  const clearErr=()=>{[en,ea,ep].forEach(x=>x.classList.remove("bad"));Object.values(errs).forEach(e=>e.textContent="");eh.textContent=""};
  [en,ea,ep].forEach(x=>x.addEventListener("input",()=>{x.classList.remove("bad");errs[x.id].textContent=""}));
  try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||"{}");en.value=s.n||"";ea.value=s.a||"";ep.value=s.p||""}catch(e){}
  foOpen=false;foHide=()=>fo.classList.remove("show");
  const close=()=>{foHide();if(foOpen){foOpen=false;ignoreFo++;history.back()}};
  $("apply").onclick=()=>{clearErr();fo.classList.add("show");if(!foOpen){foOpen=true;history.pushState({fo:1},"",location.href)};setTimeout(()=>{(en.value?ea:en).focus()},250)};
  $("fx").onclick=close;fo.onclick=e=>{if(e.target===fo)close()};
  const yn=$("f_h").querySelectorAll("button");
  yn.forEach(b=>b.onclick=()=>{eh.textContent="";const was=b.classList.contains("on");yn.forEach(x=>x.classList.remove("on"));if(was){hs=""}else{b.classList.add("on");hs=b.dataset.v}});
  $("fgo").onclick=()=>{
    const n=en.value.trim().replace(/\s+/g," "),p=ep.value.trim(),a=ea.value.trim().replace(/[٠-٩]/g,d=>"٠١٢٣٥٦٧٨٩".indexOf(d));
    clearErr();
    const fail=(el,m)=>{el.classList.add("bad");errs[el.id].textContent=m;el.focus();el.scrollIntoView({block:"center",behavior:"smooth"})};
    if((REQ.name||n)&&n.split(" ").filter(w=>w.length>=2).length<3)return fail(en,"الاسم ناقص، اكتب الاسم ثلاثي كامل");
    if((REQ.age||a)&&!/^\d{1,2}$/.test(a))return fail(ea,"اكتب السن بالأرقام");
    if(a&&(+a<AGE_MIN||+a>AGE_MAX))return fail(ea,"السن لازم يكون من "+AGE_MIN+" لـ "+AGE_MAX);
    if(REQ.from&&!p)return fail(ep,"اكتب منين انت");
    if(REQ.housing&&!hs){eh.textContent="اختار آه أو لا";return}
    try{localStorage.setItem(SAVE_KEY,JSON.stringify({n:n,a:a,p:p}))}catch(e){}
    const L=["السلام عليكم، عايز أقدم على وظيفة: "+j["المصنع"]+" - "+j["المنطقة"],""];
    if(!isMulti(j)&&j["الشفت"])L.splice(1,0,"الوردية: "+hoursOnly(j["الشفت"]));
    if(n)L.push("الاسم: "+n);if(a)L.push("السن: "+a);if(p)L.push("منين: "+p);if(hs)L.push("محتاج سكن: "+hs);if(SRC)L.push("المصدر: "+SRC);
    const u="https://wa.me/"+ph+"?text="+encodeURIComponent(L.join("\n"));
    close();window.open(u,"_blank")||(location.href=u);
  };
}

function showDetail(j){
  const ph=PHONE.replace(/\D/g,""),
   link=location.origin+location.pathname+"?j="+hid(j["المصنع"]),
   shareMsg=encodeURIComponent(`وظيفة: ${j["المصنع"]} - ${j["المنطقة"]}\n${(!isMulti(j)&&j["الشفت"])?"وردية "+hoursOnly(j["الشفت"])+"\n":""}${payText(j)}\n${link}`);
  const it=k=>`<div class="it ${(k==="طبيعة العمل"||String(j[k]).length>26)?"full":""}"><small>${ICON[k]||"•"} ${esc(k)}</small><b>${esc(j[k])}</b></div>`;
  const sec=(t,ks,pre)=>{const r=ks.filter(k=>j[k]);return (r.length||pre)?`<div class="sec"><h3>${t}</h3><div class="g2">${pre||""}${r.map(it).join("")}</div></div>`:""};
  const pp=pays(j);
  const noteHTML=(UI_SETTINGS.show_notes && j["تفاصيل المرتب"])?`<div class="pnote"><span class="nl">ملاحظات</span><span class="nt">${esc(j["تفاصيل المرتب"])}</span></div>`:"";
  const cell=x=>x?esc(String(x).replace(/\s*في الشهر/,"")):"—";
  const tbl=isMulti(j)?`<div class="it pay2 full"><table class="sht"><tr><th>⏰ الوردية</th><th><span class="tag">30 يوم</span></th><th><span class="tag">26 يوم + 4 إجازة</span></th></tr>${j.__sh.map(s=>`<tr><td>${esc(s.h)}</td><td>${cell(s.p30)}</td><td>${cell(s.p26)}</td></tr>`).join("")}</table></div>`:"";
  const hrsPill=(!isMulti(j)&&j["الشفت"])?`<div class="hp"><span class="tag">وردية ${esc(hoursOnly(j["الشفت"]))}</span></div>`:"";
  const payTile0=`<div class="it pay2 full">${hrsPill}${pp.length?pp.map(x=>`<div class="pt"><small class="tag">${esc(x[0])}</small><b>${esc(x[1])}</b></div>`).join(""):`<small>💰 المرتب</small><b>${esc(j["المرتب"]||"")}</b>`}</div>`;
  const payTile=(isMulti(j)?tbl:payTile0)+noteHTML;
  const plainSh=/^\s*\d{1,2}\s*(ساعة|ساعات)\s*$/.test(j["الشفت"]||"");
  const groups=[["الأساسيات",["السن",...(plainSh?[]:["الشفت"]),"طبيعة العمل","المؤهل","الأجازة"],payTile],["المرتب والمميزات",["نظام القبض","السلف","التأمينات","وجبة"]],["السكن والمواصلات",["السكن","المواصلات"]]];
  const used=groups.flatMap(g=>g[1]);
  const other=Object.keys(j).filter(k=>!k.startsWith("__")&&!CORE.includes(k)&&!used.includes(k)&&j[k]);
  $("detail").innerHTML=`<div class="w dp"><div class="tb"><button class="exit" id="ex"><span class="xr">✕</span>رجوع</button></div>
   <div class="top"><span class="loc">📍 ${esc(j["المنطقة"])}</span><span class="bd2">${tags(j)}<span class="badge">${esc(j["الفئة"])}</span></span></div>
   <h2 class="ttl">${esc(j["المصنع"])}</h2>
   ${groups.map(g=>sec(g[0],g[1],g[2])).join("")}${sec("حاجات تانية",other)}</div>
   <div class="cta"><button type="button" class="btn wa" id="apply">قدّم دلوقتي على الواتساب</button><a class="btn" href="tel:+${ph}">📞 اتصل</a><a class="btn" target="_blank" rel="noopener" href="https://wa.me/?text=${shareMsg}">↗ شارك</a></div>${formHTML(j)}`;
  $("main").style.display="none";$("detail").style.display="block";window.scrollTo(0,0);
  $("ex").onclick=exitDetail;setupApply(j,ph);
}

window.addEventListener("hashchange",route);
load();
</script>
