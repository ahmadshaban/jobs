<script>
/* ===== إعدادات ===== */
const PHONE = "201095237207";   // رقم الواتساب بصيغة دولية بدون +
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1Ri61Py0q36t2EdMCWXa0lgJGDWJfrXjY0gHmqnwS4AM/gviz/tq?tqx=out:csv&headers=1&sheet=%D8%A7%D9%84%D9%88%D8%B8%D8%A7%D8%A6%D9%81";

/* بيانات تجريبية تظهر لو الشيت ما اتقراش */
const SAMPLE = [
{"المنطقة":"6 أكتوبر","الفئة":"بنات","المصنع":"مصنع أدوية (استيكر)","المؤهل":"نقاب عادي - مؤهلات","الشفت":"9 ساعات (8 ص : 5 م)","المرتب":"200 ج/يوماً","نظام القبض":"يومي / أسبوعي / شهري","السكن":"لا يوجد","السلف":"متاح بعد أسبوع","المواصلات":"خارجية (خطوط)","التأمينات":"بعد 3 شهور","الأجازة":"الجمعة","ظاهر؟":"نعم"},
{"المنطقة":"6 أكتوبر","الفئة":"شباب وبنات","المصنع":"مصنع أغذية (شيبسي)","المؤهل":"مؤهلات متوسطة وعليا","الشفت":"12 ساعة (شفتات متغيرة)","المرتب":"7000 ج شهرياً","نظام القبض":"شهري","السكن":"لا يوجد","السلف":"متاح","المواصلات":"داخلية","وجبة":"وجبة يومية","التأمينات":"من أول يوم","الأجازة":"يوم أسبوعياً","ظاهر؟":"نعم"},
{"المنطقة":"مدينة السادات","الفئة":"شباب","المصنع":"مصنع غزل ونسيج","المؤهل":"عمال إنتاج","الشفت":"12 ساعة","المرتب":"6500 ج شهرياً","نظام القبض":"شهري","السكن":"متوفر (مجاناً)","السلف":"متاح","المواصلات":"داخلية","التأمينات":"بعد شهر","الأجازة":"الجمعة","ظاهر؟":"نعم"},
{"المنطقة":"العاشر من رمضان","الفئة":"شباب","المصنع":"مصنع بلاستيك","المؤهل":"أي مؤهل - لياقة بدنية","الشفت":"12 ساعة (ليلي / نهاري)","المرتب":"6800 ج شهرياً","نظام القبض":"أسبوعي","السكن":"متوفر بخصم 300 ج","السلف":"متاح بعد شهر","المواصلات":"خارجية","وجبة":"وجبة","التأمينات":"بعد 3 شهور","ظاهر؟":"نعم"},
{"المنطقة":"العاشر من رمضان","الفئة":"بنات","المصنع":"مصنع ملابس جاهزة","المؤهل":"خبرة مش شرط","الشفت":"9 ساعات (8 ص : 5 م)","المرتب":"190 ج/يوماً","نظام القبض":"أسبوعي","السكن":"سكن بنات متوفر","السلف":"متاح","المواصلات":"داخلية","الأجازة":"الجمعة","ظاهر؟":"نعم"},
{"المنطقة":"بدر","الفئة":"بنات","المصنع":"مصنع منظفات","المؤهل":"نقاب عادي - مؤهلات","الشفت":"8 ساعات","المرتب":"185 ج/يوماً","نظام القبض":"يومي","السكن":"لا يوجد","السلف":"غير متاح","المواصلات":"خارجية (خطوط)","الأجازة":"الجمعة","ظاهر؟":"نعم"},
{"المنطقة":"بدر","الفئة":"شباب","المصنع":"مصنع ألومنيوم","المؤهل":"عمال إنتاج","الشفت":"12 ساعة","المرتب":"7500 ج شهرياً","نظام القبض":"شهري","السكن":"متوفر","السلف":"متاح","المواصلات":"داخلية","وجبة":"وجبتين","التأمينات":"من أول يوم","ظاهر؟":"نعم"},
{"المنطقة":"6 أكتوبر","الفئة":"بنات","المصنع":"مصنع لانشون","المؤهل":"مؤهلات - بدون نقاب","الشفت":"9 ساعات","المرتب":"195 ج/يوماً","نظام القبض":"أسبوعي","السكن":"لا يوجد","السلف":"متاح","المواصلات":"خارجية","الأجازة":"الجمعة","ظاهر؟":"نعم"},
{"المنطقة":"مدينة السادات","الفئة":"بنات","المصنع":"مصنع سايلو","المؤهل":"مؤهلات","الشفت":"8 ساعات","المرتب":"180 ج/يوماً","نظام القبض":"أسبوعي","السكن":"لا يوجد","السلف":"متاح","المواصلات":"خارجية","ظاهر؟":"نعم"},
{"المنطقة":"العبور","الفئة":"شباب وبنات","المصنع":"مصنع تعبئة وتغليف","المؤهل":"أي مؤهل","الشفت":"10 ساعات","المرتب":"6200 ج شهرياً","نظام القبض":"شهري","السكن":"لا يوجد","السلف":"متاح","المواصلات":"خارجية","وجبة":"وجبة","التأمينات":"بعد 3 شهور","ظاهر؟":"نعم"},
{"المنطقة":"العبور","الفئة":"شباب","المصنع":"مصنع ثلاجات وتبريد","المؤهل":"دبلوم صنايع","الشفت":"12 ساعة","المرتب":"8000 ج شهرياً","نظام القبض":"شهري","السكن":"متوفر","السلف":"متاح","المواصلات":"داخلية","التأمينات":"من أول يوم","ظاهر؟":"نعم"},
{"المنطقة":"6 أكتوبر","الفئة":"شباب","المصنع":"مصنع قديم (مخفي للتجربة)","المؤهل":"-","الشفت":"-","المرتب":"-","ظاهر؟":"لا"}
];

const CORE=["المنطقة","الفئة","المصنع","المؤهل","الشفت","المرتب","ظاهر؟","الحالة","تاريخ الإضافة"];
const done=j=>(j["الحالة"]||"").includes("مكتمل");   // <<< عمود الحالة = مكتمل
const urgent=j=>(j["الحالة"]||"").includes("عاجل");   // <<< عمود الحالة = عاجل
const NEW_DAYS=3;                                    // <<< غيّر هنا: عدد أيام شارة "جديد"
const MSG_FIELDS=["الاسم:","السن:","المحافظة:"];      // <<< غيّر هنا: البيانات المطلوبة في رسالة الواتساب
const rank=j=>done(j)?2:urgent(j)?0:1;
// تاريخ الإضافة: الأفضل يتكتب 2026-10-10
function isNew(j){const t=(j["تاريخ الإضافة"]||"").match(/(\d{1,4})[\/\-.](\d{1,2})[\/\-.](\d{1,4})/);if(!t)return false;
 let y,m,d;if(t[1].length===4){y=+t[1];m=+t[2];d=+t[3]}else{d=+t[1];m=+t[2];y=+t[3];if(y<100)y+=2000}
 const days=(Date.now()-new Date(y,m-1,d))/864e5;return days>=-1&&days<=NEW_DAYS}
// شارات الحالة (عاجل / جديد)
const tags=j=>(urgent(j)?'<span class="badge ur">🔥 عاجل</span>':'')+(isNew(j)?'<span class="badge nw">جديد</span>':'');
const ICON={"الشفت":"⏰","المؤهل":"🎓","نظام القبض":"💰","السكن":"🏠","السلف":"💵","المواصلات":"🚌","وجبة":"🍽️","التأمينات":"🛡️","الأجازة":"📅"};
// رقم الواتساب في سطر الثقة وزرار الاستفسار (من PHONE فوق)
{const ph=PHONE.replace(/\D/g,"");const tp=document.getElementById("tph"),fb=document.getElementById("fab");
 if(tp)tp.textContent="📞 واتساب: 0"+ph.replace(/^20/,"");
 if(fb)fb.href="https://wa.me/"+ph+"?text="+encodeURIComponent("السلام عليكم، عندي استفسار بخصوص الوظايف");}
let JOBS=[],cat="شباب",area="الكل";   // <<< غيّر هنا: الفئة الافتتاحية (شباب أو بنات)
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function parseCSV(t){const r=[];let row=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];
 if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
 else if(c=='"')q=true;else if(c==","){row.push(f);f=""}
 else if(c=="\n"){row.push(f);r.push(row);row=[];f=""}else if(c!="\r")f+=c}
 if(f||row.length){row.push(f);r.push(row)}
 const h=r[0].map(x=>x.trim());return r.slice(1).filter(x=>x.some(v=>v.trim())).map(x=>Object.fromEntries(h.map((k,i)=>[k,(x[i]||"").trim()])))}

async function load(){
  let d=SAMPLE;
  if(SHEET_CSV_URL){try{const r=await fetch(SHEET_CSV_URL);if(r.ok)d=parseCSV(await r.text())}catch(e){}}
  JOBS=d.filter(j=>(j["ظاهر؟"]||"نعم").trim()!=="لا"&&j["المصنع"]);
  draw();route();
}
const kind=c=>c.includes("بنات")&&c.includes("شباب")?"":c.includes("بنات")?"g":"m";
const has=(c,k)=>c==="الكل"||c===k;
function matchCat(j){return cat==="الكل"||(j["الفئة"]||"").includes(cat)}

function draw(){
  const cats=["شباب","بنات"];   // <<< الفئات الظاهرة
  $("seg").innerHTML=cats.map(c=>`<button class="${c===cat?"on":""}" data-v="${c}">${c}</button>`).join("");
  $("seg").querySelectorAll("button").forEach(b=>b.onclick=()=>{cat=b.dataset.v;draw()});
  const areas=["الكل",...new Set(JOBS.filter(matchCat).map(j=>j["المنطقة"]).filter(Boolean))];
  if(!areas.includes(area))area="الكل";
  $("area").innerHTML=areas.map(a=>`<button class="chip ${a===area?"on":""}" data-v="${esc(a)}">${esc(a)}</button>`).join("");
  $("area").querySelectorAll("button").forEach(b=>b.onclick=()=>{area=b.dataset.v;draw()});
  const q=$("q").value.trim();
  const r=JOBS.filter(j=>matchCat(j)&&(area==="الكل"||j["المنطقة"]===area)&&(!q||(j["المصنع"]+(j["المؤهل"]||"")).includes(q))).sort((x,y)=>rank(x)-rank(y));   // العاجل فوق والمكتمل تحت
  $("cnt").textContent=r.length?`${r.length} وظيفة متاحة`:"";
  $("clr").style.display=(area!=="الكل"||q)?"block":"none";
  $("empty").style.display=r.length?"none":"block";
  $("list").innerHTML=r.map(j=>`<button class="card ${done(j)?"done":""}" data-i="${JOBS.indexOf(j)}" ${done(j)?"disabled":""}>
   <div class="top"><span class="loc">📍 ${esc(j["المنطقة"])}</span><span class="bd2">${done(j)?'<span class="badge dn">العدد اكتمل</span>':tags(j)+`<span class="badge ${kind(j["الفئة"]||"")}">${esc(j["الفئة"])}</span>`}</span></div>
   <div class="ttl">${esc(j["المصنع"])}</div><div class="who">${esc(j["المؤهل"])}</div>
   <div class="pay">${esc(j["المرتب"])}</div>
   <div class="facts"><span>⏰ ${esc(j["الشفت"])}</span>${["السكن","المواصلات"].filter(k=>j[k]).map(k=>`<span>${ICON[k]} ${esc(j[k])}</span>`).join("")}</div>
   ${done(j)?"":'<span class="more">التفاصيل ‹</span>'}</button>`).join("");
  $("list").querySelectorAll(".card").forEach(b=>b.onclick=()=>go(+b.dataset.i));
}
$("clr").onclick=()=>{area="الكل";$("q").value="";draw()};
$("q").oninput=draw;

let came=false,sy=0;
function go(i){came=true;sy=window.scrollY;location.hash="job"+i}
function exitDetail(){if(came){came=false;history.back()}else{location.hash=""}}
function route(){
  let j=null;const m=location.hash.match(/^#job(\d+)$/),f=location.hash.match(/^#f=(.+)$/);
  if(m)j=JOBS[+m[1]];else if(f){try{const n=decodeURIComponent(f[1]);j=JOBS.find(x=>x["المصنع"]===n)}catch(e){}}   /* المكتمل مش بيفتح */
  if(j&&!done(j)){showDetail(j)}else{came=false;$("detail").style.display="none";$("main").style.display="";window.scrollTo(0,sy)}
}
function showDetail(j){
  const ph=PHONE.replace(/\D/g,""),
   msg=encodeURIComponent(`السلام عليكم، عايز أقدم على وظيفة: ${j["المصنع"]} - ${j["المنطقة"]}\n\n${MSG_FIELDS.join("\n")}`),
   link=location.origin+location.pathname+"#f="+encodeURIComponent(j["المصنع"]),
   shareMsg=encodeURIComponent(`وظيفة: ${j["المصنع"]} - ${j["المنطقة"]}\n${j["المرتب"]||""}\n${link}`);
  // مربع: اسم الخانة فوق وقيمتها تحت. القيمة الطويلة ياخد صف كامل
  const it=k=>`<div class="it ${String(j[k]).length>26?"full":""}"><small>${ICON[k]||"•"} ${esc(k)}</small><b>${esc(j[k])}</b></div>`;
  // قسم: عنوان + مربعاته (بيتخطى الخانات الفاضية)
  const sec=(t,ks)=>{const r=ks.filter(k=>j[k]);return r.length?`<div class="sec"><h3>${t}</h3><div class="g2">${r.map(it).join("")}</div></div>`:""};
  // <<< غيّر هنا: ترتيب الأقسام وأي خانة تتحط في أنهي قسم
  const groups=[["الشغل",["الشفت","المؤهل","الأجازة"]],["الدفع والمميزات",["نظام القبض","السلف","التأمينات","وجبة"]],["السكن والمواصلات",["السكن","المواصلات"]]];
  const used=groups.flatMap(g=>g[1]);
  const other=Object.keys(j).filter(k=>!CORE.includes(k)&&!used.includes(k)&&j[k]);
  $("detail").innerHTML=`<div class="w dp"><div class="tb"><button class="exit" id="ex">✕ خروج</button></div>
   <div class="top"><span class="loc">📍 ${esc(j["المنطقة"])}</span><span class="bd2">${tags(j)}<span class="badge ${kind(j["الفئة"]||"")}">${esc(j["الفئة"])}</span></span></div>
   <h2 class="ttl">${esc(j["المصنع"])}</h2>
   <div class="hero"><small>المرتب</small><b>${esc(j["المرتب"])}</b></div>
   ${groups.map(g=>sec(g[0],g[1])).join("")}${sec("تفاصيل أخرى",other)}
   <!-- <<< غيّر هنا: الملاحظة تحت التفاصيل -->
   <p class="note">هتتحول لواتساب مباشرة، ومفيش بيانات بتتحفظ على الموقع</p></div>
   <div class="cta"><a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${ph}?text=${msg}">قدم الآن عبر الواتساب</a><a class="btn" href="tel:+${ph}">📞 اتصل</a><a class="btn sh2" target="_blank" rel="noopener" href="https://wa.me/?text=${shareMsg}">↗ شارك</a></div>`;
  $("main").style.display="none";$("detail").style.display="block";window.scrollTo(0,0);
  $("ex").onclick=exitDetail;
}
window.addEventListener("hashchange",route);
load();
</script>
</body>
</html>
