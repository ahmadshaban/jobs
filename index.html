<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
/* <<< غيّر هنا: الألوان */--bg:#eef3fb;--card:#fff;--tx:#25324a;--mu:#6b7a94;--bd:#dbe4f0;--ac:#3a72d8;--acs:#e6effc;--sh:0 1px 4px rgba(60,90,140,.08)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.5}
.w{max-width:40rem;margin:auto;padding:0 1rem 3rem}
header{padding:1.2rem 0 .6rem}h1{font-size:1.75rem;font-weight:800;margin:0;line-height:1.3}.sub{color:var(--mu);margin:.1rem 0 0;font-size:.95rem}.lead{margin:0 0 .15rem;font-size:.92rem}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:.5rem 0 .6rem}
.search{position:relative}.search span{position:absolute;inset-inline-start:.9rem;top:50%;transform:translateY(-50%);opacity:.6}
.search input{width:100%;font:inherit;font-size:16px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:1rem;padding:.8rem 2.6rem;box-shadow:var(--sh);outline:none}
.search input:focus{border-color:var(--ac)}
.seg{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:1rem;padding:.25rem;margin-top:.6rem}
.seg button{flex:1;font:inherit;font-weight:700;font-size:.95rem;border:0;background:none;color:var(--mu);padding:.55rem 0;border-radius:.75rem;cursor:pointer}
.seg button.on{background:var(--ac);color:#fff}
.chips{display:flex;gap:.5rem;overflow-x:auto;padding:.6rem 0 .1rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{font:inherit;font-size:.88rem;white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:.4rem .95rem;cursor:pointer}
.chip.on{background:var(--acs);border-color:var(--ac);color:var(--ac);font-weight:700}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--mu);font-size:.88rem;margin:.6rem 0 .5rem}
.meta button{font:inherit;color:var(--ac);background:none;border:0;font-weight:700;cursor:pointer}
.card{display:block;width:100%;text-align:start;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:1.2rem;padding:1rem 1.1rem;margin-bottom:.75rem;box-shadow:var(--sh);cursor:pointer;transition:transform .12s}
.card:active{transform:scale(.985)}
.top{display:flex;justify-content:space-between;align-items:center;gap:.5rem;font-size:.82rem}
.loc{color:var(--mu);font-weight:600}.badge{font-weight:700;border-radius:99px;padding:.1rem .65rem;background:var(--acs);color:var(--ac)}
.badge.g{background:#fde7f1;color:#be185d}.badge.m{background:#dff3f8;color:#0e7490}
.ttl{font-size:1.12rem;font-weight:800;margin:.35rem 0 .1rem}.who{color:var(--mu);font-size:.9rem}
/* <<< غيّر هنا: شكل المرتب في الكروت */
.pay{display:inline-block;font-size:1.3rem;font-weight:800;color:var(--ac);background:var(--acs);border-radius:.8rem;padding:.35rem .8rem;margin:.55rem 0 .2rem}
.facts{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.5rem}.facts span{font-size:.8rem;background:var(--bg);border-radius:.6rem;padding:.2rem .6rem;color:var(--mu)}
.more{display:block;text-align:end;color:var(--ac);font-weight:700;font-size:.85rem;margin-top:.5rem}
.sk{height:8.5rem;border-radius:1.2rem;background:linear-gradient(90deg,var(--card),var(--bd),var(--card));background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:.75rem}
@keyframes sk{to{background-position:-200% 0}}
.empty{text-align:center;color:var(--mu);padding:3rem 1rem;display:none}
.retry{font:inherit;font-weight:800;color:#fff;background:var(--ac);border:0;border-radius:.8rem;padding:.65rem 1.2rem;margin-top:.9rem;cursor:pointer}
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}@media(min-width:640px){.ov{align-items:center}}
.sheet{background:var(--bg);width:100%;max-width:30rem;max-height:92%;display:flex;flex-direction:column;border-radius:1.6rem 1.6rem 0 0;animation:up .22s ease-out}
@media(min-width:640px){.sheet{border-radius:1.6rem}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grab{width:2.6rem;height:.26rem;border-radius:9px;background:var(--bd);margin:.45rem auto .1rem}
.sb{overflow-y:auto;padding:.3rem 1.1rem .7rem}
.sh{display:flex;justify-content:space-between;gap:.5rem;align-items:flex-start}
.x{font:inherit;width:2.2rem;height:2.2rem;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;flex:none}
/* <<< غيّر هنا: كارت المرتب في صفحة المصنع */
.hero{background:linear-gradient(135deg,#3a72d8,#2a55b3);border-radius:1.2rem;padding:.9rem 1.1rem;margin:.7rem 0;box-shadow:0 6px 18px rgba(58,114,216,.28)}.hero small{color:rgba(255,255,255,.85);font-size:.85rem;font-weight:700}.hero b{display:block;font-size:2rem;color:#fff;font-weight:800;line-height:1.3}
/* ===== [CSS] أقسام التفاصيل (غيّر عدد الأعمدة من repeat(2,1fr)) ===== */
.sec{background:var(--card);border:1px solid var(--bd);border-radius:1.1rem;padding:.75rem .8rem .8rem;margin-top:.7rem;box-shadow:var(--sh)}
.sec h3{margin:0 0 .55rem;font-size:.85rem;font-weight:800;color:var(--ac)}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:.55rem}
.it{background:var(--bg);border-radius:.8rem;padding:.55rem .7rem;display:flex;flex-direction:column;gap:.15rem}
.it.full{grid-column:1/-1}
.it small{color:var(--mu);font-size:.72rem;line-height:1.2}
.it b{font-size:.92rem;font-weight:700;line-height:1.35}
.card.done{opacity:.55;cursor:default;pointer-events:none;filter:grayscale(.4)}
/* ===== [CSS] سطر الثقة + ملاحظة التقديم + زرار الاستفسار ===== */
.trust{display:flex;flex-wrap:wrap;gap:.35rem .5rem;margin-top:.55rem}
.trust span{font-size:.78rem;font-weight:700;background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:99px;padding:.2rem .7rem}
.note{text-align:center;color:var(--mu);font-size:.76rem;margin:.8rem .5rem 0}
.fab{position:fixed;left:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:6;text-decoration:none;font-weight:800;font-size:.9rem;color:#fff;background:#16a34a;border-radius:99px;padding:.65rem 1.05rem;box-shadow:0 4px 14px rgba(22,163,74,.35)}
.badge.dn{background:#fee2e2;color:#b91c1c}
.badge.ur{background:#ffedd5;color:#c2410c}.badge.nw{background:#dcfce7;color:#15803d}
.bd2{display:flex;gap:.3rem;align-items:center}
.btn.sh2{flex:0 0 auto;padding:.38rem .65rem}
/* <<< غيّر هنا: حجم أزرار التقديم والاتصال والشير */
.cta{padding:.4rem .9rem calc(.4rem + env(safe-area-inset-bottom,0px));border-top:1px solid var(--bd);background:var(--bg);display:flex;gap:.5rem}
.btn{display:block;flex:1;text-align:center;text-decoration:none;font:inherit;font-weight:800;font-size:.8rem;border-radius:.7rem;padding:.38rem .3rem;color:var(--tx);border:1px solid var(--bd);background:var(--card)}
.btn.wa{flex:2;background:var(--ac);color:#fff;border:0;font-size:.84rem}
.tb{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:.7rem 0 .5rem}
.exit{font:inherit;font-weight:800;font-size:.95rem;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:.85rem;padding:.5rem 1rem;cursor:pointer}
.dp{padding-bottom:4.2rem}.dp .ttl{font-size:1.3rem;margin:.4rem 0 0}
.cta{position:fixed;inset-inline:0;bottom:0;max-width:40rem;margin:auto}
.btn.wa{cursor:pointer}
/* ===== [CSS] فورم التقديم ===== */
.fl{display:block;font-weight:700;font-size:.85rem;margin-top:.75rem}
.fl input{display:block;width:100%;font:inherit;font-size:16px;font-weight:400;margin-top:.3rem;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:.8rem;padding:.7rem .85rem;outline:none}
.fl input:focus{border-color:var(--ac)}.fl input.bad{border-color:#dc2626}
.yn{display:flex;gap:.5rem;margin-top:.3rem}
.yn button{flex:1;font:inherit;font-weight:700;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:.8rem;padding:.65rem 0;cursor:pointer}
.yn button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.er{color:#b91c1c;font-size:.82rem;font-weight:700;margin-top:.25rem}.er:empty{display:none}
.fgo{padding:.6rem 1.1rem calc(.7rem + env(safe-area-inset-bottom,0px));border-top:1px solid var(--bd);background:var(--bg)}
.fgo .btn{width:100%;padding:.85rem;font-size:1rem;border:0}
</style>
</head>
<body>
<div class="w" id="main">
  <header><!-- <<< غيّر هنا: الجملة (فوق) والعنوان (تحتها) --><p class="sub lead">قدّم من الموبايل في دقايق واختار الفرصة المناسبة ليك</p><h1>عمال تعبئة وتغليف وفرز</h1>
    <!-- <<< غيّر هنا: سطر الثقة (الجمل اللي تحت العنوان) -->
    <div class="trust"><span>✅ التقديم من غير أي رسوم مقدما</span></div></header>
  <div class="bar">
    <div class="search"><span>🔍</span><input id="q" type="search" placeholder="دوّر على مصنع أو وظيفة"></div>
    <div id="seg" class="seg"></div>
    <div id="area" class="chips"></div>
  </div>
  <div class="meta"><span id="cnt"></span><button id="clr" style="display:none">امسح الفلاتر</button></div>
  <div id="list"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
  <a id="fab" class="fab" target="_blank" rel="noopener">💬 استفسار على واتساب</a>
  <div id="empty" class="empty">😕 <span id="emt"></span></div>
</div>
<div id="detail" style="display:none"></div>
<script>
/* ===== إعدادات ===== */
// تبويب "المناطق" في الشيت: ترتيب الصفوف فيه = ترتيب أزرار المناطق في الموقع (غيّر الترتيب من الشيت نفسه)
const AREAS_CSV_URL="https://docs.google.com/spreadsheets/d/1Ri61Py0q36t2EdMCWXa0lgJGDWJfrXjY0gHmqnwS4AM/gviz/tq?tqx=out:csv&headers=1&sheet=%D8%A7%D9%84%D9%85%D9%86%D8%A7%D8%B7%D9%82";
const PHONE = "201095237207";   // رقم الواتساب بصيغة دولية بدون +
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1Ri61Py0q36t2EdMCWXa0lgJGDWJfrXjY0gHmqnwS4AM/gviz/tq?tqx=out:csv&headers=1&sheet=%D8%A7%D9%84%D9%88%D8%B8%D8%A7%D8%A6%D9%81";


const CORE=["المنطقة","الفئة","المصنع","المؤهل","الشفت","المرتب","ظاهر؟","الحالة","تاريخ الإضافة"];
const done=j=>(j["الحالة"]||"").includes("مكتمل");   // <<< عمود الحالة = مكتمل
const urgent=j=>(j["الحالة"]||"").includes("عاجل");   // <<< عمود الحالة = عاجل
const NEW_DAYS=3;                                    // <<< غيّر هنا: عدد أيام شارة "جديد"
/* ===== إعدادات فورم التقديم ===== */
const REQ={name:true,age:true,from:false,housing:false};   // <<< غيّر هنا: true = إجباري / false = اختياري
const AGE_MIN=16,AGE_MAX=60;                                // <<< غيّر هنا: أقل وأكبر سن مقبول
const SAVE_KEY="jobform";                                   // اسم التخزين على موبايل المتقدم (عشان ميكتبش بياناته كل مرة)
// رقم قصير ثابت لكل مصنع (من اسمه) يتحط في لينك الشير: ?j=xxxxxx
const hid=n=>{let h=5381;for(const c of String(n))h=((h<<5)+h+c.charCodeAt(0))>>>0;return h.toString(36)};
const rank=j=>done(j)?2:urgent(j)?0:1;
// تاريخ الإضافة: الأفضل يتكتب 2026-10-10
function isNew(j){const t=(j["تاريخ الإضافة"]||"").match(/(\d{1,4})[\/\-.](\d{1,2})[\/\-.](\d{1,4})/);if(!t)return false;
 let y,m,d;if(t[1].length===4){y=+t[1];m=+t[2];d=+t[3]}else{d=+t[1];m=+t[2];y=+t[3];if(y<100)y+=2000}
 const days=(Date.now()-new Date(y,m-1,d))/864e5;return days>=-1&&days<=NEW_DAYS}
// شارات الحالة (عاجل / جديد)
const tags=j=>(urgent(j)?'<span class="badge ur">🔥 عاجل</span>':'')+(isNew(j)?'<span class="badge nw">جديد</span>':'');
const ICON={"الشفت":"⏰","المؤهل":"🎓","نظام القبض":"💰","السكن":"🏠","السلف":"💵","المواصلات":"🚌","وجبة":"🍽️","التأمينات":"🛡️","الأجازة":"📅"};
// رقم الواتساب في سطر الثقة وزرار الاستفسار (من PHONE فوق)
{const ph=PHONE.replace(/\D/g,"");const tp=document.getElementById("tph"),fb=document.getElementById("fab");
 if(tp)tp.textContent="📞 واتساب: 0"+ph.replace(/^20/,"");
 if(fb)fb.href="https://wa.me/"+ph+"?text="+encodeURIComponent("السلام عليكم، عندي استفسار بخصوص الوظايف");}
let JOBS=[],cat="شباب",area="الكل";   // <<< غيّر هنا: الفئة الافتتاحية (شباب أو بنات)
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function parseRows(t){const r=[];let row=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];
 if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
 else if(c=='"')q=true;else if(c==","){row.push(f);f=""}
 else if(c=="\n"){row.push(f);r.push(row);row=[];f=""}else if(c!="\r")f+=c}
 if(f||row.length){row.push(f);r.push(row)}
 return r}
function parseCSV(t){const r=parseRows(t);if(!r.length)throw 0;const h=r[0].map(x=>x.trim());return r.slice(1).filter(x=>x.some(v=>v.trim())).map(x=>Object.fromEntries(h.map((k,i)=>[k,(x[i]||"").trim()])))}

/* ===== ترتيب المناطق: مطابقة مرنة (بدر = مدينة بدر، 6اكتوبر = 6 أكتوبر) ===== */
let AREA_ORDER=[];
const norm=t=>String(t||"").replace(/[\u064B-\u0652\u0640]/g,"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d))
  .replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").trim().split(/\s+/)
  .filter(w=>w&&w!=="مدينه").map(w=>w.replace(/^ال/,"")).join("");
const sameArea=(a,b)=>{a=norm(a);b=norm(b);if(!a||!b)return false;return a===b||(a.length>=3&&b.length>=3&&(a.includes(b)||b.includes(a)))};
const areaRank=a=>{const i=AREA_ORDER.findIndex(x=>sameArea(x,a));return i<0?9999:i};

/* ===== تحميل الوظايف ===== */
async function getText(u,ms){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
  try{const r=await fetch(u,{signal:c.signal});if(!r.ok)throw 0;return await r.text()}finally{clearTimeout(t)}}
function showErr(){
  $("cnt").textContent="";$("clr").style.display="none";$("empty").style.display="none";$("seg").innerHTML="";$("area").innerHTML="";
  $("list").innerHTML='<div class="empty" style="display:block">😕 فيه مشكلة في تحميل الوظايف دلوقتي 🙏<br><button type="button" class="retry" id="retry">دوس هنا وجرّب تاني</button></div>';
  $("retry").onclick=load;
}
async function load(){
  $("list").innerHTML='<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
  // الطلبين بيتبعتوا مع بعض؛ طلب المناطق ليه مهلة قصيرة وميعطّلش الوظايف
  const [jr,ar]=await Promise.allSettled([getText(SHEET_CSV_URL,15000),getText(AREAS_CSV_URL,3000)]);
  if(jr.status!=="fulfilled")return showErr();
  let d;try{d=parseCSV(jr.value)}catch(e){return showErr()}
  if(d.length&&!("المصنع" in d[0]))return showErr();
  AREA_ORDER=[];
  if(ar.status==="fulfilled"){try{const rows=parseRows(ar.value);
    if(rows.length&&rows[0].length===1){const st=norm(rows[0][0])===norm("المنطقة")?1:0;   // لو التبويب مش موجود جوجل بترجّع شيت تاني بأعمدة كتير فبنتجاهله
      AREA_ORDER=rows.slice(st).map(x=>(x[0]||"").trim()).filter(Boolean)}}catch(e){}}
  JOBS=d.filter(j=>(j["ظاهر؟"]||"نعم").trim()!=="لا"&&j["المصنع"]);
  const jq=new URLSearchParams(location.search).get("j");
  if(jq){const k=JOBS.findIndex(x=>hid(x["المصنع"])===jq);history.replaceState(null,"",location.pathname+(k>-1?"#job"+k:""))}
  draw();route();
}
const kind=c=>c.includes("بنات")&&c.includes("شباب")?"":c.includes("بنات")?"g":"m";
const has=(c,k)=>c==="الكل"||c===k;
function matchCat(j){return cat==="الكل"||(j["الفئة"]||"").includes(cat)}

function draw(){
  const cats=["شباب","بنات"];   // <<< الفئات الظاهرة
  $("seg").innerHTML=cats.map(c=>`<button class="${c===cat?"on":""}" data-v="${c}">${c}</button>`).join("");
  $("seg").querySelectorAll("button").forEach(b=>b.onclick=()=>{cat=b.dataset.v;draw()});
  const seen=[...new Set(JOBS.filter(matchCat).map(j=>j["المنطقة"]).filter(Boolean))];
  const areas=["الكل",...seen.map((a,i)=>[a,i]).sort((x,y)=>(areaRank(x[0])-areaRank(y[0]))||(x[1]-y[1])).map(x=>x[0])];   // ترتيب تبويب المناطق، والباقي بعدهم بترتيب الشيت
  if(!areas.includes(area))area="الكل";
  $("area").innerHTML=areas.map(a=>`<button class="chip ${a===area?"on":""}" data-v="${esc(a)}">${esc(a)}</button>`).join("");
  $("area").querySelectorAll("button").forEach(b=>b.onclick=()=>{area=b.dataset.v;draw()});
  const q=$("q").value.trim();
  const r=JOBS.filter(j=>matchCat(j)&&(area==="الكل"||j["المنطقة"]===area)&&(!q||(j["المصنع"]+(j["المؤهل"]||"")).includes(q))).sort((x,y)=>rank(x)-rank(y));   // العاجل فوق والمكتمل تحت
  $("cnt").textContent=r.length?`${r.length} وظيفة متاحة`:"";
  $("clr").style.display=(area!=="الكل"||q)?"block":"none";
  $("empty").style.display=r.length?"none":"block";
  $("emt").textContent=JOBS.length?"مفيش وظايف زي كده، جرّب تغيّر الفلتر أو دوّر على حاجة تانية":"مفيش وظايف متاحة دلوقتي، ارجع كمان شوية";
  $("list").innerHTML=r.map(j=>`<button class="card ${done(j)?"done":""}" data-i="${JOBS.indexOf(j)}" ${done(j)?"disabled":""}>
   <div class="top"><span class="loc">📍 ${esc(j["المنطقة"])}</span><span class="bd2">${done(j)?'<span class="badge dn">العدد اكتمل</span>':tags(j)+`<span class="badge ${kind(j["الفئة"]||"")}">${esc(j["الفئة"])}</span>`}</span></div>
   <div class="ttl">${esc(j["المصنع"])}</div><div class="who">${esc(j["المؤهل"])}</div>
   <div class="pay">${esc(j["المرتب"])}</div>
   <div class="facts"><span>⏰ ${esc(j["الشفت"])}</span>${["السكن","المواصلات"].filter(k=>j[k]).map(k=>`<span>${ICON[k]} ${esc(j[k])}</span>`).join("")}</div>
   ${done(j)?"":'<span class="more">التفاصيل ‹</span>'}</button>`).join("");
  $("list").querySelectorAll(".card").forEach(b=>b.onclick=()=>go(+b.dataset.i));
}
$("clr").onclick=()=>{area="الكل";$("q").value="";draw()};
$("q").oninput=draw;

let came=false,sy=0;
function go(i){came=true;sy=window.scrollY;location.hash="job"+i}
function exitDetail(){if(came){came=false;history.back()}else{location.hash=""}}
function route(){
  let j=null;const m=location.hash.match(/^#job(\d+)$/),f=location.hash.match(/^#f=(.+)$/);
  if(m)j=JOBS[+m[1]];else if(f){try{const n=decodeURIComponent(f[1]);j=JOBS.find(x=>x["المصنع"]===n)}catch(e){}}   /* المكتمل مش بيفتح */
  if(j&&!done(j)){showDetail(j)}else{came=false;$("detail").style.display="none";$("main").style.display="";window.scrollTo(0,sy)}
}
/* ===== فورم التقديم (بيفتح لما يدوس قدم الآن) ===== */
function formHTML(j){return `<div class="ov" id="fo"><div class="sheet"><div class="grab"></div><div class="sb">
   <div class="sh"><h2 class="ttl" style="margin:.2rem 0 0">قدّم على ${esc(j["المصنع"])}</h2><button type="button" class="x" id="fx">✕</button></div>
   <label class="fl">الاسم ثلاثي<input id="f_n" autocomplete="name"></label><div class="er" id="e_n"></div>
   <label class="fl">السن<input id="f_a" inputmode="numeric" maxlength="2" autocomplete="off"></label><div class="er" id="e_a"></div>
   <label class="fl">منين؟<input id="f_p" autocomplete="off" placeholder="المحافظة / المنطقة"></label><div class="er" id="e_p"></div>
   <div class="fl">محتاج شغل بسكن؟<div class="yn" id="f_h"><button type="button" data-v="آه">آه</button><button type="button" data-v="لا">لا</button></div></div>
   <div class="er" id="e_h"></div></div>
   <div class="fgo"><button type="button" class="btn wa" id="fgo">دوس هنا وكمّل على الواتساب</button></div></div></div>`}
function setupApply(j,ph){
  const fo=$("fo"),en=$("f_n"),ea=$("f_a"),ep=$("f_p"),eh=$("e_h");let hs="";
  const errs={f_n:$("e_n"),f_a:$("e_a"),f_p:$("e_p")};
  const clearErr=()=>{[en,ea,ep].forEach(x=>x.classList.remove("bad"));Object.values(errs).forEach(e=>e.textContent="");eh.textContent=""};
  [en,ea,ep].forEach(x=>x.addEventListener("input",()=>{x.classList.remove("bad");errs[x.id].textContent=""}));
  try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||"{}");en.value=s.n||"";ea.value=s.a||"";ep.value=s.p||""}catch(e){}
  const close=()=>fo.classList.remove("show");
  $("apply").onclick=()=>{clearErr();fo.classList.add("show");setTimeout(()=>{(en.value?ea:en).focus()},250)};
  $("fx").onclick=close;fo.onclick=e=>{if(e.target===fo)close()};
  const yn=$("f_h").querySelectorAll("button");
  yn.forEach(b=>b.onclick=()=>{eh.textContent="";const was=b.classList.contains("on");yn.forEach(x=>x.classList.remove("on"));if(was){hs=""}else{b.classList.add("on");hs=b.dataset.v}});
  $("fgo").onclick=()=>{
    const n=en.value.trim().replace(/\s+/g," "),p=ep.value.trim(),
      a=ea.value.trim().replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));
    clearErr();
    const fail=(el,m)=>{el.classList.add("bad");errs[el.id].textContent=m;el.focus();el.scrollIntoView({block:"center",behavior:"smooth"})};
    // الاسم: لو إجباري أو اتكتب لازم يبقى ثلاثي (3 كلمات على الأقل)
    if((REQ.name||n)&&n.split(" ").filter(w=>w.length>=2).length<3)return fail(en,"الاسم ناقص، اكتب الاسم ثلاثي كامل");
    if((REQ.age||a)&&!/^\d{1,2}$/.test(a))return fail(ea,"اكتب السن بالأرقام");
    if(a&&(+a<AGE_MIN||+a>AGE_MAX))return fail(ea,"السن لازم يكون من "+AGE_MIN+" لـ "+AGE_MAX);
    if(REQ.from&&!p)return fail(ep,"اكتب منين انت");
    if(REQ.housing&&!hs){eh.textContent="اختار آه أو لا";return}
    try{localStorage.setItem(SAVE_KEY,JSON.stringify({n:n,a:a,p:p}))}catch(e){}
    const L=["السلام عليكم، عايز أقدم على وظيفة: "+j["المصنع"]+" - "+j["المنطقة"],""];
    if(n)L.push("الاسم: "+n);if(a)L.push("السن: "+a);if(p)L.push("منين: "+p);if(hs)L.push("محتاج سكن: "+hs);
    const u="https://wa.me/"+ph+"?text="+encodeURIComponent(L.join("\n"));
    close();window.open(u,"_blank")||(location.href=u);
  };
}
function showDetail(j){
  const ph=PHONE.replace(/\D/g,""),
   link=location.origin+location.pathname+"?j="+hid(j["المصنع"]),
   shareMsg=encodeURIComponent(`وظيفة: ${j["المصنع"]} - ${j["المنطقة"]}\n${j["المرتب"]||""}\n${link}`);
  // مربع: اسم الخانة فوق وقيمتها تحت. القيمة الطويلة ياخد صف كامل
  const it=k=>`<div class="it ${String(j[k]).length>26?"full":""}"><small>${ICON[k]||"•"} ${esc(k)}</small><b>${esc(j[k])}</b></div>`;
  // قسم: عنوان + مربعاته (بيتخطى الخانات الفاضية)
  const sec=(t,ks)=>{const r=ks.filter(k=>j[k]);return r.length?`<div class="sec"><h3>${t}</h3><div class="g2">${r.map(it).join("")}</div></div>`:""};
  // <<< غيّر هنا: ترتيب الأقسام وأي خانة تتحط في أنهي قسم
  const groups=[["الشغل",["الشفت","المؤهل","الأجازة"]],["الدفع والمميزات",["نظام القبض","السلف","التأمينات","وجبة"]],["السكن والمواصلات",["السكن","المواصلات"]]];
  const used=groups.flatMap(g=>g[1]);
  const other=Object.keys(j).filter(k=>!CORE.includes(k)&&!used.includes(k)&&j[k]);
  $("detail").innerHTML=`<div class="w dp"><div class="tb"><button class="exit" id="ex">رجوع</button></div>
   <div class="top"><span class="loc">📍 ${esc(j["المنطقة"])}</span><span class="bd2">${tags(j)}<span class="badge ${kind(j["الفئة"]||"")}">${esc(j["الفئة"])}</span></span></div>
   <h2 class="ttl">${esc(j["المصنع"])}</h2>
   <div class="hero"><small>💰 المرتب</small><b>${esc(j["المرتب"])}</b></div>
   ${groups.map(g=>sec(g[0],g[1])).join("")}${sec("تفاصيل أخرى",other)}</div>
   <div class="cta"><button type="button" class="btn wa" id="apply">قدّم دلوقتي على الواتساب</button><a class="btn" href="tel:+${ph}">📞 اتصل</a><a class="btn sh2" target="_blank" rel="noopener" href="https://wa.me/?text=${shareMsg}">↗ شارك</a></div>${formHTML(j)}`;
  $("main").style.display="none";$("detail").style.display="block";window.scrollTo(0,0);
  $("ex").onclick=exitDetail;setupApply(j,ph);
}
window.addEventListener("hashchange",route);
load();
</script>
