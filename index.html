.dc.capmode .dtp{overflow:visible;flex:none}
.dc.capmode .dtp[hidden]{display:block}
.dc.capmode .dth{display:block;margin-top:.4rem;font-size:.8rem;font-weight:800;border-bottom:2px solid #F3E7B3}

/* صفحة التفاصيل بنفس ألوان الموقع */
.dc{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.dc .dh{background:#0B1626;border-bottom:3px solid var(--gold)}
.dc .dr{color:var(--gold)}
.dc .dg{background:var(--gold);color:var(--goldD)}
.dc .dsb button{background:transparent;color:var(--gold);border-color:var(--gold)}
.dc .dsb button.on{background:var(--gold);color:var(--goldD)}
.dc .d2>div{background:#1F3858;border:1px solid var(--bd);color:#fff}
.dc .d2 small{color:var(--mu)}
.dc .thint{color:var(--mu);opacity:1}
.dc .dtabs button{background:#1F3858;color:var(--tx);border:1.5px solid var(--bd)}
.dc .dtabs button.on{background:var(--gold);border-color:var(--gold);color:var(--goldD)}
.dc .rw,.dc .ct{border-bottom-color:var(--bd)}
.dc .rw span{color:var(--mu);opacity:1}
.dc .rw b,.dc .nt,.dc .ct span,.dc .ct b{color:#fff}
.dc .cth{color:var(--gold)}
.dc .ct a{background:var(--gold);color:var(--goldD)}
.dc .dnote{background:var(--gold);color:var(--goldD)}
.dc.capmode .dth{color:var(--gold);border-bottom-color:var(--gold)}
.dcw .dbar{background:#0B1626;border:1px solid var(--bd);border-radius:.9rem;padding:.35rem}
.dcw .dbtn{background:transparent;color:var(--gold);border-color:var(--gold)}
.dcw .dbtn.wa{background:var(--wa);border-color:var(--wa);color:#fff}

/* الاسم والقيمة الاتنين واضحين */
.dc .rw{font-size:0.88rem}
.dc .rw span{color:#D5E2F2;opacity:1;font-weight:700}
.dc .rw b{color:#fff;font-weight:800}

/* مسافة تحت الشريط عشان ما يستخبّاش ورا زراير النظام */


/* قايمة ☰ جانبية */
.topb{position:relative;height:0;padding:0}
.hmb{font:inherit;font-size:1.15rem;line-height:1;background:var(--card);color:var(--gold,#6FA8E6);border:1px solid var(--bd);border-radius:.7rem;min-width:2.25rem;min-height:2.25rem;cursor:pointer;position:absolute;top:.55rem;inset-inline-start:0;z-index:3}
header{padding-inline:calc(var(--px) + 2.3rem)}

header h1{font-weight:800;color:#fff;font-size:clamp(1.25rem,5.4vw,1.5rem);text-shadow:0 2px 8px rgba(0,0,0,.8)}
header .sub.lead{color:#EEF4FB;font-weight:700;font-size:.92rem;text-shadow:0 1px 6px rgba(0,0,0,.85)}
header .sub.lead.free{color:#FFD35A;font-weight:800}
#mbk{position:fixed;inset:0;z-index:9998;background:rgba(5,10,24,.5);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
#mbk.on{opacity:1;visibility:visible}
#main{display:flex;flex-direction:column;padding-bottom:0;min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
#list{padding-bottom:1.2rem}
.ft,#mnu .mfx{display:flex;justify-content:center;align-items:center;gap:.8rem;box-sizing:border-box;background:var(--bg);border-top:1px solid var(--gold)}
.ft{height:2.6rem;padding:0 .75rem;flex:none;margin:auto calc(var(--px)*-1) 0}
#mnu .mfx{height:calc(2.6rem + env(safe-area-inset-bottom,0px));padding:0 .75rem env(safe-area-inset-bottom,0px)}
.sc{display:flex;align-items:center;justify-content:center;width:1.7rem;height:1.7rem;flex:none;border-radius:50%;text-decoration:none;overflow:hidden}
.sc.wa{background:#25D366}.sc.wa .ic{width:.9rem;height:.9rem}
.sc.fbk{background:#fff}.sc.fbk .ic{width:100%;height:100%}
#mnu{position:fixed;top:0;bottom:0;right:0;z-index:9999;width:min(15rem,74vw);background:var(--card);border-left:1px solid var(--bd);box-shadow:-8px 0 24px rgba(0,0,0,.35);transform:translateX(105%);visibility:hidden;transition:transform .25s ease,visibility .25s;padding:calc(.6rem + env(safe-area-inset-top,0px)) .6rem .6rem;display:flex;flex-direction:column;gap:.2rem;overflow-y:auto}
#mnu.on{transform:none;visibility:visible}
#mnu .mh{display:flex;align-items:center;justify-content:space-between;padding:.2rem .3rem .6rem;margin-bottom:.3rem;border-bottom:1px solid var(--bd);font-weight:800;font-size:.85rem;color:var(--gold,#6FA8E6)}
#mnu .mh button{font:inherit;width:2rem;height:2rem;border-radius:50%;border:1px solid var(--bd);background:transparent;color:var(--tx);cursor:pointer;font-size:.85rem}
#mnu .mi{display:flex;align-items:center;gap:.5rem;font:inherit;font-weight:700;font-size:.85rem;color:var(--tx);text-decoration:none;padding:.7rem .8rem;min-height:2.75rem;box-sizing:border-box;border-radius:.7rem}
#mnu .mi:active{background:var(--acs);color:var(--gold,#6FA8E6)}
#mnu .mi .lk{margin-right:auto;opacity:.6;font-size:.75rem}
#mnu>.mi:last-of-type{margin-bottom:.8rem}
#mnu .mfx{align-self:stretch;flex:none;margin:auto -.6rem -.6rem;background:var(--card)}
#mnu .ms{margin-top:.4rem;padding:.7rem .8rem .2rem;border-top:1px solid var(--bd);font-size:.7rem;font-weight:700;color:var(--tx);opacity:.6}

#xo{display:none;position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.55);align-items:center;justify-content:center;padding:1.2rem}
#xo.on{display:flex}
#xo .xb{background:#172B46;color:#E8EFF8;border:1px solid #28425F;border-radius:1rem;padding:1rem;width:100%;max-width:18rem;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.45)}
#xo .xb p{margin:0 0 .8rem;font-weight:800;font-size:.95rem;line-height:1.6}
#xo .xr{display:flex;flex-direction:column;gap:.5rem}
#xo .xr button{font:inherit;font-weight:800;font-size:.88rem;border:0;border-radius:.75rem;min-height:2.6rem;cursor:pointer}
#xo #xn{background:#E8B730;color:#2E2000}
#xo #xy{background:transparent;color:#E8EFF8;border:1.5px solid #E5120F}
#cfno{border:2px solid #E5120F!important;font-weight:900!important}

/* فورم العمال: صفحة كاملة بخط أصغر */
#fo .sb .sh .ttl{font-size:.92rem!important}
#fo .sb .fl{font-size:.76rem!important;margin-top:.7rem!important}
#fo .sb .fl input{font-size:14px!important;padding:.5rem .8rem!important}
#fo .yn button{font-size:.8rem!important;padding:.45rem 0!important}
#fo .fgo .btn{font-size:.88rem!important}
#fo .tnote,#fo .sb p,#fo .sb small{font-size:.72rem!important}

/* صفوف التفاصيل كجدول (ريسبونسيف) */
.dc{--cw:clamp(5.2rem,27vw,7.5rem);--fz:clamp(.76rem,3.3vw,.84rem);--pd:clamp(.55rem,2.4vw,.75rem)}
.dc .dth{margin:.2rem .1rem .5rem!important}

function parseRows(t){const r=[];let row=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];
 if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
 else if(c=='"')q=true;else if(c==","){row.push(f);f=""}
 else if(c=="\n"){row.push(f);r.push(row);row=[];f=""}else if(c!="\r")f+=c}
 if(f||row.length){row.push(f);r.push(row)}
 return r}
function parseCSV(t){const r=parseRows(t);if(!r.length)throw 0;const h=r[0].map(x=>x.trim());return r.slice(1).filter(x=>x.some(v=>v.trim())).map(x=>Object.fromEntries(h.map((k,i)=>[k,(x[i]||"").trim()])))}

  .replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").trim().split(/\s+/)
  .filter(w=>w&&w!=="مدينه").map(w=>w.replace(/^ال/,"")).join("");
const sameArea=(a,b)=>{a=norm(a);b=norm(b);if(!a||!b)return false;return a===b||(a.length>=3&&b.length>=3&&(a.includes(b)||b.includes(a)))};

function buildJobText(j) {
  // نص المشاركة يبدأ دائمًا باسم المصنع والمنطقة، ثم المرتب والوردية.
  let msg = `📍 المصنع: ${j["المصنع"] || "غير محدد"}\n📌 المنطقة: ${j["المنطقة"] || "غير محددة"}\n`;
  if(!isMulti(j) && j["الشفت"]) msg += `⏰ الشفت: ${hoursOnly(j["الشفت"])}\n`;
  msg += `💰 المرتب: ${payText(j) || "يراجع داخل التفاصيل"}\n`;

  // الحقول الأساسية التي كان النسخ يتجاوزها سابقًا.
  const fields = ["الفئة", "السن", "طبيعة العمل", "المؤهل", "الأجازة", "نظام القبض", "السلف", "التأمينات", "وجبة", "السكن", "المواصلات"];
  const added = new Set(["المصنع", "المنطقة", "الشفت", "المرتب", "مرتب 30 يوم", "مرتب 26 يوم", "الورديات", "العنوان", "أرقام التواصل", "__sh", "__contacts", "الفئة", "السن", "طبيعة العمل", "المؤهل", "الأجازة", "نظام القبض", "السلف", "التأمينات", "وجبة", "السكن", "المواصلات", "تفاصيل المرتب", "ملاحظات", "تثبيت", "الترتيب", "آخر تعديل", "ظاهر؟", "الحالة", "تاريخ الإضافة", "قبض يومي"]);
  for (const k of fields) {
    if (!j[k]) continue;
    msg += `${ICONS[k] || "•"} ${k}: ${j[k]}\n`;
  }
  if(daily(j)) msg += `💵 قبض يومي: بتقبض يوميتك بعد ما تخلّص الشغل\n`;
  if(j["تفاصيل المرتب"]) msg += `📝 تفاصيل المرتب: ${j["تفاصيل المرتب"]}\n`;
  if(j["ملاحظات"]) msg += `📝 ملاحظات: ${j["ملاحظات"]}\n`;

  // تضمين أي حقول إضافية موجودة في الشيت بدل إسقاطها من النص المنسوخ.
  Object.keys(j).forEach(k => {
    if (added.has(k) || !j[k] || k.startsWith("__")) return;
    msg += `${ICONS[k] || "•"} ${k}: ${j[k]}\n`;
  });

  if(cleanAddr(j["العنوان"])) msg += `📍 العنوان: ${cleanAddr(j["العنوان"])}\n`;
  if(j.__contacts && j.__contacts.length) {
    msg += `📞 أرقام التواصل عند الوصول:\n`;
    j.__contacts.forEach(c => { msg += `  • ${c.name ? c.name + ": " : ""}${c.phone}\n`; });
  }
  msg += `⏰ التقديم واستلام الشغل في نفس اليوم\n`;
  return msg.trim();
}

function ageRange(txt){
  const t=String(txt||"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));
  const n=(t.match(/\d{1,2}/g)||[]).map(Number);
  if(!n.length)return null;
  if(n.length>=2)return{min:Math.min(n[0],n[1]),max:Math.max(n[0],n[1])};
  if(/لحد|حتى|لغاية|إلى|الى|أقل|اقل/.test(t))return{min:0,max:n[0]};
  if(/فوق|أكتر|اكتر|أكثر|\+|من/.test(t))return{min:n[0],max:0};
  return null;
}
function ageMsg(j,a){
  const r=ageRange(j["السن"]);if(!r||!a)return "";
  const rt=r.min&&r.max?"من "+r.min+" لـ "+r.max+" سنة":r.min?r.min+" سنة فأكتر":"لحد "+r.max+" سنة";
  if(r.min&&a<r.min)return "سنك غير مسموح، السن المطلوب "+rt;
  if(r.max&&a>r.max)return "سنك أكبر من المسموح، السن المطلوب "+rt;
  return "";
}

function loadH2C(){return new Promise((ok,no)=>{if(window.html2canvas)return ok();const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function saveJobAsImage(j, captureElem) {
  try {
    await loadH2C();
    const actionsBar = captureElem.querySelector('.cta');
    if(actionsBar) actionsBar.style.display = 'none';
    captureElem.classList.add('capmode');

    const canvas = await html2canvas(captureElem, {
      scale: 2,
      useCORS: true,
      allowTaint: true,
      backgroundColor: "#0F1C2E"
    });
    
    if(actionsBar) actionsBar.style.display = 'flex';
    captureElem.classList.remove('capmode');

    canvas.toBlob((blob) => {
      if (!blob) return;
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${j["المصنع"]} - ${j["المنطقة"]}.png`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      alert("🖼️ تم حفظ صورة تفاصيل المصنع في جهازك بنجاح!");
    }, 'image/png');
  } catch (e) {
    const actionsBar = captureElem.querySelector('.cta');
    if(actionsBar) actionsBar.style.display = 'flex';
    captureElem.classList.remove('capmode');
    alert("حدث خطأ أثناء حفظ الصورة، جرّب 'نسخ كنص' من زرار شارك.");
  }
}
