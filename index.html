<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>وظائف المصانع</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f6f5;--card:#fff;--tx:#14201a;--mu:#6b7a72;--bd:#e3e8e5;--ac:#0f7a4a;--acs:#e3f4ec;--sh:0 1px 3px rgba(20,32,26,.07)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1311;--card:#171e1b;--tx:#eef3f0;--mu:#93a39a;--bd:#26302b;--ac:#34d399;--acs:#12281f;--sh:none}}
:root[data-theme="dark"]{--bg:#0e1311;--card:#171e1b;--tx:#eef3f0;--mu:#93a39a;--bd:#26302b;--ac:#34d399;--acs:#12281f;--sh:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.5}
.w{max-width:40rem;margin:auto;padding:0 1rem 3rem}
header{padding:1.2rem 0 .6rem}h1{font-size:1.5rem;font-weight:800;margin:0}.sub{color:var(--mu);margin:.1rem 0 0;font-size:.95rem}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:.5rem 0 .6rem}
.search{position:relative}.search span{position:absolute;inset-inline-start:.9rem;top:50%;transform:translateY(-50%);opacity:.6}
.search input{width:100%;font:inherit;font-size:16px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:1rem;padding:.8rem 2.6rem;box-shadow:var(--sh);outline:none}
.search input:focus{border-color:var(--ac)}
.seg{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:1rem;padding:.25rem;margin-top:.6rem}
.seg button{flex:1;font:inherit;font-weight:700;font-size:.95rem;border:0;background:none;color:var(--mu);padding:.55rem 0;border-radius:.75rem;cursor:pointer}
.seg button.on{background:var(--ac);color:#fff}
.chips{display:flex;gap:.5rem;overflow-x:auto;padding:.6rem 0 .1rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{font:inherit;font-size:.88rem;white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:.4rem .95rem;cursor:pointer}
.chip.on{background:var(--acs);border-color:var(--ac);color:var(--ac);font-weight:700}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--mu);font-size:.88rem;margin:.6rem 0 .5rem}
.meta button{font:inherit;color:var(--ac);background:none;border:0;font-weight:700;cursor:pointer}
.card{display:block;width:100%;text-align:start;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:1.2rem;padding:1rem 1.1rem;margin-bottom:.75rem;box-shadow:var(--sh);cursor:pointer;transition:transform .12s}
.card:active{transform:scale(.985)}
.top{display:flex;justify-content:space-between;align-items:center;gap:.5rem;font-size:.82rem}
.loc{color:var(--mu);font-weight:600}.badge{font-weight:700;border-radius:99px;padding:.1rem .65rem;background:var(--acs);color:var(--ac)}
.badge.g{background:#fde7f1;color:#be185d}.badge.m{background:#e0ecff;color:#1d4ed8}
@media (prefers-color-scheme:dark){.badge.g{background:#3a1626;color:#f9a8d4}.badge.m{background:#14243f;color:#93c5fd}}
.ttl{font-size:1.12rem;font-weight:800;margin:.35rem 0 .1rem}.who{color:var(--mu);font-size:.9rem}
.pay{font-size:1.15rem;font-weight:800;color:var(--ac);margin:.5rem 0 .2rem}
.facts{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.5rem}.facts span{font-size:.8rem;background:var(--bg);border-radius:.6rem;padding:.2rem .6rem;color:var(--mu)}
.more{display:block;text-align:end;color:var(--ac);font-weight:700;font-size:.85rem;margin-top:.5rem}
.sk{height:8.5rem;border-radius:1.2rem;background:linear-gradient(90deg,var(--card),var(--bd),var(--card));background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:.75rem}
@keyframes sk{to{background-position:-200% 0}}
.empty{text-align:center;color:var(--mu);padding:3rem 1rem;display:none}
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}@media(min-width:640px){.ov{align-items:center}}
.sheet{background:var(--bg);width:100%;max-width:30rem;max-height:92%;display:flex;flex-direction:column;border-radius:1.6rem 1.6rem 0 0;animation:up .22s ease-out}
@media(min-width:640px){.sheet{border-radius:1.6rem}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grab{width:2.6rem;height:.28rem;border-radius:9px;background:var(--bd);margin:.6rem auto .2rem}
.sb{overflow-y:auto;padding:.6rem 1.2rem 1rem}
.sh{display:flex;justify-content:space-between;gap:.5rem;align-items:flex-start}
.x{font:inherit;width:2.2rem;height:2.2rem;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;flex:none}
.hero{background:var(--acs);border-radius:1.1rem;padding:.9rem 1rem;margin:.8rem 0}.hero small{color:var(--mu)}.hero b{display:block;font-size:1.4rem;color:var(--ac);font-weight:800}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.it{background:var(--card);border:1px solid var(--bd);border-radius:1rem;padding:.65rem .8rem}.it.full{grid-column:1/-1}
.it small{display:block;color:var(--mu);font-size:.78rem}.it b{font-size:.95rem;font-weight:700}
.cta{padding:.8rem 1.2rem calc(.8rem + env(safe-area-inset-bottom,0px));border-top:1px solid var(--bd);background:var(--bg);display:grid;gap:.5rem;border-radius:0 0 0 0}
.btn{display:block;text-align:center;text-decoration:none;font:inherit;font-weight:800;border-radius:1rem;padding:.85rem;color:var(--tx);border:1px solid var(--bd);background:var(--card)}
.btn.wa{background:#16a34a;color:#fff;border:0;font-size:1.05rem}
</style>
</head>
<body>
<div class="w">
  <header><h1>وظائف المصانع</h1><p class="sub">اختار الوظيفة المناسبة وقدّم مباشرة</p></header>
  <div class="bar">
    <div class="search"><span>🔍</span><input id="q" type="search" placeholder="ابحث باسم المصنع أو الوظيفة"></div>
    <div id="seg" class="seg"></div>
    <div id="area" class="chips"></div>
  </div>
  <div class="meta"><span id="cnt"></span><button id="clr" style="display:none">مسح الفلاتر</button></div>
  <div id="list"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
  <div id="empty" class="empty">😕 مفيش وظايف مطابقة<br>جرّب تغيّر الفلتر أو البحث</div>
</div>
<div id="modal" class="ov"></div>
<script>
/* ===== إعدادات ===== */
const PHONE = "201095237207";   // رقم الواتساب بصيغة دولية بدون +
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1Ri61Py0q36t2EdMCWXa0lgJGDWJfrXjY0gHmqnwS4AM/gviz/tq?tqx=out:csv&headers=1&sheet=%D8%A7%D9%84%D9%88%D8%B8%D8%A7%D8%A6%D9%81";

/* بيانات تجريبية تظهر لو الشيت ما اتقراش */
const SAMPLE = [
{"المنطقة":"6 أكتوبر","الفئة":"بنات","المصنع":"مصنع أدوية (استيكر)","المؤهل":"نقاب عادي - مؤهلات","الشفت":"9 ساعات (8 ص : 5 م)","المرتب":"200 ج/يوماً","نظام القبض":"يومي / أسبوعي / شهري","السكن":"لا يوجد","السلف":"متاح بعد أسبوع","المواصلات":"خارجية (خطوط)","التأمينات":"بعد 3 شهور","الأجازة":"الجمعة","ظاهر؟":"نعم"},
{"المنطقة":"6 أكتوبر","الفئة":"شباب وبنات","المصنع":"مصنع أغذية (شيبسي)","المؤهل":"مؤهلات متوسطة وعليا","الشفت":"12 ساعة (شفتات متغيرة)","المرتب":"7000 ج شهرياً","نظام القبض":"شهري","السكن":"لا يوجد","السلف":"متاح","المواصلات":"داخلية","وجبة":"وجبة يومية","التأمينات":"من أول يوم","الأجازة":"يوم أسبوعياً","ظاهر؟":"نعم"},
{"المنطقة":"مدينة السادات","الفئة":"شباب","المصنع":"مصنع غزل ونسيج","المؤهل":"عمال إنتاج","الشفت":"12 ساعة","المرتب":"6500 ج شهرياً","نظام القبض":"شهري","السكن":"متوفر (مجاناً)","السلف":"متاح","المواصلات":"داخلية","التأمينات":"بعد شهر","الأجازة":"الجمعة","ظاهر؟":"نعم"},
{"المنطقة":"العاشر من رمضان","الفئة":"شباب","المصنع":"مصنع بلاستيك","المؤهل":"أي مؤهل - لياقة بدنية","الشفت":"12 ساعة (ليلي / نهاري)","المرتب":"6800 ج شهرياً","نظام القبض":"أسبوعي","السكن":"متوفر بخصم 300 ج","السلف":"متاح بعد شهر","المواصلات":"خارجية","وجبة":"وجبة","التأمينات":"بعد 3 شهور","ظاهر؟":"نعم"},
{"المنطقة":"العاشر من رمضان","الفئة":"بنات","المصنع":"مصنع ملابس جاهزة","المؤهل":"خبرة مش شرط","الشفت":"9 ساعات (8 ص : 5 م)","المرتب":"190 ج/يوماً","نظام القبض":"أسبوعي","السكن":"سكن بنات متوفر","السلف":"متاح","المواصلات":"داخلية","الأجازة":"الجمعة","ظاهر؟":"نعم"},
{"المنطقة":"بدر","الفئة":"بنات","المصنع":"مصنع منظفات","المؤهل":"نقاب عادي - مؤهلات","الشفت":"8 ساعات","المرتب":"185 ج/يوماً","نظام القبض":"يومي","السكن":"لا يوجد","السلف":"غير متاح","المواصلات":"خارجية (خطوط)","الأجازة":"الجمعة","ظاهر؟":"نعم"},
{"المنطقة":"بدر","الفئة":"شباب","المصنع":"مصنع ألومنيوم","المؤهل":"عمال إنتاج","الشفت":"12 ساعة","المرتب":"7500 ج شهرياً","نظام القبض":"شهري","السكن":"متوفر","السلف":"متاح","المواصلات":"داخلية","وجبة":"وجبتين","التأمينات":"من أول يوم","ظاهر؟":"نعم"},
{"المنطقة":"6 أكتوبر","الفئة":"بنات","المصنع":"مصنع لانشون","المؤهل":"مؤهلات - بدون نقاب","الشفت":"9 ساعات","المرتب":"195 ج/يوماً","نظام القبض":"أسبوعي","السكن":"لا يوجد","السلف":"متاح","المواصلات":"خارجية","الأجازة":"الجمعة","ظاهر؟":"نعم"},
{"المنطقة":"مدينة السادات","الفئة":"بنات","المصنع":"مصنع سايلو","المؤهل":"مؤهلات","الشفت":"8 ساعات","المرتب":"180 ج/يوماً","نظام القبض":"أسبوعي","السكن":"لا يوجد","السلف":"متاح","المواصلات":"خارجية","ظاهر؟":"نعم"},
{"المنطقة":"العبور","الفئة":"شباب وبنات","المصنع":"مصنع تعبئة وتغليف","المؤهل":"أي مؤهل","الشفت":"10 ساعات","المرتب":"6200 ج شهرياً","نظام القبض":"شهري","السكن":"لا يوجد","السلف":"متاح","المواصلات":"خارجية","وجبة":"وجبة","التأمينات":"بعد 3 شهور","ظاهر؟":"نعم"},
{"المنطقة":"العبور","الفئة":"شباب","المصنع":"مصنع ثلاجات وتبريد","المؤهل":"دبلوم صنايع","الشفت":"12 ساعة","المرتب":"8000 ج شهرياً","نظام القبض":"شهري","السكن":"متوفر","السلف":"متاح","المواصلات":"داخلية","التأمينات":"من أول يوم","ظاهر؟":"نعم"},
{"المنطقة":"6 أكتوبر","الفئة":"شباب","المصنع":"مصنع قديم (مخفي للتجربة)","المؤهل":"-","الشفت":"-","المرتب":"-","ظاهر؟":"لا"}
];

const CORE=["المنطقة","الفئة","المصنع","المؤهل","الشفت","المرتب","ظاهر؟"];
const ICON={"نظام القبض":"💰","السكن":"🏠","السلف":"💵","المواصلات":"🚌","وجبة":"🍽️","التأمينات":"🛡️","الأجازة":"📅"};
let JOBS=[],cat="الكل",area="الكل";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function parseCSV(t){const r=[];let row=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];
 if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
 else if(c=='"')q=true;else if(c==","){row.push(f);f=""}
 else if(c=="\n"){row.push(f);r.push(row);row=[];f=""}else if(c!="\r")f+=c}
 if(f||row.length){row.push(f);r.push(row)}
 const h=r[0].map(x=>x.trim());return r.slice(1).filter(x=>x.some(v=>v.trim())).map(x=>Object.fromEntries(h.map((k,i)=>[k,(x[i]||"").trim()])))}

async function load(){
  let d=SAMPLE;
  if(SHEET_CSV_URL){try{const r=await fetch(SHEET_CSV_URL);if(r.ok)d=parseCSV(await r.text())}catch(e){}}
  JOBS=d.filter(j=>(j["ظاهر؟"]||"نعم").trim()!=="لا"&&j["المصنع"]);
  draw();
}
const kind=c=>c.includes("بنات")&&c.includes("شباب")?"":c.includes("بنات")?"g":"m";
const has=(c,k)=>c==="الكل"||c===k;
function matchCat(j){return cat==="الكل"||(j["الفئة"]||"").includes(cat)}

function draw(){
  const cats=["الكل","بنات","شباب"];
  $("seg").innerHTML=cats.map(c=>`<button class="${c===cat?"on":""}" data-v="${c}">${c}</button>`).join("");
  $("seg").querySelectorAll("button").forEach(b=>b.onclick=()=>{cat=b.dataset.v;draw()});
  const areas=["الكل",...new Set(JOBS.filter(matchCat).map(j=>j["المنطقة"]).filter(Boolean))];
  if(!areas.includes(area))area="الكل";
  $("area").innerHTML=areas.map(a=>`<button class="chip ${a===area?"on":""}" data-v="${esc(a)}">${esc(a)}</button>`).join("");
  $("area").querySelectorAll("button").forEach(b=>b.onclick=()=>{area=b.dataset.v;draw()});
  const q=$("q").value.trim();
  const r=JOBS.filter(j=>matchCat(j)&&(area==="الكل"||j["المنطقة"]===area)&&(!q||(j["المصنع"]+(j["المؤهل"]||"")).includes(q)));
  $("cnt").textContent=r.length?`${r.length} وظيفة متاحة`:"";
  $("clr").style.display=(cat!=="الكل"||area!=="الكل"||q)?"block":"none";
  $("empty").style.display=r.length?"none":"block";
  $("list").innerHTML=r.map(j=>`<button class="card" data-i="${JOBS.indexOf(j)}">
   <div class="top"><span class="loc">📍 ${esc(j["المنطقة"])}</span><span class="badge ${kind(j["الفئة"]||"")}">${esc(j["الفئة"])}</span></div>
   <div class="ttl">${esc(j["المصنع"])}</div><div class="who">${esc(j["المؤهل"])}</div>
   <div class="pay">${esc(j["المرتب"])}</div>
   <div class="facts"><span>⏰ ${esc(j["الشفت"])}</span>${["السكن","المواصلات"].filter(k=>j[k]).map(k=>`<span>${ICON[k]} ${esc(j[k])}</span>`).join("")}</div>
   <span class="more">التفاصيل ‹</span></button>`).join("");
  $("list").querySelectorAll(".card").forEach(b=>b.onclick=()=>open(JOBS[+b.dataset.i]));
}
$("clr").onclick=()=>{cat="الكل";area="الكل";$("q").value="";draw()};
$("q").oninput=draw;

function open(j){
  const ph=PHONE.replace(/\D/g,""),msg=encodeURIComponent(`السلام عليكم، عايز أقدم على وظيفة: ${j["المصنع"]} - ${j["المنطقة"]}`);
  const extra=Object.keys(j).filter(k=>!CORE.includes(k)&&j[k]);
  const it=(k,v,full)=>`<div class="it ${full?"full":""}"><small>${ICON[k]||"•"} ${esc(k)}</small><b>${esc(v)}</b></div>`;
  $("modal").innerHTML=`<div class="sheet"><div class="grab"></div><div class="sb">
   <div class="sh"><div><div class="top"><span class="loc">📍 ${esc(j["المنطقة"])}</span><span class="badge ${kind(j["الفئة"]||"")}">${esc(j["الفئة"])}</span></div><h2 class="ttl" style="font-size:1.3rem;margin:.3rem 0 0">${esc(j["المصنع"])}</h2></div><button class="x" id="x" aria-label="إغلاق">✕</button></div>
   <div class="hero"><small>المرتب</small><b>${esc(j["المرتب"])}</b></div>
   <div class="g2">${it("الشفت",j["الشفت"],false).replace("•","⏰")}${it("المؤهل",j["المؤهل"],false).replace("•","🎓")}${extra.map(k=>it(k,j[k],j[k].length>22)).join("")}</div>
  </div>
  <div class="cta"><a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${ph}?text=${msg}">قدم الآن عبر الواتساب</a><a class="btn" href="tel:+${ph}">📞 اتصل بنا</a></div></div>`;
  $("modal").classList.add("show");document.body.style.overflow="hidden";
  $("x").onclick=close;
}
function close(){$("modal").classList.remove("show");document.body.style.overflow=""}
$("modal").onclick=e=>{if(e.target===$("modal"))close()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
load();
</script>
</body>
</html>
