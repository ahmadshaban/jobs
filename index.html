<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
/* <<< غيّر هنا: الألوان */--bg:#2859A8;--card:#F0F3F7;--tx:#202938;--mu:#566579;--bd:#D6DFEB;--ac:#2859A8;--acs:#D5E3FA;--sh:0 3px 10px rgba(10,25,55,.12)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.5}
.w{max-width:40rem;margin:auto;padding:0 1rem 3rem}
header{padding:.65rem 0 .55rem;position:static;background:var(--bg)}  /* <<< الجزء اللي فوق (العنوان) بيتحرك مع الصفحة. عايز تثبّته؟ غيّر static لـ sticky */h1{font-size:1.55rem;font-weight:800;margin:0;line-height:1.3}.sub{color:var(--mu);margin:.1rem 0 0;font-size:.95rem}.lead{margin:0 0 .15rem;font-size:.92rem}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:7;background:var(--bg);padding:.25rem 0 .35rem;box-shadow:0 4px 8px -4px rgba(10,25,55,.18)}  /* <<< الفلتر هو الوحيد المثبّت فوق */
.search{position:relative}.search span{position:absolute;inset-inline-start:.7rem;font-size:.85rem;top:50%;transform:translateY(-50%);opacity:.6}
.search input{width:100%;font:inherit;font-size:16px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:.7rem;padding:.38rem 2.2rem;box-shadow:var(--sh);outline:none}  /* <<< غيّر هنا: حجم خانة البحث (padding أول رقم = الارتفاع) */
.search input:focus{border-color:var(--ac)}
.seg{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:1rem;padding:.25rem;margin-top:.6rem}
.seg button{flex:1;font:inherit;font-weight:700;font-size:.9rem;border:0;background:none;color:var(--mu);padding:.43rem 0;border-radius:.7rem;cursor:pointer;transition:background .15s,color .15s}
.seg button.on{background:var(--ac);color:#fff;box-shadow:0 2px 5px rgba(40,89,168,.18)}
.chips{display:flex;gap:.5rem;overflow-x:auto;padding:.6rem 0 .1rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{font:inherit;font-size:.82rem;white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:.32rem .78rem;cursor:pointer;transition:background .15s,color .15s}
.chip.on{background:var(--acs);border-color:var(--ac);color:var(--ac);font-weight:700}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--mu);font-size:.88rem;margin:.6rem 0 .5rem}
.meta button{font:inherit;color:var(--ac);background:none;border:0;font-weight:700;cursor:pointer}
.card{display:block;width:100%;text-align:start;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:.95rem;padding:clamp(.55rem,2.2vw,.7rem) clamp(.65rem,2.8vw,.85rem);margin-bottom:clamp(.35rem,1.5vw,.5rem);box-shadow:var(--sh);cursor:pointer;transition:transform .12s}
.card:active{transform:scale(.985)}
.top{display:flex;justify-content:space-between;align-items:center;gap:.4rem;font-size:clamp(.74rem,2.7vw,.8rem)}
.loc{color:var(--mu);font-weight:600}.badge{font-weight:700;border-radius:99px;padding:.1rem .65rem;background:var(--acs);color:var(--ac)}
.badge.g{background:#fde7f1;color:#be185d}.badge.m{background:#dff3f8;color:#0e7490}
.ttl{font-size:clamp(.92rem,3.6vw,1rem);font-weight:800;margin:.18rem 0 .03rem;line-height:1.35}.who{color:var(--mu);font-size:clamp(.76rem,2.8vw,.82rem)}
/* <<< غيّر هنا: شكل المرتب في الكروت */
.pay{display:block;width:fit-content;max-width:100%;font-size:clamp(1.16rem,4.4vw,1.28rem);font-weight:800;color:#202938;background:linear-gradient(135deg,#FFF4C9,#F3D982);border:1px solid #D8B75B;border-radius:.72rem;padding:.28rem .85rem;margin:.34rem 0 .12rem;line-height:1.35;box-shadow:0 2px 5px rgba(120,88,20,.10)}
/* <<< غيّر هنا: شكل خانتين المرتب (30 يوم / 26 يوم) في الكارت */
.pays{display:flex;flex-wrap:wrap;gap:.35rem;margin:.34rem 0 .12rem}.pays .pay{margin:0}.pay small{display:block;font-size:.66rem;font-weight:800;color:#66511D;line-height:1.2}
.pt{display:block;width:100%;text-align:center}.pt+.pt{margin-top:.4rem;padding-top:.4rem;border-top:1px dashed #C9A53A}.pt small{display:block}.pt b{display:block}
.facts{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.32rem}.facts span{font-size:clamp(.68rem,2.5vw,.73rem);background:#E5EEFC;border:1px solid #D1E0F7;border-radius:.55rem;padding:.14rem .46rem;color:#244A86}
.pm{color:var(--mu);font-size:.78rem;font-weight:700;margin:.1rem 0 0}.pm2{display:block;color:rgba(255,255,255,.88);font-size:.78rem;font-weight:700;margin-top:.1rem}
.more{display:block;text-align:end;color:var(--ac);font-weight:700;font-size:.8rem;margin-top:.35rem}
.sk{height:7.2rem;border-radius:1.2rem;background:linear-gradient(90deg,var(--card),var(--bd),var(--card));background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:.75rem}
@keyframes sk{to{background-position:-200% 0}}
.demo{background:#fef3c7;color:#92400e;border:1px solid #fcd34d;border-radius:.8rem;padding:.4rem .7rem;margin:.7rem 0 0;font-size:.82rem;font-weight:700;text-align:center}
.seg:empty,.chips:empty{display:none}
.empty{text-align:center;color:var(--mu);padding:3rem 1rem;display:none}
.retry{font:inherit;font-weight:800;color:#fff;background:var(--ac);border:0;border-radius:.8rem;padding:.65rem 1.2rem;margin-top:.9rem;cursor:pointer}
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}@media(min-width:640px){.ov{align-items:center}}
.sheet{background:var(--bg);width:100%;max-width:30rem;max-height:92%;display:flex;flex-direction:column;border-radius:1.6rem 1.6rem 0 0;animation:up .22s ease-out}
@media(min-width:640px){.sheet{border-radius:1.6rem}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grab{width:2.6rem;height:.26rem;border-radius:9px;background:var(--bd);margin:.45rem auto .1rem}
.sb{overflow-y:auto;padding:.3rem 1.1rem .7rem}
.sh{display:flex;justify-content:space-between;gap:.5rem;align-items:flex-start}
.x{font:inherit;width:2.2rem;height:2.2rem;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;flex:none}
/* <<< غيّر هنا: كارت المرتب في صفحة المصنع */
.hero{position:sticky;top:calc(3.2rem + env(safe-area-inset-top,0px));z-index:6;background:linear-gradient(135deg,#FFF4C9,#F3D982);border:1px solid #D8B75B;color:#202938;border-radius:.78rem;padding:.34rem .65rem;margin:.3rem 0 .48rem;box-shadow:0 3px 9px rgba(10,25,55,.13);text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:3.65rem}.hero small{color:#66511D;font-size:.68rem;font-weight:800}.hero b{display:block;width:100%;text-align:center;font-size:clamp(1.02rem,4vw,1.22rem);color:#202938;font-weight:800;line-height:1.25}.hero .pm2{color:#4D421F;font-size:.68rem;margin-top:.05rem;text-align:center}
/* ===== [CSS] أقسام التفاصيل (غيّر عدد الأعمدة من repeat(2,1fr)) ===== */
.sec{background:var(--card);border:1px solid var(--bd);border-radius:1rem;padding:.6rem .65rem .65rem;margin-top:.5rem;box-shadow:var(--sh)}
.sec h3{margin:0 0 .4rem;font-size:.8rem;font-weight:800;color:var(--ac)}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:.4rem}
.it{background:var(--bg);border-radius:.7rem;padding:.4rem .55rem;display:flex;flex-direction:column;gap:.1rem}
.it.full{grid-column:1/-1}
.it small{color:var(--mu);font-size:.68rem;line-height:1.2}
.it b{font-size:.85rem;font-weight:700;line-height:1.3}
.card.done{opacity:.55;cursor:default;pointer-events:none;filter:grayscale(.4)}
/* ===== [CSS] سطر الثقة + ملاحظة التقديم + زرار الاستفسار ===== */
.trust{display:flex;flex-wrap:wrap;gap:.35rem .5rem;margin-top:.55rem}
.trust span{font-size:.78rem;font-weight:700;background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:99px;padding:.2rem .7rem}
.note{text-align:center;color:var(--mu);font-size:.76rem;margin:.8rem .5rem 0}
.fab{position:fixed;left:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:6;text-decoration:none;font-weight:800;font-size:.9rem;color:#fff;background:#16a34a;border-radius:99px;padding:.65rem 1.05rem;box-shadow:0 4px 14px rgba(22,163,74,.35)}
.badge.dn{background:#fee2e2;color:#b91c1c}
.badge.ur{background:#ffedd5;color:#c2410c}.badge.nw{background:#dcfce7;color:#15803d}
.bd2{display:flex;gap:.3rem;align-items:center}
.btn.sh2{flex:0 0 auto;padding:.22rem .65rem}
/* <<< غيّر هنا: حجم أزرار التقديم والاتصال والشير */
.cta{padding:.32rem .65rem calc(.32rem + env(safe-area-inset-bottom,0px));border-top:1px solid #C6D8F2;background:#DCE9FA;display:flex;gap:.35rem}
/* <<< غيّر هنا: حجم وألوان أزرار التقديم والاتصال والشير */
.btn{display:flex;align-items:center;justify-content:center;flex:1;min-height:1.95rem;text-align:center;text-decoration:none;font:inherit;font-weight:800;font-size:.73rem;border-radius:.62rem;padding:.18rem .28rem;color:#244A86;border:1px solid #AFC8EC;background:#F2F7FF;box-shadow:0 1px 3px rgba(36,74,134,.08)}
.btn.wa{flex:2;background:#159B50;color:#fff;border:0;font-size:.8rem;box-shadow:0 2px 7px rgba(22,163,74,.22)}
.tb{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:.7rem 0 .5rem}
.exit{font:inherit;font-weight:800;font-size:.95rem;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:.85rem;padding:.5rem 1rem;cursor:pointer}
.dp{padding-bottom:4.1rem;scroll-padding-top:4.5rem}.dp .ttl{font-size:1.3rem;margin:.4rem 0 0}
.cta{position:fixed;inset-inline:0;bottom:0;max-width:40rem;margin:auto}
.btn.wa{cursor:pointer}
/* ===== [CSS] فورم التقديم ===== */
.fl{display:block;font-weight:700;font-size:.85rem;margin-top:.75rem}
.fl input{display:block;width:100%;font:inherit;font-size:16px;font-weight:400;margin-top:.3rem;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:.8rem;padding:.7rem .85rem;outline:none}
.fl input:focus{border-color:var(--ac)}.fl input.bad{border-color:#dc2626}
.yn{display:flex;gap:.5rem;margin-top:.3rem}
.yn button{flex:1;font:inherit;font-weight:700;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:.8rem;padding:.65rem 0;cursor:pointer}
.yn button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.er{color:#b91c1c;font-size:.82rem;font-weight:700;margin-top:.25rem}.er:empty{display:none}
.fgo{padding:.6rem 1.1rem calc(.7rem + env(safe-area-inset-bottom,0px));border-top:1px solid var(--bd);background:var(--bg)}
.fgo .btn{width:100%;min-height:2.9rem;font-size:1rem;border:0}

/* تحسين كثافة كروت الوظائف في الشاشات الصغيرة فقط */
@media(max-width:380px){
  .w{padding-inline:.7rem}
  .card{padding:.5rem .6rem;border-radius:.85rem}
  .bd2{gap:.2rem}
  .badge{padding:.08rem .48rem}
  .pm{font-size:.72rem}
}
@media(min-width:640px){
  .card{padding:.7rem .85rem;margin-bottom:.45rem}
}

/* ===== الهوية الجديدة: كحلي عميق وذهبي (التصميم 8) — <<< غيّر هنا: الألوان من :root ===== */
:root{--bg:#0E1A33;--card:#172645;--tx:#E8EEF9;--mu:#8FA2C8;--bd:#2A3C66;--ac:#F2C14E;--acs:#22355D;--sh:0 6px 16px rgba(0,0,0,.35);--gold:#F2C14E;--goldD:#2A1D00;--wa:#1FAF5A;--px:1rem}
@media(max-width:380px){:root{--px:.7rem}}
body{background:var(--bg);color:var(--tx)}
.w{padding-inline:var(--px)}
header{background:#0A1428;margin-inline:calc(var(--px)*-1);padding:.8rem var(--px);border-bottom:3px solid var(--gold);box-shadow:0 4px 12px rgba(0,0,0,.4)}
header h1{color:#FFFFFF;font-size:1.4rem}header .lead,header .sub{color:var(--mu)}
.trust span,.trust a{font-size:.78rem;font-weight:700;border-radius:99px;padding:.2rem .7rem;text-decoration:none}
.trust span{background:rgba(255,255,255,.08);color:#DCE4F5;border:1px solid rgba(255,255,255,.18)}
/* زرار الاستفسار: صغير جوه الهيدر (مش طافي فوق الكروت) */
.trust a.wap{background:var(--wa);color:#FFFFFF;border:0}
.bar,.tb{background:var(--bg)}
.meta{color:#B8C6E3}.meta button,.more{color:var(--gold)}
.search input,.seg,.chip,.sec,.x,.exit,.fl input,.yn button{background:#172645;color:var(--tx);border-color:var(--bd)}
.seg{box-shadow:none}.seg button{color:#B8C6E3}.seg button.on{background:var(--gold);color:var(--goldD);box-shadow:none}
.chip.on{background:var(--gold);border-color:var(--gold);color:var(--goldD)}
.yn button.on{background:var(--gold);border-color:var(--gold);color:var(--goldD)}
.badge{background:#22355D;color:#DCE4F5}.badge.g{background:#4A2340;color:#FFC2E0}.badge.m{background:#17407A;color:#BFD8FF}
.badge.ur{background:var(--gold);color:#3A2A00}.badge.nw{background:#1E5A3A;color:#B8F2D2}.badge.dn{background:#B3202F;color:#FFFFFF}
.loc{color:var(--mu)}.ttl{color:#FFFFFF}
.er{color:#FF8A8A}.fl input.bad{border-color:#FF8A8A}
/* الكارت من بره: ضلة وبوردر ومسافة بين الكروت */
.card{background:#172645;color:var(--tx);border:1px solid var(--bd);border-radius:1rem;padding:.8rem .9rem;margin-bottom:1rem;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.card .top{display:flex}
.card .ttl{font-size:clamp(1.05rem,4.2vw,1.2rem);margin:.15rem 0 .5rem}
.card .pay{width:100%;text-align:center;background:var(--gold);color:var(--goldD);border:0;border-radius:.75rem;font-size:clamp(1.35rem,5.6vw,1.7rem);padding:.45rem .7rem;margin:0 0 .5rem;box-shadow:none}
.fx{display:flex;gap:.4rem;margin-bottom:.45rem}
.fx div{flex:1;min-width:0;background:#22355D;border-radius:.6rem;padding:.3rem .25rem;text-align:center}
.fx small{display:block;font-size:.7rem;color:var(--mu);line-height:1.3}.fx b{display:block;font-size:.88rem;font-weight:700;line-height:1.35;color:#DCE4F5}
.tg{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.1rem}
.tg span{font-size:.78rem;background:#22355D;border-radius:.5rem;padding:.1rem .6rem;color:#DCE4F5}
.card .more{display:block;text-align:center;color:var(--gold);font-weight:800;font-size:.88rem;margin-top:.55rem;padding-top:.5rem;border-top:1px solid var(--bd)}
/* صفحة التفاصيل */
.sec{background:#172645;box-shadow:0 4px 12px rgba(0,0,0,.30)}.sec h3{color:var(--gold);font-size:.9rem}
.it{background:#22355D;border:1px solid var(--bd);color:var(--tx)}.it small{color:var(--mu)}.it b{color:#FFFFFF;white-space:pre-line}
.it.pay2{background:var(--gold);border:0;color:var(--goldD);align-items:center;text-align:center;padding:.55rem}
.it.pay2 small{color:#6B4E00}.it.pay2 b{font-size:1.35rem;font-weight:800;color:var(--goldD)}.it.pay2 .pm2{color:#4A3600;font-size:.78rem;font-weight:700;margin-top:.05rem}
.cta{background:#0A1428;border-top:1px solid var(--bd);box-shadow:0 -4px 12px rgba(0,0,0,.35)}
.btn{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.btn.wa{background:var(--wa);color:#FFFFFF;border:0;box-shadow:0 3px 10px rgba(31,175,90,.30)}
.demo{background:#172645;color:var(--tx);border-color:var(--bd)}.empty{color:#B8C6E3}.retry{background:var(--gold);color:var(--goldD)}
.note{color:var(--mu)}.fgo{background:var(--bg)}

.nt{display:block;margin-top:.4rem;font-size:.82rem;font-weight:700;line-height:1.55;text-align:start}
/* ===== جدول الورديات (غيّر الألوان من هنا) ===== */
.sht{width:100%;border-collapse:collapse;text-align:center;background:var(--gold);color:var(--goldD);border-radius:.6rem;overflow:hidden}
.sht th{font-size:.7rem;font-weight:800;padding:.3rem .2rem;border-bottom:1px solid rgba(42,29,0,.35)}
.sht td{font-size:.95rem;font-weight:800;padding:.38rem .2rem}.sht tr+tr td{border-top:1px dashed rgba(42,29,0,.3)}
</style>
</head>
<body>
<div class="w" id="main">
  <div id="demo" class="demo" style="display:none">⚠️ تجربة: دي بيانات وهمية، الشيت مش متاح من هنا</div>
  <header><!-- <<< غيّر هنا: الجملة (فوق) والعنوان (تحتها) --><p class="sub lead">قدّم من الموبايل في دقايق واختار الفرصة المناسبة ليك</p><h1>عمال تعبئة وتغليف وفرز</h1>
    <!-- <<< غيّر هنا: سطر الثقة (الجمل اللي تحت العنوان) -->
    <div class="trust"><span>✅ التقديم من غير أي رسوم مقدما</span><a id="fab" class="wap" target="_blank" rel="noopener">💬 اسأل على واتساب</a></div></header>
  <div class="bar">
    <div id="seg" class="seg"></div>
    <div id="area" class="chips"></div>
  </div>
  <div class="meta"><span id="cnt"></span><button id="clr" style="display:none">امسح الفلاتر</button></div>
  <div id="list"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
  <div id="empty" class="empty">😕 <span id="emt"></span></div>
</div>
<div id="detail" style="display:none"></div>
<script>
/* ===== إعدادات ===== */
// تبويب "المناطق" في الشيت: ترتيب الصفوف فيه = ترتيب أزرار المناطق في الموقع (غيّر الترتيب من الشيت نفسه)
const AREAS_CSV_URL="https://docs.google.com/spreadsheets/d/1Ri61Py0q36t2EdMCWXa0lgJGDWJfrXjY0gHmqnwS4AM/gviz/tq?tqx=out:csv&headers=1&sheet=%D8%A7%D9%84%D9%85%D9%86%D8%A7%D8%B7%D9%82";

function pays(j){const a=[];if(j[P30])a.push(["30 يوم عمل",j[P30]]);if(j[P26])a.push([OFF26,j[P26]]);return a}
// ===== الورديات: كل سطر في خانة "الورديات" = وردية. الشكل: 12 ساعة | 30 يوم: 9000 | 26 يوم: 8000 =====
const numOf=s=>{const t=String(s||"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/,/g,"");const m=t.match(/\d+(\.\d+)?/);return m?+m[0]:0};
function parseShifts(txt){return String(txt||"").split(/\n/).map(l=>l.trim()).filter(Boolean).map(l=>{const p=l.split("|").map(x=>x.trim());const s={h:p[0]||"",p30:"",p26:""};p.slice(1).forEach(x=>{const m=x.match(/^(30|26)\s*يوم\s*:\s*(.*)$/);if(m)s["p"+m[1]]=m[2].trim()});return s}).filter(s=>s.h||s.p30||s.p26)}
// أعلى مرتب في كل الورديات (للكارت من بره)
function topPay(a){let b="",v=0;a.forEach(s=>[s.p30,s.p26].forEach(x=>{const n=numOf(x);if(n>v){v=n;b=x}}));return b}
// وردية واحدة: بنحطها في الخانات القديمة عشان الشكل يفضل زي ما هو. أكتر من وردية: بنخبي القديم ونعرض الجدول
function prep(j){const a=parseShifts(j["الورديات"]);j.__sh=a;if(a.length===1){j["الشفت"]=a[0].h;j[P30]=a[0].p30;j[P26]=a[0].p26}else if(a.length>1){j["الشفت"]="";j[P30]="";j[P26]="";j["المرتب"]=""}return j}
const isMulti=j=>!!(j.__sh&&j.__sh.length>1);
function payText(j){if(isMulti(j))return j.__sh.map(s=>s.h+": "+[s.p30&&"30 يوم "+s.p30,s.p26&&"26 يوم "+s.p26].filter(Boolean).join(" / ")).join(" | ");const a=pays(j);return a.length?a.map(x=>x[0]+": "+x[1]).join(" | "):(j["المرتب"]||"")}

function parseRows(t){const r=[];let row=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];
 if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
 else if(c=='"')q=true;else if(c==","){row.push(f);f=""}
 else if(c=="\n"){row.push(f);r.push(row);row=[];f=""}else if(c!="\r")f+=c}
 if(f||row.length){row.push(f);r.push(row)}
 return r}
function parseCSV(t){const r=parseRows(t);if(!r.length)throw 0;const h=r[0].map(x=>x.trim());return r.slice(1).filter(x=>x.some(v=>v.trim())).map(x=>Object.fromEntries(h.map((k,i)=>[k,(x[i]||"").trim()])))}

/* ===== ترتيب المناطق: مطابقة مرنة (بدر = مدينة بدر، 6اكتوبر = 6 أكتوبر) ===== */
let AREA_ORDER=[];
const norm=t=>String(t||"").replace(/[\u064B-\u0652\u0640]/g,"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d))
  .replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").trim().split(/\s+/)
  .filter(w=>w&&w!=="مدينه").map(w=>w.replace(/^ال/,"")).join("");
const sameArea=(a,b)=>{a=norm(a);b=norm(b);if(!a||!b)return false;return a===b||(a.length>=3&&b.length>=3&&(a.includes(b)||b.includes(a)))};
const areaRank=a=>{const i=AREA_ORDER.findIndex(x=>sameArea(x,a));return i<0?9999:i};

}

      a=ea.value.trim().replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));
    clearErr();
    const fail=(el,m)=>{el.classList.add("bad");errs[el.id].textContent=m;el.focus();el.scrollIntoView({block:"center",behavior:"smooth"})};
    // الاسم: لو إجباري أو اتكتب لازم يبقى ثلاثي (3 كلمات على الأقل)
    if((REQ.name||n)&&n.split(" ").filter(w=>w.length>=2).length<3)return fail(en,"الاسم ناقص، اكتب الاسم ثلاثي كامل");
    if((REQ.age||a)&&!/^\d{1,2}$/.test(a))return fail(ea,"اكتب السن بالأرقام");
    if(a&&(+a<AGE_MIN||+a>AGE_MAX))return fail(ea,"السن لازم يكون من "+AGE_MIN+" لـ "+AGE_MAX);
    if(REQ.from&&!p)return fail(ep,"اكتب منين انت");
    if(REQ.housing&&!hs){eh.textContent="اختار آه أو لا";return}
    try{localStorage.setItem(SAVE_KEY,JSON.stringify({n:n,a:a,p:p}))}catch(e){}
    const L=["السلام عليكم، عايز أقدم على وظيفة: "+j["المصنع"]+" - "+j["المنطقة"],""];
    if(n)L.push("الاسم: "+n);if(a)L.push("السن: "+a);if(p)L.push("منين: "+p);if(hs)L.push("محتاج سكن: "+hs);if(SRC)L.push("المصدر: "+SRC);
    const u="https://wa.me/"+ph+"?text="+encodeURIComponent(L.join("\n"));
    close();window.open(u,"_blank")||(location.href=u);
  };
}
function showDetail(j){
  const ph=PHONE.replace(/\D/g,""),
   link=location.origin+location.pathname+"?j="+hid(j["المصنع"]),
   shareMsg=encodeURIComponent(`وظيفة: ${j["المصنع"]} - ${j["المنطقة"]}\n${payText(j)}\n${link}`);
  // مربع: اسم الخانة فوق وقيمتها تحت. القيمة الطويلة ياخد صف كامل
  const it=k=>`<div class="it ${(k==="طبيعة العمل"||String(j[k]).length>26)?"full":""}"><small>${ICON[k]||"•"} ${esc(k)}</small><b>${esc(j[k])}</b></div>`;
  // قسم: عنوان + مربعاته (بيتخطى الخانات الفاضية)
  const sec=(t,ks,pre)=>{const r=ks.filter(k=>j[k]);return (r.length||pre)?`<div class="sec"><h3>${t}</h3><div class="g2">${pre||""}${r.map(it).join("")}</div></div>`:""};
  // المرتب أول مربع جوه "الأساسيات"
  const pp=pays(j);
  // ملاحظات المرتب (من خانة "تفاصيل المرتب" في الشيت): بتظهر تحت المرتب أو تحت جدول الورديات، ولو فاضية مش بتظهر
  const noteHTML=j["تفاصيل المرتب"]?`<span class="pm2 nt">📝 ملاحظات: ${esc(j["تفاصيل المرتب"])}</span>`:"";
  const cell=x=>x?esc(String(x).replace(/\s*في الشهر/,"")):"—";
  const tbl=isMulti(j)?`<div class="it pay2 full"><table class="sht"><tr><th>⏰ الوردية</th><th>30 يوم</th><th>26 يوم + 4 إجازة</th></tr>${j.__sh.map(s=>`<tr><td>${esc(s.h)}</td><td>${cell(s.p30)}</td><td>${cell(s.p26)}</td></tr>`).join("")}</table>${noteHTML}</div>`:"";
  const payTile0=`<div class="it pay2 full">${pp.length?pp.map(x=>`<div class="pt"><small>💰 ${esc(x[0])}</small><b>${esc(x[1])}</b></div>`).join(""):`<small>💰 المرتب</small><b>${esc(j["المرتب"]||"")}</b>`}${noteHTML}</div>`;
  const payTile=isMulti(j)?tbl:payTile0;
  // <<< غيّر هنا: ترتيب الأقسام وأي خانة تتحط في أنهي قسم
  const groups=[["الأساسيات",["السن","الشفت","طبيعة العمل","المؤهل","الأجازة"],payTile],["المرتب والمميزات",["نظام القبض","السلف","التأمينات","وجبة"]],["السكن والمواصلات",["السكن","المواصلات"]]];
  const used=groups.flatMap(g=>g[1]);
  const other=Object.keys(j).filter(k=>!k.startsWith("__")&&!CORE.includes(k)&&!used.includes(k)&&j[k]);
  $("detail").innerHTML=`<div class="w dp"><div class="tb"><button class="exit" id="ex">رجوع</button></div>
   <div class="top"><span class="loc">📍 ${esc(j["المنطقة"])}</span><span class="bd2">${tags(j)}<span class="badge ${kind(j["الفئة"]||"")}">${esc(j["الفئة"])}</span></span></div>
   <h2 class="ttl">${esc(j["المصنع"])}</h2>
   ${groups.map(g=>sec(g[0],g[1],g[2])).join("")}${sec("حاجات تانية",other)}</div>
   <div class="cta"><button type="button" class="btn wa" id="apply">قدّم دلوقتي على الواتساب</button><a class="btn" href="tel:+${ph}">📞 اتصل</a><a class="btn sh2" target="_blank" rel="noopener" href="https://wa.me/?text=${shareMsg}">↗ شارك</a></div>${formHTML(j)}`;
  $("main").style.display="none";$("detail").style.display="block";window.scrollTo(0,0);
  $("ex").onclick=exitDetail;setupApply(j,ph);
}
window.addEventListener("hashchange",route);
load();
