  if(j["أرقام التواصل"]) {

function parseCSV(t){const r=parseRows(t);if(!r.length)throw 0;const h=r[0].map(x=>x.trim());return r.slice(1).filter(x=>x.some(v=>v.trim())).map(x=>Object.fromEntries(h.map((k,i)=>[k,(x[i]||"").trim()])))}

  .filter(w=>w&&w!=="مدينه").map(w=>w.replace(/^ال/,"")).join("");
const sameArea=(a,b)=>{a=norm(a);b=norm(b);if(!a||!b)return false;return a===b||(a.length>=3&&b.length>=3&&(a.includes(b)||b.includes(a)))};

function buildJobText(j) {
  // نص المشاركة يبدأ دائمًا باسم المصنع والمنطقة، ثم المرتب والوردية.
  let msg = `📍 المصنع: ${j["المصنع"] || "غير محدد"}\n📌 المنطقة: ${j["المنطقة"] || "غير محددة"}\n`;
  if(!isMulti(j) && j["الشفت"]) msg += `⏰ الشفت: ${hoursOnly(j["الشفت"])}\n`;
  msg += `💰 المرتب: ${payText(j) || "يراجع داخل التفاصيل"}\n`;

  // الحقول الأساسية التي كان النسخ يتجاوزها سابقًا.
  const fields = ["الفئة", "السن", "طبيعة العمل", "المؤهل", "الأجازة", "نظام القبض", "السلف", "التأمينات", "وجبة", "السكن", "المواصلات"];
  const added = new Set(["المصنع", "المنطقة", "الشفت", "المرتب", "مرتب 30 يوم", "مرتب 26 يوم", "الورديات", "العنوان", "أرقام التواصل", "__sh", "__contacts", "الفئة", "السن", "طبيعة العمل", "المؤهل", "الأجازة", "نظام القبض", "السلف", "التأمينات", "وجبة", "السكن", "المواصلات", "تفاصيل المرتب", "ملاحظات", "تثبيت", "الترتيب", "آخر تعديل", "ظاهر؟", "الحالة", "تاريخ الإضافة", "قبض يومي"]);
  for (const k of fields) {
    if (!j[k]) continue;
    msg += `${ICONS[k] || "•"} ${k}: ${j[k]}\n`;
  }
  if(daily(j)) msg += `💵 قبض يومي: بتقبض يوميتك بعد ما تخلّص الشغل\n`;
  if(j["تفاصيل المرتب"]) msg += `📝 تفاصيل المرتب: ${j["تفاصيل المرتب"]}\n`;
  if(j["ملاحظات"]) msg += `📝 ملاحظات: ${j["ملاحظات"]}\n`;

  // تضمين أي حقول إضافية موجودة في الشيت بدل إسقاطها من النص المنسوخ.
  Object.keys(j).forEach(k => {
    if (added.has(k) || !j[k] || k.startsWith("__")) return;
    msg += `${ICONS[k] || "•"} ${k}: ${j[k]}\n`;
  });

  if(cleanAddr(j["العنوان"])) msg += `📍 العنوان: ${cleanAddr(j["العنوان"])}\n`;
  if(j.__contacts && j.__contacts.length) {
    msg += `📞 أرقام التواصل عند الوصول:\n`;
    j.__contacts.forEach(c => { msg += `  • ${c.name ? c.name + ": " : ""}${c.phone}\n`; });
  }
  msg += `⏰ التقديم واستلام الشغل في نفس اليوم\n`;
  return msg.trim();
}

function ageRange(txt){
  const t=String(txt||"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));
  const n=(t.match(/\d{1,2}/g)||[]).map(Number);
  if(!n.length)return null;
  if(n.length>=2)return{min:Math.min(n[0],n[1]),max:Math.max(n[0],n[1])};
  if(/لحد|حتى|لغاية|إلى|الى|أقل|اقل/.test(t))return{min:0,max:n[0]};
  if(/فوق|أكتر|اكتر|أكثر|\+|من/.test(t))return{min:n[0],max:0};
  return null;
}
function ageMsg(j,a){
  const r=ageRange(j["السن"]);if(!r||!a)return "";
  const rt=r.min&&r.max?"من "+r.min+" لـ "+r.max+" سنة":r.min?r.min+" سنة فأكتر":"لحد "+r.max+" سنة";
  if(r.min&&a<r.min)return "سنك غير مسموح، السن المطلوب "+rt;
  if(r.max&&a>r.max)return "سنك أكبر من المسموح، السن المطلوب "+rt;
  return "";
}

  const noExt=v=>{const t=String(v||"").replace(/[\u064B-\u0652]/g,"").replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/\s+/g," ").trim();if(!t)return false;
    const neg=/(^|\s)(لا|لا يوجد|لا توجد|مفيش|مفيهوش|مافيش|ماف?يهوش|غير متوفر\S*|غير متاح\S*|مش متوفر\S*|مش موجود\S*|بدون|عدم وجود)(\s|$)/.test(t);

  const parts=nt?nt.split(/\n|\||؛|(?<=\.)\s/).map(x=>x.trim()).filter(Boolean):[];

function loadH2C(){return new Promise((ok,no)=>{if(window.html2canvas)return ok();const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function saveJobAsImage(j, captureElem) {
  try {
    await loadH2C();
    const actionsBar = captureElem.querySelector('.cta');
    if(actionsBar) actionsBar.style.display = 'none';
    captureElem.classList.add('capmode');

    const canvas = await html2canvas(captureElem, {
      scale: 2,
      useCORS: true,
      allowTaint: true,
      backgroundColor: "#0E1A33"
    });
    
    if(actionsBar) actionsBar.style.display = 'flex';
    captureElem.classList.remove('capmode');

    canvas.toBlob((blob) => {
      if (!blob) return;
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${j["المصنع"]} - ${j["المنطقة"]}.png`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      alert("🖼️ تم حفظ صورة تفاصيل المصنع في جهازك بنجاح!");
    }, 'image/png');
  } catch (e) {
    const actionsBar = captureElem.querySelector('.cta');
    if(actionsBar) actionsBar.style.display = 'flex';
    captureElem.classList.remove('capmode');
    alert("حدث خطأ أثناء حفظ الصورة، جرّب 'نسخ كنص' من زرار شارك.");
  }
}
