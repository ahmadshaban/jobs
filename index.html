.dc.capmode .dtp{overflow:visible;flex:none}
.dc.capmode .dtp[hidden]{display:block}
.dc.capmode .dth{display:block;margin-top:.4rem;font-size:.8rem;font-weight:800;border-bottom:2px solid #F3E7B3}

/* صفحة التفاصيل بنفس ألوان الموقع */
.dc{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.dc .dh{background:#0B1626;border-bottom:3px solid var(--gold)}
.dc .dr{color:var(--gold)}
.dc .dg{background:var(--gold);color:var(--goldD)}
.dc .dsb button{background:transparent;color:var(--gold);border-color:var(--gold)}
.dc .dsb button.on{background:var(--gold);color:var(--goldD)}
.dc .d2>div{background:#1F3858;border:1px solid var(--bd);color:#fff}
.dc .d2 small{color:var(--mu)}
.dc .thint{color:var(--mu);opacity:1}
.dc .dtabs button{background:#1F3858;color:var(--tx);border:1.5px solid var(--bd)}
.dc .dtabs button.on{background:var(--gold);border-color:var(--gold);color:var(--goldD)}
.dc .rw,.dc .ct{border-bottom-color:var(--bd)}
.dc .rw span{color:var(--mu);opacity:1}
.dc .rw b,.dc .nt,.dc .ct span,.dc .ct b{color:#fff}
.dc .cth{color:var(--gold)}
.dc .ct a{background:var(--gold);color:var(--goldD)}
.dc .dnote{background:var(--gold);color:var(--goldD)}
.dc.capmode .dth{color:var(--gold);border-bottom-color:var(--gold)}
.dcw .dbar{background:#0B1626;border:1px solid var(--bd);border-radius:.9rem;padding:.35rem}
.dcw .dbtn{background:transparent;color:var(--gold);border-color:var(--gold)}
.dcw .dbtn.wa{background:var(--wa);border-color:var(--wa);color:#fff}

/* الاسم والقيمة الاتنين واضحين */
.dc .rw{font-size:0.88rem}
.dc .rw span{color:#D5E2F2;opacity:1;font-weight:700}
.dc .rw b{color:#fff;font-weight:800}

/* مسافة تحت الشريط عشان ما يستخبّاش ورا زراير النظام */


/* قايمة ☰ جانبية */
.topb{position:relative;height:0;padding:0}
.hmb{font:inherit;font-size:1.15rem;line-height:1;background:var(--card);color:var(--gold,#6FA8E6);border:1px solid var(--bd);border-radius:.7rem;min-width:2.25rem;min-height:2.25rem;cursor:pointer;position:absolute;top:.55rem;inset-inline-start:0;z-index:3}
header{padding-inline:calc(var(--px) + 2.3rem)}

#mbk{position:fixed;inset:0;z-index:9998;background:rgba(5,10,24,.5);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
#mbk.on{opacity:1;visibility:visible}
#main{display:flex;flex-direction:column;padding-bottom:0;min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
#list{padding-bottom:1.2rem}
.ft,#mnu .mfx{display:flex;justify-content:center;align-items:center;gap:.8rem;box-sizing:border-box;background:var(--bg);border-top:1px solid var(--gold)}
.ft{height:2.6rem;padding:0 .75rem;flex:none;margin:auto calc(var(--px)*-1) 0}
#mnu .mfx{height:calc(2.6rem + env(safe-area-inset-bottom,0px));padding:0 .75rem env(safe-area-inset-bottom,0px)}
.sc{display:flex;align-items:center;justify-content:center;width:1.7rem;height:1.7rem;flex:none;border-radius:50%;text-decoration:none;overflow:hidden}
.sc.wa{background:#25D366}.sc.wa .ic{width:.9rem;height:.9rem}
.sc.fbk{background:#fff}.sc.fbk .ic{width:100%;height:100%}
#mnu{position:fixed;top:0;bottom:0;right:0;z-index:9999;width:min(15rem,74vw);background:var(--card);border-left:1px solid var(--bd);box-shadow:-8px 0 24px rgba(0,0,0,.35);transform:translateX(105%);visibility:hidden;transition:transform .25s ease,visibility .25s;padding:calc(.6rem + env(safe-area-inset-top,0px)) .6rem .6rem;display:flex;flex-direction:column;gap:.2rem;overflow-y:auto}
#mnu.on{transform:none;visibility:visible}
#mnu .mh{display:flex;align-items:center;justify-content:space-between;padding:.2rem .3rem .6rem;margin-bottom:.3rem;border-bottom:1px solid var(--bd);font-weight:800;font-size:.85rem;color:var(--gold,#6FA8E6)}
#mnu .mh button{font:inherit;width:2rem;height:2rem;border-radius:50%;border:1px solid var(--bd);background:transparent;color:var(--tx);cursor:pointer;font-size:.85rem}
#mnu .mi{display:flex;align-items:center;gap:.5rem;font:inherit;font-weight:700;font-size:.85rem;color:var(--tx);text-decoration:none;padding:.7rem .8rem;min-height:2.75rem;box-sizing:border-box;border-radius:.7rem}
#mnu .mi:active{background:var(--acs);color:var(--gold,#6FA8E6)}
#mnu .mi .lk{margin-right:auto;opacity:.6;font-size:.75rem}
#mnu>.mi:last-of-type{margin-bottom:.8rem}
#mnu .mfx{align-self:stretch;flex:none;margin:auto -.6rem -.6rem;background:var(--card)}
#mnu .ms{margin-top:.4rem;padding:.7rem .8rem .2rem;border-top:1px solid var(--bd);font-size:.7rem;font-weight:700;color:var(--tx);opacity:.6}

#xo{display:none;position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.55);align-items:center;justify-content:center;padding:1.2rem}
#xo.on{display:flex}
#xo .xb{background:#172B46;color:#E8EFF8;border:1px solid #28425F;border-radius:1rem;padding:1rem;width:100%;max-width:18rem;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.45)}
#xo .xb p{margin:0 0 .8rem;font-weight:800;font-size:.95rem;line-height:1.6}
#xo .xr{display:flex;flex-direction:column;gap:.5rem}
#xo .xr button{font:inherit;font-weight:800;font-size:.88rem;border:0;border-radius:.75rem;min-height:2.6rem;cursor:pointer}
#xo #xn{background:#E8B730;color:#2E2000}
#xo #xy{background:transparent;color:#E8EFF8;border:1.5px solid #E5120F}
#cfno{border:2px solid #E5120F!important;font-weight:900!important}

/* فورم العمال: صفحة كاملة بخط أصغر */
#fo .sb .sh .ttl{font-size:.92rem!important}
#fo .sb .fl{font-size:.76rem!important;margin-top:.7rem!important}
#fo .sb .fl input{font-size:14px!important;padding:.5rem .8rem!important}
#fo .yn button{font-size:.8rem!important;padding:.45rem 0!important}
#fo .fgo .btn{font-size:.88rem!important}
#fo .tnote,#fo .sb p,#fo .sb small{font-size:.72rem!important}

/* صفوف التفاصيل كجدول (ريسبونسيف) */
.dc{--cw:clamp(5.2rem,27vw,7.5rem);--fz:clamp(.76rem,3.3vw,.84rem);--pd:clamp(.55rem,2.4vw,.75rem)}
.dc .dth{margin:.2rem .1rem .5rem!important}
.dc .rw{display:grid!important;grid-template-columns:var(--cw) minmax(0,1fr);gap:0!important;align-items:stretch!important;padding:0!important;margin:0!important;border:1px solid var(--bd)!important;border-top:0!important;overflow:hidden;font-size:var(--fz)!important}
.dc .dth+.rw{border-top:1px solid var(--bd)!important;border-radius:.7rem .7rem 0 0}
.dc .rw:last-child{border-radius:0 0 .7rem .7rem}
.dc .dth+.rw:last-child{border-radius:.7rem}
.dc .rw span{display:flex;align-items:center;padding:var(--pd) .6rem;color:#9FB3CB;font-weight:700;border-inline-end:1px solid var(--bd);background:rgba(255,255,255,.04)}
.dc .rw b{padding:var(--pd) .8rem;font-weight:700!important;text-align:start!important;line-height:1.7;color:#fff;white-space:normal!important;overflow-wrap:anywhere;font-size:var(--fz)!important}
.dc .ctb{margin:.6rem 0 .2rem}
.dc .cth{font-size:.8rem;font-weight:800;color:var(--gold);padding:.1rem .1rem .45rem}
.dc .ct{display:grid!important;grid-template-columns:var(--cw) minmax(0,1fr) auto;gap:0!important;align-items:stretch;padding:0!important;border:1px solid var(--bd)!important;border-top:0!important;overflow:hidden;font-size:var(--fz)!important}
.dc .cth+.ct{border-top:1px solid var(--bd)!important;border-radius:.7rem .7rem 0 0}
.dc .ct:last-child{border-radius:0 0 .7rem .7rem}
.dc .cth+.ct:last-child{border-radius:.7rem}
.dc .ct span{display:flex;align-items:center;padding:var(--pd) .6rem;color:#9FB3CB;font-weight:700;border-inline-end:1px solid var(--bd);background:rgba(255,255,255,.04)}
.dc .ct b{display:flex;align-items:center;justify-content:center;padding:var(--pd) .5rem}
.dc .ct a{align-self:center;margin:.3rem .5rem;min-height:2.1rem}
.dc .nt{border:1px solid var(--bd);border-radius:.7rem;padding:.8rem!important;font-size:clamp(.78rem,3.4vw,.86rem)!important;line-height:1.8!important}
/* تبويبات أصغر + فلتر أكبر قبل الاختيار */
.dc .dtabs{gap:.3rem;margin:.2rem .5rem 0}
.dc .dtabs button{min-height:2.3rem;font-size:.8rem;padding:0 .5rem;gap:.3rem;border-radius:.55rem}
.dc .dtabs button .ta{font-size:.75rem}
.prefilter .frow .seg button{font-size:1.05rem;padding:.7rem 0;min-height:3.4rem;border-radius:.9rem}
.prefilter .frow .ddb{font-size:1.05rem;padding:.8rem 1rem;min-height:3.4rem;border-radius:.9rem}

.it.pay2{background:#F3E7B3;color:#1E2F46}.it.pay2 b{color:#1E2F46}
.pay,.hero{color:#1E2F46}.hero b{color:#1E2F46}
.retry{color:#0F2236}
</style>

let IS_CC=false,GV="",AREAS_CSV_URL="",SHEET_CSV_URL="";

const done=j=>(j["الحالة"]||"").includes("مكتمل")||!!j.__allClosed;

function pays(j){const a=[];if(j[P30])a.push(["30 يوم عمل",j[P30]]);if(j[P26])a.push([OFF26,j[P26]]);return a}
const numOf=s=>{const t=String(s||"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/,/g,"");const m=t.match(/\d+(\.\d+)?/);return m?+m[0]:0};

function parseShifts(txt){return String(txt||"").split(/\n/).map(l=>l.trim()).filter(Boolean).map(l=>{const p=l.split("|").map(x=>x.trim());const s={h:p[0]||"",p30:"",p26:""};p.slice(1).forEach(x=>{if(x==="مكتمل"){s.done=true;return}const m=x.match(/^(30|26)\s*يوم\s*:\s*(.*)$/);if(m)s["p"+m[1]]=m[2].trim()});return s}).filter(s=>s.h||s.p30||s.p26)}

/* تحليل أرقام التواصل المنظمة، مع الاستخراج التلقائي من خانة العنوان لو خانة أرقام التواصل فاضية */
function parseContacts(j){
  let list = [];
  // 1. فحص خانة أرقام التواصل المستقلة إن وجدت
  if(j["أرقام التواصل"]) {
    String(j["أرقام التواصل"]).split(/\n/).forEach(l => {
      const p = l.split("|").map(x=>x.trim());
      if(p[0]) list.push({ name: p[1]?p[0]:"", phone: p[1]||p[0] });
    });
  }
  // 2. الاستخراج التلقائي الذكي من خانة العنوان القديم لو أرقام التواصل فاضية
  if(list.length === 0 && j["العنوان"]) {
    const addr = j["العنوان"];
    // البحث عن أرقام هواتف مصرية تبدأ بـ 01 ويتكون من 10 أو 11 رقم
    const phoneRegex = /(?:01[0125]\d{8}|(?:\+2)?01[0125]\d{8})/g;
    let match;
    while ((match = phoneRegex.exec(addr)) !== null) {
      const phoneNum = match[0];
      // محاولة استخراج اسم مسبق للرقم (مثل اسم الشخص قبل الرقم بكلمات قليلة)
      const subStr = addr.substring(Math.max(0, match.index - 25), match.index);
      const cleanName = subStr.replace(/[:\-,\s]+$/, "").split(/[\s,\-]+/).pop() || "";
      list.push({ name: isNaN(cleanName)?cleanName:"", phone: phoneNum });
    }
  }
  return list;
}

const cleanAddr=a=>{a=String(a||"");if(IS_CC)return a;return a.replace(/\s*(?:و?كلّ?مني|و?(?:ت|ا)تصل)(?:\s+(?:ع|على))?(?:\s+(?:الرقم|رقم))?\s*[:：\-–_]*\s*$/,"").trim()};
function topShift(a){let b={v:"",h:""},m=0;a.forEach(s=>[s.p30,s.p26].forEach(x=>{const n=numOf(x);if(n>m){m=n;b={v:x,h:s.h}}}));return b}
function prep(j){
  const a=parseShifts(j["الورديات"]);
  j.__allClosed=a.length>0&&a.every(s=>s.done);
  j.__sh=a;
  j.__contacts=IS_CC?parseContacts(j):[];
  if(a.length===1){j["الشفت"]=a[0].h;j[P30]=a[0].p30;j[P26]=a[0].p26}else if(a.length>1){j["الشفت"]="";j[P30]="";j[P26]="";j["المرتب"]=""}
  return j;
}
const isMulti=j=>!!(j.__sh&&j.__sh.length>1);
function payText(j){if(isMulti(j))return j.__sh.map(s=>s.h+": "+[s.p30&&"30 يوم "+s.p30,s.p26&&"26 يوم "+s.p26].filter(Boolean).join(" / ")).join(" | ");const a=pays(j);return a.length?a.map(x=>x[0]+": "+x[1]).join(" | "):(j["المرتب"]||"")}


const REQ={name:true,age:true,from:false,housing:false};
const AGE_MIN=16,AGE_MAX=60;
const SAVE_KEY="jobform";

  try{if(v)sessionStorage.setItem("jobsrc",v);else v=sessionStorage.getItem("jobsrc")||""}catch(e){}return v})();

const STATS_URL="https://script.google.com/macros/s/AKfycbwr_pFD5PMl-cSyBS6vFf-Pa_Mr8pc_zxHUxPfHHjAWtkwME0iIEBPwvvm0cOjn_f4f/exec"; // <<< غيّر هنا: رابط سكريبت الإحصائيات

const __tv=new Set();
function track(t,j){try{if(STATS_URL.indexOf("PASTE_")===0)return;
if(t==="visit"){if(sessionStorage.getItem("tv"))return;sessionStorage.setItem("tv","1")}
if(t==="view"&&j){const k=String(j["المصنع"]);if(__tv.has(k))return;__tv.add(k)}
const q=new URLSearchParams({a:"log",t:t,f:j?(j["المصنع"]||""):"",r:j?(j["المنطقة"]||""):"",s:SRC||"",p:(location.pathname.split("/").pop()||"index.html"),v:VID});
fetch(STATS_URL+"?"+q,{mode:"no-cors",keepalive:true})}catch(e){}}
const hid=n=>{let h=5381;for(const c of String(n))h=((h<<5)+h+c.charCodeAt(0))>>>0;return h.toString(36)};

const manual=j=>{const n=parseFloat(j["الترتيب"]);if(!isNaN(n))return n;return (j["تثبيت"]||"").trim()==="نعم"?0:null};
const rank=j=>done(j)?2:(manual(j)!==null?0:1);
function payScore(j){
  const c=[j[P30],j[P26],j["المرتب"],...(j.__sh||[]).flatMap(s=>[s.p30,s.p26])];
  let m=0;c.forEach(x=>{let n=numOf(x);if(n&&/اليوم|يومي|يومية/.test(String(x)))n*=26;if(n>m)m=n});return m}
const byOrder=(x,y)=>rank(x)-rank(y)||(rank(x)===0?manual(x)-manual(y):(rank(x)===1?payScore(y)-payScore(x):0));

function isNew(j){const t=(j["تاريخ الإضافة"]||"").match(/(\d{1,4})[\/\-.](\d{1,2})[\/\-.](\d{1,4})/);if(!t)return false;
 let y,m,d;if(t[1].length===4){y=+t[1];m=+t[2];d=+t[3]}else{d=+t[1];m=+t[2];y=+t[3];if(y<100)y+=2000}
 const days=(Date.now()-new Date(y,m-1,d))/864e5;return days>=-1&&days<=NEW_DAYS}

const daily=j=>(j["قبض يومي"]||"").trim()==="نعم";
const tags=j=>(done(j)?'<span class="badge dn">مكتمل</span>':'')+(daily(j)?'<span class="badge dy">💵 قبض يومي</span>':'')+(urgent(j)?'<span class="badge ur">🔥 الأكثر تقديمًا</span>':'')+(isNew(j)?'<span class="badge nw">جديد</span>':'');
const ICONS={"العنوان":"📍","السن":"🎂","طبيعة العمل":"👷","الشفت":"⏰","المؤهل":"🎓","نظام القبض":"💰","السكن":"🏠","السلف":"💵","المواصلات":"🚌","وجبة":"🍽️","التأمينات":"🛡️","الأجازة":"📅"};

{const ph=PHONE.replace(/\D/g,"");const tp=document.getElementById("tph"),fb=document.getElementById("fab");
 if(tp)tp.textContent="📞 واتساب: 0"+ph.replace(/^20/,"");
 const wl="https://wa.me/"+ph+"?text="+encodeURIComponent("السلام عليكم، عندي استفسار بخصوص الوظايف");if(fb)fb.href=wl;const fw=document.getElementById("fwa");if(fw)fw.href=wl;}

let JOBS=[],cat="",area="الكل",picked=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function parseRows(t){const r=[];let row=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];
 if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
 else if(c=='"')q=true;else if(c==","){row.push(f);f=""}
 else if(c=="\n"){row.push(f);r.push(row);row=[];f=""}else if(c!="\r")f+=c}
 if(f||row.length){row.push(f);r.push(row)}
 return r}
function parseCSV(t){const r=parseRows(t);if(!r.length)throw 0;const h=r[0].map(x=>x.trim());return r.slice(1).filter(x=>x.some(v=>v.trim())).map(x=>Object.fromEntries(h.map((k,i)=>[k,(x[i]||"").trim()])))}

let AREA_ORDER=[];
const norm=t=>String(t||"").replace(/[\u064B-\u0652\u0640]/g,"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d))
  .replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").trim().split(/\s+/)
  .filter(w=>w&&w!=="مدينه").map(w=>w.replace(/^ال/,"")).join("");
const sameArea=(a,b)=>{a=norm(a);b=norm(b);if(!a||!b)return false;return a===b||(a.length>=3&&b.length>=3&&(a.includes(b)||b.includes(a)))};
const areaRank=a=>{const i=AREA_ORDER.findIndex(x=>sameArea(x,a));return i<0?9999:i};

async function getText(u,ms){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
  try{const r=await fetch(u+"&_="+Date.now(),{signal:c.signal,cache:"no-store"});if(!r.ok)throw 0;return await r.text()}finally{clearTimeout(t)}}
function showErr(){
  $("cnt").textContent="";$("empty").style.display="none";$("seg").innerHTML="";$("area").innerHTML="";
  $("list").innerHTML='<div class="empty" style="display:block">😕 فيه مشكلة في تحميل الوظايف دلوقتي 🙏<br><button type="button" class="retry" id="retry">دوس هنا وجرّب تاني</button></div>';
  $("retry").onclick=load;
}
const CK="jobs_cache_v2";
const sid=()=>IS_CC?CC_ID:WORKER_SHEET_ID;
function readCache(){try{const c=JSON.parse(localStorage.getItem(CK)||"null");return c&&c.id===sid()&&typeof c.j==="string"?c:null}catch(e){return null}}
function writeCache(j,a){try{localStorage.setItem(CK,JSON.stringify({id:sid(),t:Date.now(),j:j,a:a}))}catch(e){}}
const getRetry=(u,ms)=>getText(u,ms).catch(()=>getText(u,ms));
function jobsOK(jt){try{const d=parseCSV(jt);return !d.length||("المصنع" in d[0])}catch(e){return false}}
function applyData(jt,at){
  const d=parseCSV(jt);
  AREA_ORDER=[];
  if(at){try{const rows=parseRows(at);
    if(rows.length&&rows[0].length===1){const st=norm(rows[0][0])===norm("المنطقة")?1:0;
      AREA_ORDER=rows.slice(st).map(x=>(x[0]||"").trim()).filter(Boolean)}}catch(e){}}
  JOBS=d.filter(j=>(j["ظاهر؟"]||"نعم").trim()!=="لا"&&j["المصنع"]).map(prep);
}
let FIRST=true;
function afterApply(){
  if(FIRST){
    const urlParams=new URLSearchParams(location.search);
    const jq=urlParams.get("j"),areaParam=urlParams.get("area");
    if(areaParam){area=areaParam;picked=true;if(!cat)cat="شباب"}
    if(jq){const k=JOBS.findIndex(x=>hid(x["المصنع"])===jq);history.replaceState(history.state,"",location.pathname+(IS_CC&&!CC_PAGE?"?cc="+encodeURIComponent(CC_ID):"")+(k>-1?"#job"+k:""))}
  }
  draw();
  if(FIRST){route();FIRST=false}
}
async function load(){
  if(CC_PAGE&&!CC_ID){CC_ID=CC_SHEET_ID;setSrc()}
  const ck=readCache();
  let shown=false;
  if(ck&&jobsOK(ck.j)){applyData(ck.j,ck.a);shown=true;afterApply()}
  else $("list").innerHTML='<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
  const [jr,ar]=await Promise.allSettled([getRetry(SHEET_CSV_URL,8000),getText(AREAS_CSV_URL,3000)]);
  const jt=jr.status==="fulfilled"?jr.value:null,at=ar.status==="fulfilled"?ar.value:"";
  if(jt===null||!jobsOK(jt)){
    if(!shown){if(CC_PAGE){try{localStorage.removeItem("jobcc")}catch(e){}CC_ID="";setSrc()}showErr()}
    return}
  if(shown&&ck.j===jt&&ck.a===at)return;
  writeCache(jt,at);
  if(shown&&$("detail").style.display!=="none")return;
  applyData(jt,at);afterApply();
}
const kind=c=>c.includes("بنات")&&c.includes("شباب")?"":c.includes("بنات")?"g":"m";
function hoursOnly(value){const s=String(value||"").trim();const m=s.match(/(\d{1,2})\s*ساعة/);if(m)return m[1]+" ساعة";const n=s.match(/(\d{1,2})\s*ساعات/);if(n)return n[1]+" ساعة";return s||"مش محدد"}
function matchCat(j){return !cat||cat==="الكل"||(j["الفئة"]||"").includes(cat)}

function draw(){
  const cats=["شباب","بنات"];
  $("seg").innerHTML=cats.map(c=>`<button class="${c===cat?"on":""}" data-v="${c}">${c===cat?"✓ ":(c==="شباب"?"👨 ":"👩 ")}${c}</button>`).join("");
  $("seg").querySelectorAll("button").forEach(b=>b.onclick=()=>{cat=b.dataset.v;draw()});
  const seen=[...new Set(JOBS.filter(matchCat).map(j=>j["المنطقة"]).filter(Boolean))];
  const areas=["الكل",...seen.map((a,i)=>[a,i]).sort((x,y)=>(areaRank(x[0])-areaRank(y[0]))||(x[1]-y[1])).map(x=>x[0])];
  if(!areas.includes(area))area="الكل";
  const cntOf=a=>JOBS.filter(j=>matchCat(j)&&!done(j)&&(a==="الكل"||j["المنطقة"]===a)).length;
  
  $("area").innerHTML=`<button type="button" id="areaBtn" class="ddb ${area!=="الكل"?"on":""}"><span>📍 ${area==="الكل"?"اختار المنطقة":esc(area)}<span class="cn">${cntOf(area)} وظيفة</span></span><span class="car">▾</span></button>`;
  $("areaBtn").onclick=openArea;

function buildJobText(j) {
  // نص المشاركة يبدأ دائمًا باسم المصنع والمنطقة، ثم المرتب والوردية.
  let msg = `📍 المصنع: ${j["المصنع"] || "غير محدد"}\n📌 المنطقة: ${j["المنطقة"] || "غير محددة"}\n`;
  if(!isMulti(j) && j["الشفت"]) msg += `⏰ الشفت: ${hoursOnly(j["الشفت"])}\n`;
  msg += `💰 المرتب: ${payText(j) || "يراجع داخل التفاصيل"}\n`;

  // الحقول الأساسية التي كان النسخ يتجاوزها سابقًا.
  const fields = ["الفئة", "السن", "طبيعة العمل", "المؤهل", "الأجازة", "نظام القبض", "السلف", "التأمينات", "وجبة", "السكن", "المواصلات"];
  const added = new Set(["المصنع", "المنطقة", "الشفت", "المرتب", "مرتب 30 يوم", "مرتب 26 يوم", "الورديات", "العنوان", "أرقام التواصل", "__sh", "__contacts", "الفئة", "السن", "طبيعة العمل", "المؤهل", "الأجازة", "نظام القبض", "السلف", "التأمينات", "وجبة", "السكن", "المواصلات", "تفاصيل المرتب", "ملاحظات", "تثبيت", "الترتيب", "آخر تعديل", "ظاهر؟", "الحالة", "تاريخ الإضافة", "قبض يومي"]);
  for (const k of fields) {
    if (!j[k]) continue;
    msg += `${ICONS[k] || "•"} ${k}: ${j[k]}\n`;
  }
  if(daily(j)) msg += `💵 قبض يومي: بتقبض يوميتك بعد ما تخلّص الشغل\n`;
  if(j["تفاصيل المرتب"]) msg += `📝 تفاصيل المرتب: ${j["تفاصيل المرتب"]}\n`;
  if(j["ملاحظات"]) msg += `📝 ملاحظات: ${j["ملاحظات"]}\n`;

  // تضمين أي حقول إضافية موجودة في الشيت بدل إسقاطها من النص المنسوخ.
  Object.keys(j).forEach(k => {
    if (added.has(k) || !j[k] || k.startsWith("__")) return;
    msg += `${ICONS[k] || "•"} ${k}: ${j[k]}\n`;
  });

  if(cleanAddr(j["العنوان"])) msg += `📍 العنوان: ${cleanAddr(j["العنوان"])}\n`;
  if(j.__contacts && j.__contacts.length) {
    msg += `📞 أرقام التواصل عند الوصول:\n`;
    j.__contacts.forEach(c => { msg += `  • ${c.name ? c.name + ": " : ""}${c.phone}\n`; });
  }
  msg += `⏰ التقديم واستلام الشغل في نفس اليوم\n`;
  return msg.trim();
}

function ageRange(txt){
  const t=String(txt||"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));
  const n=(t.match(/\d{1,2}/g)||[]).map(Number);
  if(!n.length)return null;
  if(n.length>=2)return{min:Math.min(n[0],n[1]),max:Math.max(n[0],n[1])};
  if(/لحد|حتى|لغاية|إلى|الى|أقل|اقل/.test(t))return{min:0,max:n[0]};
  if(/فوق|أكتر|اكتر|أكثر|\+|من/.test(t))return{min:n[0],max:0};
  return null;
}
function ageMsg(j,a){
  const r=ageRange(j["السن"]);if(!r||!a)return "";
  const rt=r.min&&r.max?"من "+r.min+" لـ "+r.max+" سنة":r.min?r.min+" سنة فأكتر":"لحد "+r.max+" سنة";
  if(r.min&&a<r.min)return "سنك غير مسموح، السن المطلوب "+rt;
  if(r.max&&a>r.max)return "سنك أكبر من المسموح، السن المطلوب "+rt;
  return "";
}

  if(!noTr)add("🚌","المواصلات",j["المواصلات"]);
  const COND=/شرط|شروط|يشترط|مشترط|لازم|يلزم|ضروري|إلزامي|ممنوع|مينفعش|مطلوب|فقط|إلا|الا |تجنيد|فيش|صحيفة|شهادة|كشف|غير مقبول|مش مقبول|مقبول/;
  const parts=nt?nt.split(/\n|\||؛|(?<=\.)\s/).map(x=>x.trim()).filter(Boolean):[];
  const cond=parts.filter(x=>COND.test(x)),plain=parts.filter(x=>!COND.test(x));
  if(plain.length)add("📝","ملاحظات",plain.join("\n"));
  const warn=(noTr?`<div style="margin:.1rem 0 .35rem;padding:.35rem .55rem;border-radius:.6rem;background:rgba(59,130,246,.12);border:1px solid rgba(96,165,250,.55);color:#BFDBFE;font-weight:800;font-size:.76rem;line-height:1.5">${noTr==="int"?"ℹ️ المواصلات في المصنع ده داخلية بس"+(/سكن/.test(trv)?"، من السكن للمصنع والعكس":""):"ℹ️ المصنع ده مفيهوش مواصلات خارجية"+(trv.length>6?`<div style="font-weight:700;font-size:.72rem;opacity:.85">${esc(trv)}</div>`:"")}</div>`:"")+(cond.length?`<div style="margin:.1rem 0 .4rem;padding:.55rem .65rem;border-radius:.7rem;background:rgba(245,158,11,.16);border:2px solid #F59E0B;font-weight:800;font-size:.88rem;line-height:1.55"><div style="color:#F59E0B;font-weight:900;margin-bottom:.15rem">⚠️ شروط الإعلان</div><div style="white-space:pre-line;overflow-wrap:anywhere">${esc(cond.join("\n"))}</div></div>`:"");
  const el=document.createElement("div");el.className="ov show";el.id="cf";el.style.zIndex="30";el.style.alignItems="center";
  el.innerHTML=`<div class="sheet" style="border-radius:1.1rem;width:calc(100% - 3rem);max-width:20rem;max-height:72%;border:3px solid #F59E0B;box-shadow:0 0 0 5px rgba(245,158,11,.28),0 14px 40px rgba(0,0,0,.4);animation:cfpop .25s ease-out"><div class="sb" style="padding:.8rem .9rem .3rem;overflow-y:auto"><h2 class="ttl" style="margin:0 0 .35rem;font-size:.95rem;color:#F59E0B">تأكيد قبل الإرسال</h2>${warn}${rows.map(r=>`<div style="display:flex;gap:.5rem;padding:.35rem 0;border-top:1px solid var(--bd);line-height:1.45"><span>${r[0]}</span><div style="min-width:0;flex:1"><small style="display:block;opacity:.7;font-size:.72rem">${esc(r[1])}</small>${r[3]?r[3]:`<b style="font-size:.84rem;white-space:pre-line;overflow-wrap:anywhere">${esc(r[2])}</b>`}</div></div>`).join("")}</div><div style="display:flex;gap:.6rem;padding:.5rem .9rem .8rem"><button type="button" class="btn wa" id="cfok" style="min-height:2.4rem;font-size:.88rem">تمام، ابعت</button><button type="button" class="btn" id="cfno" style="min-height:2.4rem;font-size:.88rem">رجوع</button></div></div>`;
  document.body.appendChild(el);
  const x=()=>el.remove();
  window.addEventListener("popstate",x,{once:true});
  el.onclick=e=>{if(e.target===el)x()};
  document.getElementById("cfno").onclick=x;

}

function loadH2C(){return new Promise((ok,no)=>{if(window.html2canvas)return ok();const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function saveJobAsImage(j, captureElem) {
  try {
    await loadH2C();
    const actionsBar = captureElem.querySelector('.cta');
    if(actionsBar) actionsBar.style.display = 'none';
    captureElem.classList.add('capmode');

    const canvas = await html2canvas(captureElem, {
      scale: 2,
      useCORS: true,
      allowTaint: true,
      backgroundColor: "#0F1C2E"
    });
    
    if(actionsBar) actionsBar.style.display = 'flex';
    captureElem.classList.remove('capmode');

    canvas.toBlob((blob) => {
      if (!blob) return;
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${j["المصنع"]} - ${j["المنطقة"]}.png`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      alert("🖼️ تم حفظ صورة تفاصيل المصنع في جهازك بنجاح!");
    }, 'image/png');
  } catch (e) {
    const actionsBar = captureElem.querySelector('.cta');
    if(actionsBar) actionsBar.style.display = 'flex';
    captureElem.classList.remove('capmode');
    alert("حدث خطأ أثناء حفظ الصورة، جرّب 'نسخ كنص' من زرار شارك.");
  }
}

function showDetail(j){
  track("view",j);
  const ph=PHONE.replace(/\D/g,"");
  const cell=x=>x?esc(String(x).replace(/\s*في الشهر/,"")):"—";
  const multi=isMulti(j);
  const pay=i=>multi?j.__sh[i]:{h:j["الشفت"]||"",p30:j[P30]||"",p26:j[P26]||""};
  const hasTiles=multi||!!(j[P30]||j[P26]);
  const hasPay=hasTiles||!!j["المرتب"];
  const rw=(k,l,v)=>{v=v===undefined?j[k]:v;return v?`<div class="rw"><span>${esc(l||k)}</span><b>${esc(v)}</b></div>`:""};
  const plainSh=/^\s*\d{1,2}\s*(ساعة|ساعات)\s*$/.test(j["الشفت"]||"");
  const fixedUsed=["المنطقة","الفئة","المصنع","العنوان","أرقام التواصل","الشفت","السن","طبيعة العمل","المؤهل","الأجازة","نظام القبض","السلف","التأمينات","وجبة","السكن","المواصلات","المرتب","مرتب 30 يوم","مرتب 26 يوم","تفاصيل المرتب","الورديات","تثبيت","الترتيب","آخر تعديل","ظاهر؟","الحالة","تاريخ الإضافة","ملاحظات","الأساسي","حافز الانتظام","قبض يومي"];
  const otherKeys=Object.keys(j).filter(k=>!k.startsWith("__")&&!fixedUsed.includes(k)&&j[k]);
  const nc=IS_CC&&j.__contacts?j.__contacts.length:0;
  const ctHTML=nc?`<div id="ctbox" class="ctb"><div class="cth">📞 أرقام التواصل</div>${j.__contacts.map(c=>`<div class="ct"><span>${c.name?esc(c.name):"رقم"}</span><b>${esc(c.phone)}</b><a href="tel:${esc(c.phone)}">اتصال</a></div>`).join("")}</div>`:"";
  const basics=[rw("المنطقة"),rw("الفئة"),rw("السن"),plainSh?"":rw("الشفت"),rw("طبيعة العمل"),rw("المؤهل"),rw("الأجازة")].join("");
  const payR=[rw("قبض يومي","💵 قبض يومي",daily(j)?"بتقبض يوميتك بعد ما تخلّص الشغل":""),rw("نظام القبض"),rw("الأساسي"),rw("حافز الانتظام"),rw("السلف","السلفة"),rw("وجبة","الأكل"),rw("التأمينات"),rw("تفاصيل المرتب")].join("");
  const hous=[rw("السكن"),rw("المواصلات"),rw("العنوان","العنوان",cleanAddr(j["العنوان"])),ctHTML,...otherKeys.map(k=>rw(k))].join("");
  const tabs=[["📋","الأساسيات",basics],["💰","الدفع والمميزات",payR],["🏠","السكن والمواصلات",hous],...(j["ملاحظات"]?[["📝","ملاحظات",`<div class="nt">${esc(j["ملاحظات"])}</div>`]]:[])].filter(t=>t[2]);
  const hi=tabs.findIndex(t=>t[1]==="السكن والمواصلات");
  const shBtns=multi?`<div class="dsb">${j.__sh.map((s,i)=>`<button type="button" data-i="${i}" class="${i?"":"on"}${s.done?" shcl":""}">${esc(hoursOnly(s.h))}${s.done?" (مكتملة)":""}</button>`).join("")}</div>`:"";
  const call=nc===1?`<a class="dbtn" href="tel:${esc(j.__contacts[0].phone)}">📞 اتصل</a>`:nc>1?`<button type="button" class="dbtn" id="callBtn">📞 اتصل</button>`:"";
  const bar=IS_CC?`<button type="button" class="dbtn wa" id="apply">💬 قدّم دلوقتي</button>${call}<button type="button" class="dbtn" id="shareBtn">📤 شارك</button>`:`<div class="dwn">للتقديم ارجع للمسؤول اللي بعتلك اللينك ده وهو يكمّلك إجراءات التقديم.</div><button type="button" class="dbtn" id="shareBtn">📤 شارك</button>`;
  $("detail").innerHTML=`<div class="dcw"><div class="dc" id="captureArea">
   <div class="dh"><div class="dr"><button type="button" class="dback" id="ex">→ رجوع</button><span>📍 ${esc(j["المنطقة"])}${j["الفئة"]?" · "+esc(j["الفئة"]):""}</span></div><h2 class="dn">${esc(j["المصنع"])}</h2></div>
   ${hasPay?`<div class="dg"><small>${daily(j)?"اليومية":"المرتب الشهري"}</small><b id="dgv"></b><small id="dgs"></small></div>`:""}
   ${shBtns}
   ${hasTiles?`<div class="d2"><div><small>30 يوم عمل</small><b id="d30"></b></div><div><small>26 يوم + 4 أجازة</small><b id="d26"></b></div></div>`:""}
   ${tabs.length?`<div class="thint"><span class="ar">👇</span> دوس على أي زرار تشوف تفاصيله</div><div class="dtabs">${tabs.map((t,i)=>`<button type="button" class="${i?"":"on"}"><span>${t[0]}</span><span class="tl">${t[1]}</span><span class="ta">▾</span></button>`).join("")}</div>${tabs.map((t,i)=>`<div class="dtp"${i?" hidden":""}><div class="dth">${t[0]} ${t[1]}</div>${t[2]}</div>`).join("")}`:""}
   <div class="dnote">⏰ التقديم واستلام الشغل في نفس اليوم</div>
  </div><div class="dbar">${bar}</div></div>${IS_CC?formHTML(j):""}`;

  $("main").style.display="none";$("detail").style.display="block";window.scrollTo(0,0);
  $("ex").onclick=exitDetail;
  const fit=()=>{const w=document.querySelector("#detail .dcw");if(!w)return;const vv=window.visualViewport,h=vv?vv.height:window.innerHeight,cs=getComputedStyle(document.documentElement);w.style.height=Math.max(300,h-(parseFloat(cs.paddingTop)||0)-(parseFloat(cs.paddingBottom)||0))+"px"};
  window.__dcFn=fit;fit();requestAnimationFrame(fit);setTimeout(fit,300);setTimeout(fit,1000);
  if(!window.__dcFit){window.__dcFit=1;const f=()=>window.__dcFn&&window.__dcFn();window.addEventListener("resize",f);if(window.visualViewport)visualViewport.addEventListener("resize",f);window.addEventListener("orientationchange",()=>setTimeout(f,200))}

  let si=multi?Math.max(0,j.__sh.findIndex(s=>!s.done)):0;
  const shb=[...document.querySelectorAll("#detail .dsb button")];
  const upd=()=>{
    if(!hasPay)return;
    const p=pay(si),m=p.p30||p.p26||(multi?"":j["المرتب"]||"");
    const mode=p.p30?"30 يوم عمل":p.p26?"26 يوم عمل + 4 أجازة":"";
    $("dgv").innerHTML=cell(m);
    $("dgs").textContent=[p.h?"وردية "+hoursOnly(p.h):"",mode].filter(Boolean).join(" · ");
    if(hasTiles){$("d30").innerHTML=cell(p.p30);$("d26").innerHTML=cell(p.p26)}
    shb.forEach(b=>b.classList.toggle("on",+b.dataset.i===si));
  };
  shb.forEach(b=>b.onclick=()=>{si=+b.dataset.i;upd()});
  upd();

  let cur=0;
  const tb=[...document.querySelectorAll("#detail .dtabs button")],tp=[...document.querySelectorAll("#detail .dtp")];
  const openT=i=>{cur=cur===i?-1:i;tb.forEach((b,x)=>b.classList.toggle("on",x===cur));tp.forEach((p,x)=>{p.hidden=x!==cur})};
  tb.forEach((b,i)=>b.onclick=()=>openT(i));

  $("shareBtn").onclick=()=>{track("share",j);openSingleCopyModal(j);$("btnSaveSingleImg").onclick=()=>{closeSingleCopyModal();saveJobAsImage(j,$("captureArea"))}};
  const cb=$("callBtn");
  if(cb)cb.onclick=()=>{track("call",j);cur=-1;openT(hi);const c=$("ctbox");if(c)c.scrollIntoView({block:"nearest"})};
  document.querySelectorAll("#detail a[href^=\"tel:\"]").forEach(a=>a.addEventListener("click",()=>track("call",j)));
  if(IS_CC)setupApply(j,ph);
}
